name: Actor geometry-derived material export

on:
  push:
    branches:
      - feat/actor-lit-hollowed-ashling
    paths:
      - tools/art/export-lit-actor-materials.py
      - tools/art/validate-lit-actor-materials.py
      - .github/workflows/actor-lit-materials.yml
  workflow_dispatch:
  pull_request:
    branches:
      - feat/universal-gpu-lighting-g0-g1
    paths:
      - tools/art/**
      - src/Wyrmforge.Presentation.Web/wwwroot/art/enemies/hollow-rigged/**
      - src/Wyrmforge.Presentation.Web/wwwroot/art/enemies/ashling-rigged/**
      - src/Wyrmforge.Presentation.Web/wwwroot/js/lighting/actor-*.js
      - tests/javascript/actor-lit-materials.test.mjs
      - tests/Wyrmforge.Browser.Tests/ActorLitSpriteBrowserTests.cs
      - .github/workflows/actor-lit-materials.yml

permissions:
  contents: write

concurrency:
  group: actor-lit-materials-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export:
    if: github.event_name != 'pull_request' && github.repository == 'pjotrcasteel/Wyrmforge'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU mesh-raster dependencies
        run: python -m pip install --disable-pip-version-check "numpy<2.4" Pillow numba
      - name: Render material passes from original sampled geometry
        run: python tools/art/export-lit-actor-materials.py
      - name: Validate frame synchronization and source provenance
        run: python tools/art/validate-lit-actor-materials.py
      - name: Commit only regenerated actor materials to the task branch
        run: |
          git add src/Wyrmforge.Presentation.Web/wwwroot/art/enemies/hollow-rigged/*normal.png
          git add src/Wyrmforge.Presentation.Web/wwwroot/art/enemies/hollow-rigged/*depth.png
          git add src/Wyrmforge.Presentation.Web/wwwroot/art/enemies/hollow-rigged/*caster.png
          git add src/Wyrmforge.Presentation.Web/wwwroot/art/enemies/hollow-rigged/lit-material-manifest.json
          git add src/Wyrmforge.Presentation.Web/wwwroot/art/enemies/ashling-rigged/*normal.png
          git add src/Wyrmforge.Presentation.Web/wwwroot/art/enemies/ashling-rigged/*depth.png
          git add src/Wyrmforge.Presentation.Web/wwwroot/art/enemies/ashling-rigged/*caster.png
          git add src/Wyrmforge.Presentation.Web/wwwroot/art/enemies/ashling-rigged/lit-material-manifest.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(actors): export geometry-derived lit material atlases"
            git push origin HEAD:feat/actor-lit-hollowed-ashling
          fi

  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Validate common sprite-frame contract
        run: node --test tests/javascript/actor-lit-materials.test.mjs tests/javascript/universal-lighting.test.mjs
      - name: Build actual browser test and app
        run: |
          dotnet build tests/Wyrmforge.Browser.Tests -c Release
          dotnet publish src/Wyrmforge.Presentation.Web -c Release -o artifacts/web
      - name: Install Chromium
        run: pwsh tests/Wyrmforge.Browser.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Run 976-frame shared GPU animation review at both mobile viewports
        env:
          WYRMFORGE_BASE_URL: http://127.0.0.1:4173/
          WYRMFORGE_BROWSER_ARTIFACTS: ${{ github.workspace }}/artifacts/lit-actors
        run: |
          python3 tools/development/spa_server.py --port 4173 --directory artifacts/web/wwwroot > artifacts/actor-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          dotnet test tests/Wyrmforge.Browser.Tests -c Release --no-build --filter FullyQualifiedName~ActorLitSpriteBrowserTests
      - name: Preserve review screenshots and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hollowed-ashling-lit-review-${{ github.sha }}
          path: |
            artifacts/lit-actors/
            artifacts/actor-server.log
          retention-days: 30
