name: Actor geometry-derived material export

on:
  push:
    branches:
      - feat/actor-lit-hollowed-ashling
    paths:
      - tools/art/export-lit-actor-materials.py
      - tools/art/validate-lit-actor-materials.py
      - .github/workflows/actor-lit-materials.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actor-lit-materials-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export:
    if: github.repository == 'pjotrcasteel/Wyrmforge'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU mesh-raster dependencies
        run: python -m pip install --disable-pip-version-check "numpy<2.4" Pillow numba
      - name: Render material passes from original sampled geometry
        run: python tools/art/export-lit-actor-materials.py
      - name: Validate frame synchronization and source provenance
        run: python tools/art/validate-lit-actor-materials.py
      - name: Commit only regenerated actor materials to the task branch
        run: |
          git add src/Wyrmforge.Presentation.Web/wwwroot/art/enemies/hollow-rigged/*normal.png
          git add src/Wyrmforge.Presentation.Web/wwwroot/art/enemies/hollow-rigged/*depth.png
          git add src/Wyrmforge.Presentation.Web/wwwroot/art/enemies/hollow-rigged/*caster.png
          git add src/Wyrmforge.Presentation.Web/wwwroot/art/enemies/hollow-rigged/lit-material-manifest.json
          git add src/Wyrmforge.Presentation.Web/wwwroot/art/enemies/ashling-rigged/*normal.png
          git add src/Wyrmforge.Presentation.Web/wwwroot/art/enemies/ashling-rigged/*depth.png
          git add src/Wyrmforge.Presentation.Web/wwwroot/art/enemies/ashling-rigged/*caster.png
          git add src/Wyrmforge.Presentation.Web/wwwroot/art/enemies/ashling-rigged/lit-material-manifest.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(actors): export geometry-derived lit material atlases"
            git push origin HEAD:feat/actor-lit-hollowed-ashling
          fi
