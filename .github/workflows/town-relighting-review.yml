name: Town 2.5D GPU preview evidence

on:
  pull_request:
    paths:
      - 'src/Wyrmforge.Presentation.Web/wwwroot/town-relighting-preview.html'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/js/town-relightable-scene.js'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/js/town-relighting-preview.js'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/js/town-citizen-gpu-bridge.js'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/js/town-paving-material.js'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/js/town-neutral-albedo.js'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/js/town-lighting-grade.js'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/js/town-light-domains.js'
      - 'tools/art/town_gpu_playwright_capture.py'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/js/town-well-stage4.js'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/js/town-live-relighting.js'
      - 'src/Wyrmforge.Presentation.Web/Features/Forge/CanonicalTownView.razor'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/css/town-canonical.css'
      - 'tests/javascript/town-relighting-*.test.mjs'
      - 'tests/javascript/town-citizen-gpu-bridge.test.mjs'
      - 'tests/javascript/town-paving-material.test.mjs'
      - 'tests/javascript/town-neutral-albedo.test.mjs'
      - 'tests/javascript/town-lighting-grade.test.mjs'
      - 'tests/javascript/town-light-domains.test.mjs'
      - 'tests/javascript/town-well-stage4.test.mjs'
      - 'tests/javascript/town-native-render-quality.test.mjs'
      - 'tests/javascript/town-live-gpu-integration.test.mjs'
      - 'tests/Wyrmforge.Browser.Tests/WyrmforgeBrowserTests.cs'
      - '.github/workflows/town-relighting-review.yml'
  push:
    branches:
      - feat/town-2p5d-relightable-g4
  workflow_dispatch:

concurrency:
  group: town-gpu-review-pr-368
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  original-town-gpu-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Ensure real approved painting bytes were checked out
        run: |
          git lfs pull --include="src/Wyrmforge.Presentation.Web/wwwroot/art/town/**,user_handover_files/concepts/buildings/**" --exclude=""
          python3 - <<'PY'
          from pathlib import Path
          for name in ('day-active.webp', 'night-active.webp'):
              path = Path('src/Wyrmforge.Presentation.Web/wwwroot/art/town') / name
              data = path.read_bytes()
              assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', f'{name} is not its original WebP binary'
          PY

      - name: Assert exact approved Town source hashes
        run: python3 tools/art/check_town_sources.py

      # Stage 1 material authoring needs the EXACT approved full-resolution
      # source, not an unrelated generated square or a scaled screenshot.
      # This exports immutable source bytes without modifying game artwork.
      - name: Export approved Town source for well-free square authoring
        uses: actions/upload-artifact@v4
        with:
          name: wyrmforge-stage1-approved-town-source
          path: |
            src/Wyrmforge.Presentation.Web/wwwroot/art/town/day-active.webp
            src/Wyrmforge.Presentation.Web/wwwroot/art/town/night-active.webp
          if-no-files-found: error
          retention-days: 3

      - name: Export exact GPU review runtime for Stage 4 binary-art QC
        uses: actions/upload-artifact@v4
        with:
          name: wyrmforge-town-stage4-local-gpu-runtime
          path: |
            src/Wyrmforge.Presentation.Web/wwwroot/js/
            src/Wyrmforge.Presentation.Web/wwwroot/town-relighting-preview.html
            src/Wyrmforge.Presentation.Web/wwwroot/art/town/day-active.webp
            src/Wyrmforge.Presentation.Web/wwwroot/art/town/night-active.webp
          if-no-files-found: error
          retention-days: 3

      - name: Check new Town GPU projection contracts
        run: node --test tests/javascript/town-relighting-contract.test.mjs tests/javascript/town-relighting-preview.test.mjs tests/javascript/town-paving-material.test.mjs tests/javascript/town-citizen-gpu-bridge.test.mjs tests/javascript/town-neutral-albedo.test.mjs tests/javascript/town-live-gpu-integration.test.mjs tests/javascript/town-lighting-grade.test.mjs tests/javascript/town-well-stage4.test.mjs tests/javascript/town-native-render-quality.test.mjs tests/javascript/town-light-domains.test.mjs

      - name: Start isolated static GPU review
        run: |
          mkdir -p artifacts/town-2p5d
          python3 -m http.server 4179 --bind 127.0.0.1 --directory src/Wyrmforge.Presentation.Web/wwwroot > artifacts/town-2p5d/server.log 2>&1 &
          for attempt in {1..25}; do
            if curl --fail --silent http://127.0.0.1:4179/town-relighting-preview.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat artifacts/town-2p5d/server.log
          exit 1

      - name: Capture validated GPU pixels with true browser readiness
        run: |
          set -euo pipefail
          BROWSER=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          python3 -m venv /tmp/town-gpu-capture
          /tmp/town-gpu-capture/bin/pip install --quiet Pillow playwright
          /tmp/town-gpu-capture/bin/python tools/art/town_gpu_playwright_capture.py \
            --chrome "$BROWSER" --output artifacts/town-2p5d
          /tmp/town-gpu-capture/bin/python tools/art/town_gpu_capture_validate.py \
            artifacts/town-2p5d --width 320 --width 390 --width 1120
          /tmp/town-gpu-capture/bin/python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops, ImageStat
          folder = Path('artifacts/town-2p5d')
          def read(name):
              with Image.open(folder / (name + '.png')) as source:
                  img = source.convert('RGB')
                  return img.crop((0, 0, img.width, round(img.width * 941 / 1672)))
          day, night, zero = (read(n) for n in ('stage4-day-1120', 'stage4-night-1120', 'zero-stage4-1120'))
          assert sum(ImageStat.Stat(zero).mean) < 2, 'Stage 4 zero light must be black'
          assert ImageChops.difference(day, night).getbbox(), 'Stage 4 light sources do not change the scene'
          w = day.width / 1672
          region = tuple(round(v * w) for v in (697, 357, 952, 564))
          original = read('day-1120-gpu-proof').crop(region)
          replacement = day.crop(region)
          assert ImageChops.difference(original, replacement).getbbox(), 'Approved well sprite failed to replace original well'
          left = read('stage4-lantern--100-1120')
          right = read('stage4-lantern-100-1120')
          assert ImageChops.difference(left, right).getbbox(), 'Lantern position must affect real GPU lighting'
          print('PASS Stage 4: real rendered asset, day/night, zero light, movable lantern.')
          PY
          echo "Verified real Stage 4 GPU pixels and legacy comparisons."

      - name: Upload focused Stage 4 remade-well GPU screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: town-stage4-remade-well-gpu-review
          path: |
            artifacts/town-2p5d/stage4-*.png
            artifacts/town-2p5d/zero-stage4-1120.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload exact-source review frames and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: town-2p5d-original-art-gpu-review
          path: artifacts/town-2p5d
          if-no-files-found: warn
          retention-days: 14

  real-game-town-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Restore runtime Town assets
        run: |
          git lfs pull --include="src/Wyrmforge.Presentation.Web/wwwroot/**,user_handover_files/concepts/buildings/**" --exclude=""
          python3 tools/development/verify_web_assets.py
          python3 tools/art/check_town_sources.py

      - name: Verify .NET 10 SDK
        run: dotnet --list-sdks | grep -Eq '^10\.0\.'

      - name: Build actual-game browser acceptance tests
        run: |
          dotnet restore tests/Wyrmforge.Browser.Tests/Wyrmforge.Browser.Tests.csproj
          dotnet build tests/Wyrmforge.Browser.Tests/Wyrmforge.Browser.Tests.csproj -c Release --no-restore

      - name: Install Playwright Chromium
        run: pwsh tests/Wyrmforge.Browser.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Publish actual playable WyrmForge
        run: |
          dotnet restore src/Wyrmforge.Presentation.Web/Wyrmforge.Presentation.Web.csproj
          dotnet publish src/Wyrmforge.Presentation.Web/Wyrmforge.Presentation.Web.csproj -c Release --no-restore -o artifacts/web

      - name: Start real game
        run: |
          mkdir -p artifacts/town-in-game
          python3 tools/development/spa_server.py --port 4173 --directory ./artifacts/web/wwwroot > artifacts/town-in-game/server.log 2>&1 &
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat artifacts/town-in-game/server.log
          exit 1

      - name: Capture real T0 baseline and T2 GPU Town at 320px / 390px
        env:
          WYRMFORGE_BASE_URL: http://127.0.0.1:4173/
          WYRMFORGE_BROWSER_ARTIFACTS: ${{ github.workspace }}/artifacts/town-in-game
        run: |
          dotnet test tests/Wyrmforge.Browser.Tests/Wyrmforge.Browser.Tests.csproj \
            -c Release --no-build \
            --filter 'FullyQualifiedName~TownGpuAcceptanceTests' \
            --logger 'trx;LogFileName=town-acceptance.trx'

      - name: Create labeled actual-game mobile comparison PNGs
        if: always()
        run: |
          python3 -m venv /tmp/wyrmforge-town-sheet
          /tmp/wyrmforge-town-sheet/bin/pip install --quiet Pillow
          /tmp/wyrmforge-town-sheet/bin/python tools/art/town_acceptance_sheet.py \
            artifacts/town-in-game --width 320 --width 390

      - name: Upload playable Town acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: town-2p5d-actual-game-t0-t2-acceptance
          path: artifacts/town-in-game
          if-no-files-found: warn
          retention-days: 14
