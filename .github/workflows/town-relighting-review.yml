name: Town 2.5D GPU preview evidence

on:
  pull_request:
    paths:
      - 'src/Wyrmforge.Presentation.Web/wwwroot/town-relighting-preview.html'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/js/town-relightable-scene.js'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/js/town-relighting-preview.js'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/js/town-citizen-gpu-bridge.js'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/js/town-paving-material.js'
      - 'tests/javascript/town-relighting-*.test.mjs'
      - 'tests/javascript/town-citizen-gpu-bridge.test.mjs'
      - 'tests/javascript/town-paving-material.test.mjs'
      - '.github/workflows/town-relighting-review.yml'
  push:
    branches:
      - feat/town-2p5d-relightable-g4
  workflow_dispatch:

concurrency:
  group: town-gpu-review-pr-368
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  original-town-gpu-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Ensure real approved painting bytes were checked out
        run: |
          git lfs pull --include="src/Wyrmforge.Presentation.Web/wwwroot/art/town/**" --exclude=""
          python3 - <<'PY'
          from pathlib import Path
          for name in ('day-active.webp', 'night-active.webp'):
              path = Path('src/Wyrmforge.Presentation.Web/wwwroot/art/town') / name
              data = path.read_bytes()
              assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', f'{name} is not its original WebP binary'
          PY

      - name: Assert exact approved Town source hashes
        run: python3 tools/art/check_town_sources.py

      - name: Check new Town GPU projection contracts
        run: node --test tests/javascript/town-relighting-contract.test.mjs tests/javascript/town-relighting-preview.test.mjs tests/javascript/town-paving-material.test.mjs tests/javascript/town-citizen-gpu-bridge.test.mjs

      - name: Start isolated static GPU review
        run: |
          mkdir -p artifacts/town-2p5d
          python3 -m http.server 4179 --bind 127.0.0.1 --directory src/Wyrmforge.Presentation.Web/wwwroot > artifacts/town-2p5d/server.log 2>&1 &
          for attempt in {1..25}; do
            if curl --fail --silent http://127.0.0.1:4179/town-relighting-preview.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat artifacts/town-2p5d/server.log
          exit 1

      - name: Capture actual shared-GPU day night and zero-light frames
        run: |
          set -euo pipefail
          BROWSER=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          FLAGS="--headless=new --no-sandbox --disable-dev-shm-usage --enable-unsafe-swiftshader --use-gl=angle --use-angle=swiftshader --hide-scrollbars --force-device-scale-factor=1 --virtual-time-budget=12000"
          for viewport in 320x760 390x844 1120x870; do
            width="${viewport%x*}"
            height="${viewport#*x}"
            for mode in day night zero; do
              base="artifacts/town-2p5d/${mode}-${width}"
              url="http://127.0.0.1:4179/town-relighting-preview.html?mode=$mode"
              "$BROWSER" $FLAGS --window-size="$width,$height" --screenshot="${base}-gpu-proof.png" "$url" > "${base}.log" 2>&1
              "$BROWSER" $FLAGS --window-size="$width,$height" --dump-dom "$url" > "${base}.html" 2>> "${base}.log"
              grep -q 'data-ready="true"' "${base}.html" || { echo "GPU readiness missing for $mode ($width)"; exit 1; }
              test -s "${base}-gpu-proof.png"
              if [ "$mode" = zero ]; then
                grep -q 'data-zero-black="true"' "${base}.html" || { echo "Zero-light framebuffer leaked ($width)"; exit 1; }
              fi
            done
          done
          for passage in behind front hidden; do
            case "$passage" in
              behind) query='?mode=night&npcProgress=0';;
              front) query='?mode=night&npcProgress=1';;
              hidden) query='?mode=night&npc=off';;
            esac
            base="artifacts/town-2p5d/npc-$passage-390"
            url="http://127.0.0.1:4179/town-relighting-preview.html$query"
            "$BROWSER" $FLAGS --window-size="390,844" --screenshot="${base}.png" "$url" > "${base}.log" 2>&1
            "$BROWSER" $FLAGS --window-size="390,844" --dump-dom "$url" > "${base}.html" 2>> "${base}.log"
            grep -q "data-npc-pass=\"$passage\"" "${base}.html" || { echo "NPC depth validation failed for $passage"; exit 1; }
            if [ "$passage" = hidden ]; then
              grep -q 'data-npc-shadow-casters="0"' "${base}.html" || exit 1
            else
              grep -q 'data-npc-shadow-casters="1"' "${base}.html" || exit 1
            fi
          done
          echo "These are isolated GPU-lab screenshots of original CSS actor placeholder, NOT T2 final art."

      - name: Upload exact-source review frames and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: town-2p5d-original-art-gpu-review
          path: artifacts/town-2p5d
          if-no-files-found: warn
          retention-days: 14
