name: Render Observatory day-vacant review
on:
  push:
    branches: [art/observatory-vacant-day-proposal-20261020]
    paths:
      - tools/art/observatory_day_vacant_proposal.py
      - .github/workflows/observatory-day-review.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pillow>=10,<13' 'opencv-python-headless>=4.9,<5'
      - name: Render from original GitHub night-vacant source
        run: python tools/art/observatory_day_vacant_proposal.py
      - name: Commit only review images (not production)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/art/previews/observatory-day-vacant-*.webp
          if ! git diff --cached --quiet; then
            git commit -m "art: preview original vacant observatory under daylight"
            git push
          fi
