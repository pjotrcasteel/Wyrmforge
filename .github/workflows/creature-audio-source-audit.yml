name: Creature audio source audit
on:
  push:
    branches: [audio/phase1-menu-foley-audition]
    paths: [.github/workflows/creature-audio-source-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify CC0 source packs and inspect sample catalogue
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wyrm-creatures
          curl -fLsS --retry 3 --max-time 90 https://opengameart.org/sites/default/files/zombies.zip -o /tmp/wyrm-creatures/zombies.zip
          curl -fLsS --retry 3 --max-time 90 https://opengameart.org/sites/default/files/monster_sfx_pack.zip -o /tmp/wyrm-creatures/monsters.zip
          curl -fLsS --retry 3 --max-time 90 https://opengameart.org/sites/default/files/fire-1_0.ogg -o /tmp/wyrm-creatures/fire.ogg
          sha256sum /tmp/wyrm-creatures/*
          for file in /tmp/wyrm-creatures/*.zip; do
            echo "=== SAMPLE INDEX: $(basename "$file") ==="
            unzip -Z -1 "$file" | head -130
            unzip -tqq "$file"
          done
          file /tmp/wyrm-creatures/fire.ogg
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 /tmp/wyrm-creatures/fire.ogg
