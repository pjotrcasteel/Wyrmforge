name: Wet Forest hard-material source art review

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/art/prototypes/terrain-hard-pairings.mjs'
      - 'tools/art/prototypes/terrain-hard-pairing-relief.mjs'
      - 'tools/art/prototypes/build-hard-pairing-review.mjs'
      - 'tests/javascript/terrain-hard-pairings.test.mjs'
      - 'tests/javascript/terrain-hard-pairing-relief.test.mjs'
      - 'docs/art/wf32-p1k-hard-pairings.md'
      - '.github/workflows/wf32-hard-pair-art-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-hard-pair-source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout original source materials
        uses: actions/checkout@v4
      - name: Verify whole-stone seams and world-coordinate continuity
        run: node --test tests/javascript/terrain-hard-pairings.test.mjs tests/javascript/terrain-hard-pairing-relief.test.mjs tests/javascript/terrain-world-variation.test.mjs
      - name: Render native/3x pairing gallery and unlit elevation/caster diagnostics
        run: node tools/art/prototypes/build-hard-pairing-review.mjs artifacts/wf32-hard-pairings
      - name: Publish original source-art review (not running Hunt capture)
        uses: actions/upload-artifact@v4
        with:
          name: wf32-hard-pairings-source-review
          path: artifacts/wf32-hard-pairings/
          if-no-files-found: error
          retention-days: 14
