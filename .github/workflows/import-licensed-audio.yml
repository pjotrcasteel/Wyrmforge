name: Import licensed WyrmForge audio
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/audio/import_licensed_audio.py'
      - '.github/workflows/import-licensed-audio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    # Safety: never run or push code from a fork or a different feature branch.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/recorded-fantasy-audio-0-0-109'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Install verified audio conversion utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg p7zip-full
      - name: Import source recordings and licensed effects
        run: python3 tools/audio/import_licensed_audio.py
      - name: Validate bundled music and spell files
        run: |
          test -s src/Wyrmforge.Presentation.Web/wwwroot/audio/recorded/music-osare.ogg
          test -s src/Wyrmforge.Presentation.Web/wwwroot/audio/recorded/music-cave.ogg
          for spell in arcane fire frost lightning; do
            test -s "src/Wyrmforge.Presentation.Web/wwwroot/audio/recorded/$spell.ogg"
            ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 "src/Wyrmforge.Presentation.Web/wwwroot/audio/recorded/$spell.ogg"
          done
      - name: Commit imported assets and pinned source provenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Wyrmforge.Presentation.Web/wwwroot/audio/recorded
          if git diff --cached --quiet; then
            echo "Audio files already up to date."
          else
            git commit -m "Import recorded fantasy sounds and music with verified license manifest"
            git push origin HEAD:${{ github.head_ref }}
          fi
