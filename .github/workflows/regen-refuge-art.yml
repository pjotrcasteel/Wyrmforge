name: Render dormancy art and checkpoint images
on:
  push:
    branches:
      - fix/town-building-vacancy-no-black-haze-20261019
    paths:
      - tools/art/build_town_vacancy.py
      - .github/workflows/regen-refuge-art.yml
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/town-building-vacancy-no-black-haze-20261019
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install image tooling
        run: pip install pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.12.0.88
      - name: Render dormant building plates and visual proof
        run: python tools/art/build_town_vacancy.py
      - name: Commit and push binary artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Wyrmforge.Presentation.Web/wwwroot/art/town-vacant-nexus.webp src/Wyrmforge.Presentation.Web/wwwroot/art/town-vacant-codex.webp src/Wyrmforge.Presentation.Web/wwwroot/art/town-vacant-legends.webp docs/art/previews/refuge-closed-2026-10-19.webp
          if git diff --cached --quiet; then
            echo "Artwork already current."
          else
            git commit -m "Update dormant artwork with extinguished windows and magic"
            git push origin HEAD:fix/town-building-vacancy-no-black-haze-20261019
          fi
