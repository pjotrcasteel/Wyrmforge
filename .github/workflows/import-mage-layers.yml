name: One-time layered mage audio import
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/audio/import_spell_layers.py'
      - '.github/workflows/import-mage-layers.yml'

permissions:
  contents: write

jobs:
  import:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/audio-mix-spell-layers-0-0-110'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Install audio converters
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg p7zip-full
      - name: Import layered samples from pinned licensed source
        run: python3 tools/audio/import_spell_layers.py
      - name: Inspect imported audio variants
        run: |
          for school in arcane fire frost lightning; do
            for number in 1 2 3; do
              test -s "src/Wyrmforge.Presentation.Web/wwwroot/audio/recorded/$school-cast-$number.ogg"
            done
          done
          python3 -m json.tool src/Wyrmforge.Presentation.Web/wwwroot/audio/recorded/manifest.json >/dev/null
      - name: Commit real asset recordings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Wyrmforge.Presentation.Web/wwwroot/audio/recorded/
          if git diff --cached --quiet; then
            echo "Samples are already identical."
          else
            git commit -m "Import human-recorded fantasy spell cast, hit, and buildup variants"
            git pull --rebase origin "${{ github.head_ref }}"
            git push origin HEAD:"${{ github.head_ref }}"
          fi
