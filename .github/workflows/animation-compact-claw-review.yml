name: Animation compact claw source-frame review
on:
  pull_request:
    paths:
      - '.github/workflows/animation-compact-claw-review.yml'
      - 'tools/animation/**'
      - 'art/source/animation-foundation/baked-compact-claw-20261029/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: animation-compact-claw-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render-authored-frames:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            tools/animation
            src/Wyrmforge.Presentation.Web/wwwroot/js
            src/Wyrmforge.Presentation.Web/wwwroot/art/review/animation-foundation-sprite-compact-motion
            art/source/animation-foundation/baked-compact-claw-20261029
      - uses: actions/cache@v4
        id: blender
        with:
          path: .cache/blender-4.5.3-linux-x64
          key: animation-source-blender-4.5.3-linux-x64-975c58fc
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Restore pinned official Blender runtime
        if: steps.blender.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache
          curl --fail --location --retry 2 https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz -o .cache/blender.tar.xz
          echo '975c58fcb244273838534bba771e64ad87739216b0f9b39a888531a49a72d845  .cache/blender.tar.xz' | sha256sum --check
          tar --no-same-owner -xf .cache/blender.tar.xz -C .cache
          rm .cache/blender.tar.xz
      - name: Reopen saved compact claw and bake its actual full-body source frames
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install Pillow==12.0.0
          BLENDER_BIN="$PWD/.cache/blender-4.5.3-linux-x64/blender"
          SOURCE=artifacts/an6-compact-claw-source
          REVIEW=artifacts/an6-compact-claw-atlas
          mkdir -p "$SOURCE" "$REVIEW"
          cp art/source/animation-foundation/baked-compact-claw-20261029/{hollow-foundation.blend,source-manifest.json} "$SOURCE/"
          "$BLENDER_BIN" -b -t 2 --python-exit-code 1 --python tools/animation/validate_source.py -- "$SOURCE"
          "$BLENDER_BIN" -b -t 2 --python-exit-code 1 --python tools/animation/render_saved_clips.py -- "$SOURCE" --clips walk,attack-travel
          python3 tools/animation/export_atlases.py "$SOURCE" --out "$REVIEW" --tight-crop --clips walk,attack-travel
          node tools/animation/audit_baked_transitions.mjs "$REVIEW/profile.json" --diagnostic > "$REVIEW/transition-diagnostics.json"
          # A contact or source-content failure is not a rendering/asset pass.
          # Preserve budget failure explicitly; do not widen the 64 MiB contract.
          set +e
          node tools/animation/check_baked_atlas_budget.mjs --production-maps "$REVIEW/manifest.json" > "$REVIEW/prospective-three-map-budget.json"
          status=$?
          set -e
          if (( status > 1 )); then exit "$status"; fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=Path('artifacts/an6-compact-claw-atlas/prospective-three-map-budget.json')
          budget=json.loads(report.read_text())
          manifest=json.loads(Path('artifacts/an6-compact-claw-atlas/manifest.json').read_text())
          assert set(manifest['clips'])=={'walk','attack-travel'}
          assert manifest['clips']['attack-travel']['frames']==128
          assert len(manifest['directions'])==8
          assert manifest['productionReady'] is False
          assert budget['decodedBytes']>0 and budget['maxDecodedBytes']==67108864
          print('Only real baked frames are included. C# Hunt, materials, depth, motion contact and user visual acceptance remain open.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: an6-compact-claw-real-source-frames
          path: |
            artifacts/an6-compact-claw-atlas/
            artifacts/an6-compact-claw-source/render-receipt.json
            artifacts/an6-compact-claw-source/source-manifest.json
          if-no-files-found: warn
          retention-days: 14
 
  capture-real-csharp-encounter:
    name: Actual C# Enemy Lab compact-claw capture
    needs: render-authored-frames
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Restore published runtime art
        run: |
          git lfs pull --include="src/Wyrmforge.Presentation.Web/wwwroot/**" --exclude=""
          python3 tools/development/verify_web_assets.py
      - name: Rebuild required source-backed terrain for actual C# lab
        run: |
          python3 -m pip install -r tools/art/painted-requirements.txt
          python3 tools/art/build_grass_moss_art_candidates.py --output src/Wyrmforge.Presentation.Web/wwwroot/art/environment/wet-forest-source-backed/v1/grass-moss-art-candidates
          python3 tools/art/build_wet_mud_art_candidates.py --output src/Wyrmforge.Presentation.Web/wwwroot/art/environment/wet-forest-source-backed/v1/wet-mud-art-candidates
          python3 tools/art/build_trampled_earth_art_candidates.py --output src/Wyrmforge.Presentation.Web/wwwroot/art/environment/wet-forest-source-backed/v1/trampled-earth-art-candidates
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify .NET 10 and publish the real Blazor game
        run: |
          dotnet --list-sdks | grep -Eq '^10[.]0[.]' || { echo '::error::Missing .NET 10 SDK'; exit 1; }
          dotnet restore src/Wyrmforge.Presentation.Web/Wyrmforge.Presentation.Web.csproj
          dotnet publish src/Wyrmforge.Presentation.Web/Wyrmforge.Presentation.Web.csproj -c Release --no-restore -o artifacts/web
      - name: Install review browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: an6-compact-claw-real-source-frames
          path: artifacts
      - name: Capture actual moving-claw encounters in both native phone widths
        shell: bash
        run: |
          set -euo pipefail
          for width in 320 390; do
            AN_FOUNDATION_MODE=sprite-claw AN_MOBILE=1 AN_WIDTH="$width" AN_CAPTURE_DIR="artifacts/an6-compact-claw-hunt-$width" AN_ASSET_ROOT="artifacts/an6-compact-claw-atlas" node tools/animation/capture-hunt.cjs
          done
          node - <<'NODE'
          const fs=require('fs');
          for(const width of [320,390]){
            const root=`artifacts/an6-compact-claw-hunt-${width}`;
            const summary=JSON.parse(fs.readFileSync(root+'/capture-summary.json','utf8'));
            const trace=JSON.parse(fs.readFileSync(root+'/motion-trace.json','utf8'));
            const entities=trace.flatMap(t=>t.hollow?.entities??[]);
            const actionSamples=entities.filter(e=>e.foundation?.clip==='attack-travel').length;
            const renderedClawFrames=Math.max(0,...entities.map(e=>e.foundationClawDrawnFrames??0));
            const renderedSpriteFrames=Math.max(0,...entities.map(e=>e.foundationDrawnFrames??0));
            const result={width,scene:summary.scene,physicalDevice:false,sourceLitOnly:true,
              actionSamples,renderedClawFrames,renderedSpriteFrames,
              maximumNativeMarkerSlip:summary.maximumNativeMarkerSlip,
              markerContactWithinOneNativePixel:summary.markerContactWithinOneNativePixel,
              browserErrors:summary.errors,resourceErrors:summary.failedResources.length};
            fs.writeFileSync(root+'/claw-proof.json',JSON.stringify(result,null,2)+'\\n');
            console.log(JSON.stringify(result));
            if(!actionSamples||!renderedClawFrames)throw Error('Claw was not both sampled AND drawn at '+width+'px');
            if(summary.errors.length||summary.failedResources.length)throw Error('Captured scene has browser or missing-resource errors at '+width+'px');
            if(result.markerContactWithinOneNativePixel!==true)throw Error('Real drawn claw fails the strict one-native-pixel contact gate at '+width+'px');
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: an6-compact-claw-real-csharp-hunt
          path: |
            artifacts/an6-compact-claw-hunt-320/
            artifacts/an6-compact-claw-hunt-390/
          if-no-files-found: warn
          retention-days: 14
