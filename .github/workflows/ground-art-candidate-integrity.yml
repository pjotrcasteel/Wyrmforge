name: Wet Forest ground concept integrity
on:
  pull_request:
    paths:
      - 'user_handover_files/concepts/arena-v2/wet-forest/ground-materials/v1/**'
      - 'tools/art/verify_ground_candidate_collection.mjs'
      - 'tools/art/build_ground_material_probe.py'
      - 'tools/art/audit_ground_source_art.py'
      - 'tools/art/tests/test_ground_material_probe.py'
      - '.github/workflows/ground-art-candidate-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all 36 candidate image hashes and source metadata
        run: node tools/art/verify_ground_candidate_collection.mjs

  visual-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned image decoding dependency
        run: python -m pip install Pillow==12.0.0
      - name: Test non-destructive material preparation
        run: python -m unittest discover -s tools/art/tests -p test_ground_material_probe.py -v
      - name: Build 12 Ground/Moss and Wet Mud repeat comparisons
        run: python tools/art/build_ground_material_probe.py --output "$RUNNER_TEMP/ground-material-probes" --tile-px 240
      - name: Audit all 36 source images for border/matte warnings
        run: python tools/art/audit_ground_source_art.py --output "$RUNNER_TEMP/ground-material-probes"
      - name: Upload twelve seam studies and the 36-image source audit
        uses: actions/upload-artifact@v4
        with:
          name: wet-forest-grass-mud-repeat-studies
          path: ${{ runner.temp }}/ground-material-probes/
          retention-days: 30
          if-no-files-found: error
