name: Restore approved Refuge panorama (one time)
on:
  push:
    branches:
      - feature/approved-refuge-panorama-20261018
    paths:
      - 'tools/art/town-panorama-parts/**'
      - '.github/workflows/restore-refuge-panorama.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
      - name: Verify and restore exact approved image
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          parts = sorted(Path("tools/art/town-panorama-parts").glob("part-*.b64"))
          if len(parts) != 10:
              raise SystemExit(f"Expected 10 image parts, got {len(parts)}")
          encoded = "".join(part.read_text(encoding="ascii").strip() for part in parts)
          image = base64.b64decode(encoded, validate=True)
          expected = "a5fdd63eaaa0d4b73e9d2ed5949b16d692e8a761433b0993ec2729bd0ca03189"
          if hashlib.sha256(image).hexdigest() != expected:
              raise SystemExit("Approved image checksum mismatch")
          target = Path("src/Wyrmforge.Presentation.Web/wwwroot/art/refuge-town-panorama.png")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(image)
          print(f"Restored exact approved PNG ({len(image)} bytes) to {target}")
          PY
      - name: Commit original image to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Wyrmforge.Presentation.Web/wwwroot/art/refuge-town-panorama.png
          if ! git diff --cached --quiet; then
            git commit -m "Add exact approved Refuge town panorama artwork"
            git push origin HEAD:feature/approved-refuge-panorama-20261018
          fi
