name: Validate Wyrmforge

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'services/playtest-collector/**'
      - 'tools/playtesting/**'
      - 'tools/sprite-lab/**'
      - 'tests/**'
      - 'Wyrmforge.slnx'
      - 'Directory.Build.props'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use preinstalled .NET 10 SDK
        run: |
          dotnet --list-sdks
          dotnet --list-sdks | grep -Eq '^10\.0\.' || { echo "::error::Runner does not have the .NET 10 SDK"; exit 1; }
          dotnet --version

      - name: Restore
        run: dotnet restore Wyrmforge.slnx

      - name: Verify reproducible sprite atlases
        run: |
          python3 -m pip install -r tools/art/painted-requirements.txt
          node tools/art/build-art.mjs --check
          python3 tools/art/build-painted-enemies.py --check
          python3 tools/art/build-nexus-school-assets.py
          git diff --exit-code -- src/Wyrmforge.Presentation.Web/wwwroot/art/town/nexus-schools/

      - name: Check automatic Pages version calculation
        run: python3 -m unittest discover -s tools/release -p 'test_*.py'

      - name: Check playtest and collector JavaScript
        run: |
          node --test tests/javascript/*.test.mjs
          node --check src/Wyrmforge.Presentation.Web/wwwroot/js/playtest.js
          node --check services/playtest-collector/src/index.js
          node --check services/playtest-collector/scripts/configure.mjs
          node --test services/playtest-collector/test/*.test.mjs

      - name: Verify Sprite Lab walking mechanics
        run: |
          node --test tools/sprite-lab/tests/*.test.js
          node --check src/Wyrmforge.Presentation.Web/wwwroot/sprite-lab/src/lab-app.js
          node --check src/Wyrmforge.Presentation.Web/wwwroot/sprite-lab/buildings/src/building-core.js
          node --check src/Wyrmforge.Presentation.Web/wwwroot/sprite-lab/buildings/src/building-app.js
          node tools/sprite-lab/build-hollow-rig.mjs
          git diff --exit-code -- src/Wyrmforge.Presentation.Web/wwwroot/sprite-lab/assets/hollow-walk-rig-v2.png src/Wyrmforge.Presentation.Web/wwwroot/sprite-lab/assets/hollow-walk-rig-v2.manifest.json

      - name: Test playtest report analysis
        run: python3 -m unittest discover -s tools/playtesting -p 'test_*.py'

      - name: Build
        run: dotnet build Wyrmforge.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Wyrmforge.slnx -c Release --no-build

      - name: Publish web
        run: dotnet publish src/Wyrmforge.Presentation.Web/Wyrmforge.Presentation.Web.csproj -c Release --no-restore

      - name: Run quick balance sample
        run: |
          dotnet run --project src/Wyrmforge.BalanceLab/Wyrmforge.BalanceLab.csproj -c Release --no-build --             --runs-per-combination 2             --max-seconds 240             --output artifacts/balance-quick

      - name: Run portrait first-hunt samples
        run: |
          dotnet run --project src/Wyrmforge.BalanceLab -c Release --no-build -- --fresh-hunter --arena-width 390 --arena-height 700 --runs-per-combination 4 --seed-start 9100 --max-seconds 180 --output artifacts/balance-quick/fresh-portrait
          dotnet run --project src/Wyrmforge.BalanceLab -c Release --no-build -- --arena-width 390 --arena-height 700 --runs-per-combination 3 --seed-start 9100 --max-seconds 180 --output artifacts/balance-quick/established-portrait

      - name: Run extended portrait hunts
        run: |
          dotnet run --project src/Wyrmforge.BalanceLab -c Release --no-build -- --fresh-hunter --arena-width 390 --arena-height 700 --runs-per-combination 4 --seed-start 9100 --max-seconds 360 --output artifacts/balance-quick/fresh-extended
          dotnet run --project src/Wyrmforge.BalanceLab -c Release --no-build -- --arena-width 390 --arena-height 700 --runs-per-combination 3 --seed-start 9100 --max-seconds 360 --output artifacts/balance-quick/established-extended

      - name: Upload quick balance evidence
        uses: actions/upload-artifact@v4
        with:
          name: wyrmforge-balance-quick-${{ github.sha }}
          path: artifacts/balance-quick
          if-no-files-found: error
          retention-days: 14
