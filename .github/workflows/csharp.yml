name: Validate Wyrmforge

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'services/playtest-collector/**'
      - 'tests/**'
      - 'Wyrmforge.slnx'
      - 'Directory.Build.props'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Wyrmforge.slnx

      - name: Check playtest and collector JavaScript
        run: |
          node --check src/Wyrmforge.Presentation.Web/wwwroot/js/playtest.js
          node --check services/playtest-collector/src/index.js
          node --check services/playtest-collector/scripts/configure.mjs
          node --test services/playtest-collector/test/*.test.mjs

      - name: Test playtest report analysis
        run: python3 -m unittest discover -s tools/playtesting -p 'test_*.py'

      - name: Build
        run: dotnet build Wyrmforge.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Wyrmforge.slnx -c Release --no-build

      - name: Publish web
        run: dotnet publish src/Wyrmforge.Presentation.Web/Wyrmforge.Presentation.Web.csproj -c Release --no-restore

      - name: Run quick balance sample
        run: |
          dotnet run --project src/Wyrmforge.BalanceLab/Wyrmforge.BalanceLab.csproj -c Release --no-build --             --runs-per-combination 2             --max-seconds 240             --output artifacts/balance-quick

      - name: Upload quick balance evidence
        uses: actions/upload-artifact@v4
        with:
          name: wyrmforge-balance-quick-${{ github.sha }}
          path: artifacts/balance-quick
          if-no-files-found: error
          retention-days: 14
