name: Animation foundation actual-mesh source QC
on:
  pull_request:
    paths:
      - 'tools/animation/**'
      - 'art/source/animation-foundation/**'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/js/source-skin*.js'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/js/lighting/source-skin*.js'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/js/sprite-animation.js'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/js/sprite-contact-kinematics.js'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/art/review/animation-foundation-skin/**'
      - 'art/source/enemies/hollow/rigged-poc/model/local-appearance-004/rigged-hollow-zombie-reach-v3-standard/**'
      - '.github/workflows/animation-foundation-source.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: animation-source-${{ github.ref }}
  # Source mesh validation is expensive; preserve a running result across new commits.
  cancel-in-progress: false
jobs:
  actual-mesh-contacts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            tools/animation
            src/Wyrmforge.Presentation.Web/wwwroot/js
            art/source/animation-foundation/catch-step-20261029
            art/source/enemies/hollow/rigged-poc/model/local-appearance-004/rigged-hollow-zombie-reach-v3-standard
      - uses: actions/cache@v4
        id: blender
        with:
          path: .cache/blender-4.5.3-linux-x64
          key: animation-source-blender-4.5.3-linux-x64-975c58fc
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Restore pinned official Blender runtime
        if: steps.blender.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache
          curl --fail --location --retry 2 https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz -o .cache/blender.tar.xz
          echo '975c58fcb244273838534bba771e64ad87739216b0f9b39a888531a49a72d845  .cache/blender.tar.xz' | sha256sum --check
          tar --no-same-owner -xf .cache/blender.tar.xz -C .cache
          rm .cache/blender.tar.xz
      - name: Author and reopen actual-mesh support proof
        shell: bash
        run: |
          set -euo pipefail
          BLENDER_BIN="$PWD/.cache/blender-4.5.3-linux-x64/blender"
          "$BLENDER_BIN" -b -t 2 --python-exit-code 1 --python tools/animation/test_kinematics.py
          "$BLENDER_BIN" -b -t 2 --python-exit-code 1 --python tools/animation/author_hollow_foundation.py -- --out artifacts/animation-source-ci
          "$BLENDER_BIN" -b -t 2 --python-exit-code 1 --python tools/animation/validate_source.py -- artifacts/animation-source-ci
          python3 tools/animation/test_source_qc.py artifacts/animation-source-ci --blender "$BLENDER_BIN"
          "$BLENDER_BIN" -b -t 2 --python-exit-code 1 --python tools/animation/author_hollow_foundation.py -- --out artifacts/animation-moving-source-ci --only walk,attack-travel --phase-samples 16 --action-samples 8 --samples 2
          "$BLENDER_BIN" -b -t 2 --python-exit-code 1 --python tools/animation/validate_source.py -- artifacts/animation-moving-source-ci
          python3 tools/animation/test_source_qc.py artifacts/animation-moving-source-ci --blender "$BLENDER_BIN"
          "$BLENDER_BIN" -b -t 2 --python-exit-code 1 --python tools/animation/validate_motion_envelope.py -- artifacts/animation-moving-source-ci
      - name: Author and validate directional whole-body source studies
        shell: bash
        run: |
          set -euo pipefail
          BLENDER_BIN="$PWD/.cache/blender-4.5.3-linux-x64/blender"
          for heading in -22.5 22.5; do
            SOURCE="artifacts/animation-heading-$heading"
            "$BLENDER_BIN" -b -t 2 --python-exit-code 1 --python tools/animation/author_hollow_foundation.py -- --out "$SOURCE" --only walk,attack-travel --phase-samples 16 --action-samples 8 --samples 2 --travel-heading-degrees "$heading" --stride-metres .28
            "$BLENDER_BIN" -b -t 2 --python-exit-code 1 --python tools/animation/validate_source.py -- "$SOURCE"
            "$BLENDER_BIN" -b -t 2 --python-exit-code 1 --python tools/animation/validate_motion_envelope.py -- "$SOURCE"
            python3 tools/animation/test_source_qc.py "$SOURCE" --blender "$BLENDER_BIN"
          done
          python3 -m pip install Pillow==12.0.0
          python3 tools/animation/test_directional_export.py artifacts/animation-moving-source-ci artifacts/animation-heading-22.5 artifacts/animation-heading--22.5
      - name: Reject unsupported lateral motion without widening contact limits
        shell: bash
        run: |
          set -euo pipefail
          BLENDER_BIN="$PWD/.cache/blender-4.5.3-linux-x64/blender"
          if "$BLENDER_BIN" -b -t 2 --python-exit-code 1 --python tools/animation/validate_motion_envelope.py -- artifacts/animation-moving-source-ci --heading-degrees 15; then
            echo "Unexpected lateral acceptance: review the source envelope before changing this gate."
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/animation-moving-source-ci/motion-envelope-heading-15-qc.json').read_text())
          assert report['rootHeadingDegrees'] == 15 and report['runtimeAccepted'] is False
          assert len(report['results']) == 96
          assert all(r['failure'] and r['failure']['reason'] == 'source-pixel correction budget' for r in report['results'])
          print('All 96 unsupported lateral cases rejected by the unchanged correction budget.')
          PY
      - name: Reopen whole-body support study on actual saved skin
        shell: bash
        run: |
          set -euo pipefail
          BLENDER_BIN="$PWD/.cache/blender-4.5.3-linux-x64/blender"
          SOURCE=artifacts/animation-supported-source-ci
          "$BLENDER_BIN" -b -t 2 --python-exit-code 1 --python tools/animation/author_hollow_foundation.py -- --out "$SOURCE" --only walk,attack-travel --phase-samples 16 --action-samples 8 --samples 2 --stride-metres .28
          "$BLENDER_BIN" -b -t 2 --python-exit-code 1 --python tools/animation/export_pose_metadata.py -- "$SOURCE" --out "$SOURCE/pose-data.json"
          node tools/animation/check_supported_pose.mjs "$SOURCE/pose-data.json" "$SOURCE/reposed-study.json"
          "$BLENDER_BIN" -b -t 2 --python-exit-code 1 --python tools/animation/validate_reposed_skin.py -- "$SOURCE" "$SOURCE/reposed-study.json"
      - name: Verify continuous steering on retained actual world-space skin plants
        shell: bash
        run: |
          set -euo pipefail
          BLENDER_BIN="$PWD/.cache/blender-4.5.3-linux-x64/blender"
          SOURCE=artifacts/animation-steering-source-ci
          "$BLENDER_BIN" -b -t 2 --python-exit-code 1 --python tools/animation/author_hollow_foundation.py -- --out "$SOURCE" --only walk,attack-travel --phase-samples 16 --action-samples 8 --samples 2 --stride-metres .28 --flexion-reserve-pixels 1
          "$BLENDER_BIN" -b -t 2 --python-exit-code 1 --python tools/animation/validate_source.py -- "$SOURCE"
          python3 tools/animation/test_source_qc.py "$SOURCE" --blender "$BLENDER_BIN"
          "$BLENDER_BIN" -b -t 2 --python-exit-code 1 --python tools/animation/export_pose_metadata.py -- "$SOURCE" --out "$SOURCE/pose-data.json"
          node tools/animation/check_supported_trajectories.mjs "$SOURCE/pose-data.json" "$SOURCE/source-follow-study.json" --source-follow
          "$BLENDER_BIN" -b -t 2 --python-exit-code 1 --python tools/animation/validate_reposed_skin.py -- "$SOURCE" "$SOURCE/source-follow-study.json" --raster-every 20
      - name: Verify final preserve-volume catch-step source and actual weighted runtime mesh
        shell: bash
        run: |
          set -euo pipefail
          BLENDER_BIN="$PWD/.cache/blender-4.5.3-linux-x64/blender"
          SOURCE=art/source/animation-foundation/catch-step-20261029
          PACK=artifacts/animation-catch-step-ci
          python3 -m pip install numpy==2.3.3
          "$BLENDER_BIN" -b -t 2 --python-exit-code 1 --python tools/animation/validate_source.py -- "$SOURCE"
          python3 tools/animation/test_source_qc.py "$SOURCE" --blender "$BLENDER_BIN"
          "$BLENDER_BIN" -b -t 2 --python-exit-code 1 --python tools/animation/export_source_skin.py -- "$SOURCE" --out "$PACK" --triangles 12000 --load-ramp-fraction 0.15 --lateral-stride-metres 0.22 --guide-poses --orientation-warp-degrees 60 --balance-joint-degrees 10 --protect-contact-surfaces --middle-ground-clearance-metres 0.1
          AN_SEEDS=32 AN_CAPTURE_ENTITY=29 AN_INITIAL_MOVING=1 node tools/animation/check_shared_skin_trajectories.mjs "$PACK" "$PACK/runtime-poses.json" > "$PACK/seed-results.json"
          python3 tools/animation/validate_runtime_skin_geometry.py "$PACK" "$PACK/runtime-poses.json" --out "$PACK/weighted-runtime-qc.json"
          "$BLENDER_BIN" -b -t 2 --python-exit-code 1 --python tools/animation/validate_preserve_volume_mesh.py -- "$PACK" "$PACK/runtime-poses.json" --out "$PACK/evaluated-blender-qc.json"
      - uses: actions/upload-artifact@v4
        with:
          name: animation-foundation-editable-source-and-actual-mesh-qc
          path: |
            artifacts/animation-catch-step-ci/
            artifacts/animation-source-ci/hollow-foundation.blend
            artifacts/animation-source-ci/source-manifest.json
            artifacts/animation-source-ci/independent-source-qc.json
            artifacts/animation-source-ci/negative-source-qc.json
            artifacts/animation-moving-source-ci/hollow-foundation.blend
            artifacts/animation-moving-source-ci/source-manifest.json
            artifacts/animation-moving-source-ci/independent-source-qc.json
            artifacts/animation-moving-source-ci/negative-source-qc.json
            artifacts/animation-moving-source-ci/motion-envelope-qc.json
            artifacts/animation-moving-source-ci/motion-envelope-heading-15-qc.json
            artifacts/animation-heading-*/hollow-foundation.blend
            artifacts/animation-heading-*/source-manifest.json
            artifacts/animation-heading-*/independent-source-qc.json
            artifacts/animation-heading-*/negative-source-qc.json
            artifacts/animation-heading-*/motion-envelope-qc.json
            artifacts/animation-supported-source-ci/hollow-foundation.blend
            artifacts/animation-supported-source-ci/source-manifest.json
            artifacts/animation-supported-source-ci/pose-data.json
            artifacts/animation-supported-source-ci/reposed-study.json.summary.json
            artifacts/animation-supported-source-ci/reposed-study.skin-qc.json
            artifacts/animation-steering-source-ci/hollow-foundation.blend
            artifacts/animation-steering-source-ci/source-manifest.json
            artifacts/animation-steering-source-ci/pose-data.json
            artifacts/animation-steering-source-ci/independent-source-qc.json
            artifacts/animation-steering-source-ci/negative-source-qc.json
            artifacts/animation-steering-source-ci/source-follow-study.json.summary.json
            artifacts/animation-steering-source-ci/source-follow-study.skin-qc.json
            artifacts/animation-steering-source-ci/source-follow-study.raster-geometry-qc.json
          if-no-files-found: error
          retention-days: 14

  actual-source-skin-csharp-capture:
    name: Real 320/390px C# Hunt opt-in source-skin GPU capture
    needs: actual-mesh-contacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Restore true game art
        shell: bash
        run: |
          set -euo pipefail
          git lfs pull --include="src/Wyrmforge.Presentation.Web/wwwroot/**" --exclude=""
          python3 tools/development/verify_web_assets.py
      - name: Restore painted Wet Forest source-backed ground for actual C# scene
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -r tools/art/painted-requirements.txt
          python3 tools/art/build_grass_moss_art_candidates.py --output src/Wyrmforge.Presentation.Web/wwwroot/art/environment/wet-forest-source-backed/v1/grass-moss-art-candidates
          python3 tools/art/build_wet_mud_art_candidates.py --output src/Wyrmforge.Presentation.Web/wwwroot/art/environment/wet-forest-source-backed/v1/wet-mud-art-candidates
          python3 tools/art/build_trampled_earth_art_candidates.py --output src/Wyrmforge.Presentation.Web/wwwroot/art/environment/wet-forest-source-backed/v1/trampled-earth-art-candidates
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish actual C# WebAssembly game with existing GPU renderer
        shell: bash
        run: |
          set -euo pipefail
          dotnet --list-sdks | grep -Eq '^10[.]0[.]'
          dotnet restore src/Wyrmforge.Presentation.Web/Wyrmforge.Presentation.Web.csproj
          dotnet publish src/Wyrmforge.Presentation.Web/Wyrmforge.Presentation.Web.csproj -c Release --no-restore -o artifacts/web
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install real browser
        shell: bash
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: animation-foundation-editable-source-and-actual-mesh-qc
          path: artifacts
      - name: Capture actual source-skin Hollowed in C# Enemy Lab using shared LightingEngine
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/animation-catch-step-ci/manifest.json
          test -s artifacts/animation-catch-step-ci/skin.bin
          test -s artifacts/animation-catch-step-ci/albedo.png
          for width in 320 390; do
            ROOT="artifacts/an6-real-source-skin-csharp-$width"
            AN_FOUNDATION_MODE=1 AN_MOBILE=1 AN_WIDTH="$width" AN_CAPTURE_DIR="$ROOT" \
              AN_ASSET_ROOT=artifacts/animation-catch-step-ci node tools/animation/capture-hunt.cjs
            # Source-skin uses actual mesh contacts, not baked native source markers.
            # Keep its independent C# support/slip fields in the dedicated proof.
          done
          node - <<'NODE'
          const fs=require('fs');
          for(const width of [320,390]){
            const root=`artifacts/an6-real-source-skin-csharp-${width}`;
            const d=JSON.parse(fs.readFileSync(root+'/capture-summary.json','utf8'));
            const rows=JSON.parse(fs.readFileSync(root+'/motion-trace.json','utf8'));
            const entities=rows.flatMap(r=>r.hollow?.entities??[]);
            const samples=entities.filter(e=>e.foundation?.clip==='attack-travel').length;
            const skinFrames=rows.filter(r=>r.gpuWorld?.sourceSkinActors>0).length;
            const maxSkinActors=Math.max(0,...rows.map(r=>r.gpuWorld?.sourceSkinActors??0));
            const sourceYawSamples=entities.filter(e=>Number.isFinite(e.foundation?.sourceYaw)).length;
            const report={width,source:'real-C#-Hunt/EnemyLab',representation:'source-skinned mesh on existing LightingEngine',
              isOptionalResearch:true,sourceOnly:true,physicalDevice:false,
              actualRenderSamples:entities.length,clawActionSamples:samples,
              gpuSkinFrames:skinFrames,maxGpuSkinActors:maxSkinActors,sourceYawSamples,
              maxActualSourceContactSlip:d.maximumProjectedSoleDrift,
              browserErrors:d.errors,failedResources:d.failedResources,gpuErrors:d.gpuErrors,
              finalAcceptance:false,ownerVisualApproval:false};
            fs.writeFileSync(root+'/source-skin-csharp-proof.json',JSON.stringify(report,null,2)+'\n');
            console.log(JSON.stringify(report));
            if(!samples||!skinFrames||!maxSkinActors||!sourceYawSamples)
              throw Error('No real GPU skin and moving-claw C# samples at '+width+'px');
            if(d.errors.length||d.failedResources.length||d.gpuErrors.length)
              throw Error('Actual opt-in source-skin game failed browser/GPU validation at '+width+'px');
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: an6-real-source-skin-csharp-phone-widths
          path: |
            artifacts/an6-real-source-skin-csharp-320/
            artifacts/an6-real-source-skin-csharp-390/
          if-no-files-found: warn
          retention-days: 14
