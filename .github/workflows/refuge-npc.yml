name: Validate Refuge NPCs

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/Wyrmforge.Application/World/TownCrowd.cs'
      - 'src/Wyrmforge.Application/World/TownNavigationMap.cs'
      - 'tests/Wyrmforge.Application.Tests/World/TownCrowdTests.cs'
      - 'tests/javascript/refuge-town-crowd.test.mjs'
      - '.github/workflows/refuge-npc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  town-npc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Focused Refuge JavaScript checks
        run: node --test tests/javascript/refuge-town-crowd.test.mjs
      - name: Focused real-world C# NPC tests
        run: >
          dotnet test tests/Wyrmforge.Application.Tests/Wyrmforge.Application.Tests.csproj
          -c Release --filter FullyQualifiedName~TownCrowdTests
          --logger "console;verbosity=normal"
