name: Hollowed four physical body variants (3D source QC)

on:
  push:
    branches: [fix/hollowed-animation-polish-20261027]
    paths:
      - 'tools/sprite-lab/author-hollow-body-diversity.py'
      - '.github/workflows/hollow-source-body-diversity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Restore current no-cape source characters only
        run: |
          git lfs pull --include="art/source/enemies/hollow/rigged-poc/model/local-appearance-004/rigged-hollow-zombie-reach-v3-standard/**,art/source/enemies/hollow/rigged-poc/model/local-appearance-004/rigged-hollow-zombie-reach-v3-broken-leg-left/**,art/source/enemies/hollow/rigged-poc/model/local-appearance-004/rigged-hollow-zombie-reach-v3-broken-arm-right/**,art/source/enemies/hollow/rigged-poc/model/local-appearance-004/rigged-hollow-zombie-reach-v3-one-arm-left/**" --exclude=""
          test "$(head -c 7 art/source/enemies/hollow/rigged-poc/model/local-appearance-004/rigged-hollow-zombie-reach-v3-standard/hollow-rigged.blend)" = BLENDER
          test "$(head -c 7 art/source/enemies/hollow/rigged-poc/model/local-appearance-004/rigged-hollow-zombie-reach-v3-broken-leg-left/hollow-rigged.blend)" = BLENDER
          test "$(head -c 7 art/source/enemies/hollow/rigged-poc/model/local-appearance-004/rigged-hollow-zombie-reach-v3-broken-arm-right/hollow-rigged.blend)" = BLENDER
          test "$(head -c 7 art/source/enemies/hollow/rigged-poc/model/local-appearance-004/rigged-hollow-zombie-reach-v3-one-arm-left/hollow-rigged.blend)" = BLENDER
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Blender and PNG review dependencies
        run: python -m pip install --disable-pip-version-check bpy==4.5.15 Pillow==11.3.0
      - name: Check source authoring syntax
        run: python -m py_compile tools/sprite-lab/author-hollow-body-diversity.py
      - name: Physically morph four cape-free 3D models and render real source motion
        env:
          OMP_NUM_THREADS: '4'
        run: python tools/sprite-lab/author-hollow-body-diversity.py
      - name: Retain owner-reviewable animations and editable Blender meshes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hollow-physical-body-diversity-candidates
          path: |
            artifacts/hollow-body-diversity/*.gif
            artifacts/hollow-body-diversity/*.png
            artifacts/hollow-body-diversity/*.blend
            artifacts/hollow-body-diversity/*.json
            artifacts/hollow-body-diversity/README.md
          if-no-files-found: warn
          retention-days: 14
