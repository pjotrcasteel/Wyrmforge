name: Deploy private playtest collector

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'services/playtest-collector/**'
      - '.github/workflows/collector-deploy.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: playtest-collector
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify configuration
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_ID: ${{ vars.WYRMFORGE_D1_DATABASE_ID }}
          ADMIN_TOKEN: ${{ secrets.WYRMFORGE_COLLECTOR_ADMIN_TOKEN }}
          RATE_KEY: ${{ secrets.WYRMFORGE_COLLECTOR_RATE_KEY }}
        run: |
          test -n "$CF_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN secret'; exit 1; }
          test -n "$CF_ACCOUNT" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID secret'; exit 1; }
          test -n "$DATABASE_ID" || { echo 'Missing WYRMFORGE_D1_DATABASE_ID variable'; exit 1; }
          test -n "$ADMIN_TOKEN" || { echo 'Missing WYRMFORGE_COLLECTOR_ADMIN_TOKEN secret'; exit 1; }
          test -n "$RATE_KEY" || { echo 'Missing WYRMFORGE_COLLECTOR_RATE_KEY secret'; exit 1; }

      - name: Install and test Worker
        working-directory: services/playtest-collector
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run check

      - name: Generate Wrangler configuration
        working-directory: services/playtest-collector
        env:
          WYRMFORGE_D1_DATABASE_ID: ${{ vars.WYRMFORGE_D1_DATABASE_ID }}
        run: npm run configure

      - name: Apply D1 migrations
        working-directory: services/playtest-collector
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy collector
        working-directory: services/playtest-collector
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Set confidential Worker secrets
        working-directory: services/playtest-collector
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_TOKEN: ${{ secrets.WYRMFORGE_COLLECTOR_ADMIN_TOKEN }}
          RATE_KEY: ${{ secrets.WYRMFORGE_COLLECTOR_RATE_KEY }}
        run: |
          printf '%s' "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN
          printf '%s' "$RATE_KEY" | npx wrangler secret put RATE_LIMIT_KEY
