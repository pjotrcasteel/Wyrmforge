name: Fast voxel experiment Pages
on:
  push:
    branches: [main]
    paths:
      - 'src/Wyrmforge.Presentation.Web/wwwroot/experimental/voxel/**'
      - 'tests/javascript/experimental-voxel/**'
      - '.github/workflows/voxel-fast-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  fast-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run focused voxel tests
        run: node --test tests/javascript/experimental-voxel/*.test.mjs
      - name: Restore most recent assembled production site
        id: site
        uses: actions/cache/restore@v4
        with:
          path: ./artifacts/web/wwwroot
          key: pages-production-${{ github.sha }}
          restore-keys: |
            pages-production-
          fail-on-cache-miss: true
      - name: Overlay experimental files without rebuilding production
        run: |
          set -euo pipefail
          test -s artifacts/web/wwwroot/index.html
          test -s artifacts/web/wwwroot/_framework/blazor.webassembly.js
          mkdir -p artifacts/web/wwwroot/experimental/voxel
          cp -a src/Wyrmforge.Presentation.Web/wwwroot/experimental/voxel/. artifacts/web/wwwroot/experimental/voxel/
          test -s artifacts/web/wwwroot/experimental/voxel/index.html
          test -s artifacts/web/wwwroot/experimental/voxel/main.js
          test -s artifacts/web/wwwroot/experimental/voxel/world.js
          echo "Restored production site from cache: ${{ steps.site.outputs.cache-matched-key }}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./artifacts/web/wwwroot
      - name: Deploy combined site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published experiment responds
        run: |
          python3 - <<'PY'
          import time, urllib.request
          url = "https://pjotrcasteel.github.io/Wyrmforge/experimental/voxel/index.html"
          for attempt in range(12):
              try:
                  request = urllib.request.Request(url + "?check=" + "${{ github.sha }}", headers={"User-Agent": "Wyrmforge-Experiment-Check/1.0"})
                  with urllib.request.urlopen(request, timeout=15) as response:
                      body = response.read().decode("utf-8")
                  if "WYRMFORGE" in body and "VOXEL V2" in body:
                      print("Live experiment verified:", url)
                      break
              except Exception as error:
                  print("Waiting for Pages propagation:", error)
              time.sleep(5)
          else:
              raise SystemExit("Experiment URL was not verifiable after deployment")
          PY
