name: Hollowed preserved-source art polish and genuine visual QC

on:
  push:
    branches: [art/hollowed-cloth-ash-polish-20261028]
    paths:
      - 'tools/art/hollowed/**'
      - '.github/workflows/hollowed-art-polish-qc.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/art/hollowed/**'
      - '.github/workflows/hollowed-art-polish-qc.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hollow-art-polish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-real-mesh:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Fetch only the preserved no-cape Hollowed rig
        run: |
          set -euo pipefail
          git lfs pull --include="art/source/enemies/hollow/rigged-poc/model/local-appearance-004/rigged-hollow-zombie-reach-v3-standard/**" --exclude=""
          test "$(head -c 7 art/source/enemies/hollow/rigged-poc/model/local-appearance-004/rigged-hollow-zombie-reach-v3-standard/hollow-rigged.blend)" = "BLENDER"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow for contact sheets using matching Python ABI
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python -m py_compile tools/art/hollowed/*.py
      - name: Install authentic Blender 4.5.14 LTS with bmesh
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error             "https://download.blender.org/release/Blender4.5/blender-4.5.14-linux-x64.tar.xz" -o /tmp/blender.tar.xz
          mkdir -p /tmp/blender-bin
          tar -xJf /tmp/blender.tar.xz --strip-components=1 -C /tmp/blender-bin
          /tmp/blender-bin/blender -b --factory-startup --python-expr "import bpy,bmesh; print('HOLLOW_ART_BLENDER',bpy.app.version_string)"
      - name: Rebuild Work's existing trimmed and internal-ember source
        env:
          OMP_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          mkdir -p artifacts/hollowed-polish/source
          /tmp/blender-bin/blender -b -t 2 --python-exit-code 1             --python tools/animation/author_hollow_foundation.py --             --out artifacts/hollowed-polish/source --only walk,attack
          test -s artifacts/hollowed-polish/source/hollow-foundation.blend
          test -s artifacts/hollowed-polish/source/source-manifest.json
      - name: Apply additional cloth/char/ember art candidate
        env:
          OMP_NUM_THREADS: '2'
        run: |
          /tmp/blender-bin/blender -b -t 2 --python-exit-code 1             --python tools/art/hollowed/continue_existing_source.py --             --source artifacts/hollowed-polish/source/hollow-foundation.blend             --output artifacts/hollowed-polish/candidate/hollow-art-v2.blend
      - name: Render real original and revised mesh (no mockups)
        env:
          OMP_NUM_THREADS: '2'
        run: |
          PYTHONPATH="$(python -c 'import site; print(site.getsitepackages()[0])')"           /tmp/blender-bin/blender -b -t 2 --python-exit-code 1             --python tools/art/hollowed/render_before_after.py --             --before artifacts/hollowed-polish/source/hollow-foundation.blend             --after artifacts/hollowed-polish/candidate/hollow-art-v2.blend             --out artifacts/hollowed-polish/review
          test -s artifacts/hollowed-polish/review/real-hollowed-before-after.png
      - name: Save genuine Blender output and before/after previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hollowed-preserved-source-real-blender-review
          path: |
            artifacts/hollowed-polish/source/source-manifest.json
            artifacts/hollowed-polish/source/hollow-foundation.blend
            artifacts/hollowed-polish/candidate/hollow-art-v2.blend
            artifacts/hollowed-polish/candidate/art-qc.json
            artifacts/hollowed-polish/review/real-hollowed-before-after.png
            artifacts/hollowed-polish/review/image-qc.json
            artifacts/hollowed-polish/review/before/*.png
            artifacts/hollowed-polish/review/after/*.png
          if-no-files-found: warn
          retention-days: 14
