name: Approved Wet Forest material sheet
on:
  pull_request:
    paths:
      - 'tools/art/export_approved_ground_sheet.py'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/art/environment/wet-forest-materials-painted.webp'
      - '.github/workflows/approved-ground-sheet.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install pillow==11.3.0
      - name: Export unchanged approved material paintings
        run: |
          python tools/art/export_approved_ground_sheet.py \
            --source src/Wyrmforge.Presentation.Web/wwwroot/art/environment/wet-forest-materials-painted.webp \
            --output artifacts/wet-forest-approved-ground-materials.png
      - name: Preserve material sheet and original source for exact visual audit
        uses: actions/upload-artifact@v4
        with:
          name: approved-wet-forest-ground-sheet-${{ github.sha }}
          path: |
            artifacts/wet-forest-approved-ground-materials.png
            src/Wyrmforge.Presentation.Web/wwwroot/art/environment/wet-forest-materials-painted.webp
          retention-days: 30
