name: Shared GPU lighting proof
on:
  push:
    branches: [fix/hunt-ground-repetition]
  pull_request:
    paths:
      - 'src/Wyrmforge.Presentation.Web/wwwroot/js/lighting/**'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/js/arena-gpu-world.js'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/js/arena-gpu-fireball.js'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/js/arena-fireball-v5.js'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/js/hunt-gpu-layers.js'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/js/arena.js'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/js/arena-environment.js'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/js/arena-territory-art.js'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/js/arena-wet-forest-art.js'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/js/arena-live-wet-forest-materials.js'
      - 'tests/javascript/arena-wet-forest-art.test.mjs'
      - 'tests/javascript/arena-environment.test.mjs'
      - 'tests/javascript/arena-gpu-world.test.mjs'
      - 'tests/javascript/hunt-gpu-surface-contract.test.mjs'
      - 'tests/javascript/hunt-gpu-capture-revision.test.mjs'
      - 'tests/javascript/hunt-gpu-evidence-report.mjs'
      - 'tests/javascript/hunt-gpu-evidence-report.test.mjs'
      - 'tests/javascript/g4-device-review.test.mjs'
      - 'tests/javascript/g4-consent-gate.test.mjs'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/js/lighting/g4-consent-gate.js'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/index.html'
      - 'tests/javascript/arena-gpu-fireball.test.mjs'
      - 'tests/javascript/arena-fireball-v5.test.mjs'
      - 'src/Wyrmforge.Application/Runs/Simulation/Lighting/ProjectileLightingProjection.cs'
      - 'tests/Wyrmforge.Application.Tests/Runs/Lighting/GpuLightingFrameProjectionTests.cs'
      - 'tests/Wyrmforge.Browser.Tests/HuntGpuAdapterBrowserTests.cs'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/art/lighting-proof/**'
      - 'src/Wyrmforge.Presentation.Web/Pages/ArenaLightEngine*'
      - 'tests/Wyrmforge.Browser.Tests/UniversalLightingBrowserTests.cs'
      - 'tests/javascript/universal-lighting.test.mjs'
      - '.github/workflows/universal-lighting.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gpu-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Restore runtime Git LFS art (exclude large source archives)
        run: |
          git lfs pull --include="src/Wyrmforge.Presentation.Web/wwwroot/**" --exclude=""
          python3 tools/development/verify_web_assets.py

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Registry and sprite binding regression tests
        run: node --test tests/javascript/arena-wet-forest-art.test.mjs tests/javascript/arena-environment.test.mjs tests/javascript/universal-lighting.test.mjs tests/javascript/sprite-emission.test.mjs tests/javascript/arena-gpu-world.test.mjs tests/javascript/hunt-gpu-surface-contract.test.mjs tests/javascript/hunt-gpu-capture-revision.test.mjs tests/javascript/hunt-gpu-evidence-report.test.mjs tests/javascript/arena-gpu-fireball.test.mjs tests/javascript/arena-fireball-v5.test.mjs tests/javascript/g4-device-review.test.mjs tests/javascript/g4-consent-gate.test.mjs
      - name: Build tests and publish actual application
        run: |
          dotnet test tests/Wyrmforge.Application.Tests -c Release --filter 'FullyQualifiedName~GpuLightingFrameProjectionTests|FullyQualifiedName~ActorAppearanceLightingProjectionTests'
          dotnet build tests/Wyrmforge.Browser.Tests -c Release
          dotnet publish src/Wyrmforge.Presentation.Web -c Release -o artifacts/web
      - name: Install Chromium
        run: pwsh tests/Wyrmforge.Browser.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Serve app and verify complete black framebuffer and source lifecycle
        env:
          WYRMFORGE_BASE_URL: http://127.0.0.1:4173/
          WYRMFORGE_BROWSER_ARTIFACTS: ${{ github.workspace }}/artifacts/gpu-proof
        run: |
          python3 tools/development/spa_server.py --port 4173 --directory artifacts/web/wwwroot > artifacts/gpu-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          dotnet test tests/Wyrmforge.Browser.Tests -c Release --no-build --filter 'FullyQualifiedName~UniversalLightingBrowserTests|FullyQualifiedName~HuntGpuAdapterBrowserTests|FullyQualifiedName~Mobile_LiveHuntGpu_RendersActorsAndKeepsSimulationMoving|FullyQualifiedName~Mobile_G4DeviceReview_RecordsRealHuntAndExportsEvidence|FullyQualifiedName~Mobile_G4Consent_IsAnObviousSingleChoiceBeforeGameMenus|FullyQualifiedName~Mobile_AshlingEyes_UseBoundedAuthoritativeLightSources'
      - name: Report G4 four-direction shadow geometry before upload
        if: always()
        run: |
          found=0
          for report in artifacts/gpu-proof/g4-shadow-direction-metrics-*.json; do
            if [ -f "$report" ]; then
              found=1
              printf 'G4 real-WebGL directional shadow proof (%s): ' "$report"
              cat "$report"
              printf '\n'
            fi
          done
          if [ "$found" -eq 0 ]; then
            printf 'G4 direction test produced no metrics; check test discovery.\n'
          fi
      - name: Summarize real-game lighting evidence with quality and runtime metrics
        if: success()
        run: node tests/javascript/hunt-gpu-evidence-report.mjs artifacts/gpu-proof
      - name: Encode genuine running-Hunt GPU recording for mobile playback
        if: always()
        run: |
          source=artifacts/gpu-proof/live-hunt-g4-directional-shadow-390.webm
          output=artifacts/gpu-proof/live-hunt-g4-directional-shadow-390.mp4
          if [ -s "$source" ]; then
            if ! command -v ffmpeg >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq ffmpeg
            fi
            ffmpeg -hide_banner -loglevel error -y -i "$source" -an -vf fps=24 -r 24 -c:v libx264 -pix_fmt yuv420p -preset veryfast -crf 21 -movflags +faststart "$output"
            ffprobe -v error -select_streams v:0 -show_entries stream=width,height,nb_frames,duration               -of default=noprint_wrappers=1 "$output"
            test -s "$output"
          else
            printf 'Live Hunt video not produced; inspect browser test recording failure.\n'
          fi
      - name: Preserve mobile viewport captures (not physical-device evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-gpu-lighting-mobile-${{ github.sha }}
          path: |
            artifacts/gpu-proof/
            artifacts/gpu-server.log
          retention-days: 30
