name: Wizard clean human gait native review
on:
  pull_request:
    paths:
      - '.github/workflows/wizard-clean-gait.yml'
      - 'tools/sprite-lab/build_clean_human_gait.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-human-gait:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Obtain pinned CC0 anatomy and Blender
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/wizard-clean-gait "$RUNNER_TEMP/human-source"
          curl -fL --retry 3 \
            'https://download.blender.org/demo/asset-bundles/human-base-meshes/human-base-meshes-bundle-v1.4.1.zip' \
            -o "$RUNNER_TEMP/humans.zip"
          echo '811f43accbb31a88266d932f8f5563b2d13586fca0ba2693aad1f5fe582b3515  '"$RUNNER_TEMP/humans.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/humans.zip" -d "$RUNNER_TEMP/human-source"
          base='https://download.blender.org/release/Blender4.5'
          archive='blender-4.5.15-linux-x64.tar.xz'
          curl -fL --retry 3 "$base/$archive" -o "$RUNNER_TEMP/$archive"
          curl -fL --retry 3 "$base/blender-4.5.15.sha256" -o "$RUNNER_TEMP/checksums"
          (cd "$RUNNER_TEMP" && grep " $archive$" checksums | sha256sum -c)
          tar -xf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/blender-4.5.15-linux-x64" >> "$GITHUB_PATH"
      - name: Build and render independent anatomical gait
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libx11-6 libxrender1 libxi6 >/dev/null
          bundle="$(find "$RUNNER_TEMP/human-source" -type f -name human_base_meshes_bundle.blend -print -quit)"
          test -f "$bundle"
          LIBGL_ALWAYS_SOFTWARE=1 blender --background --factory-startup --threads 2 --python-exit-code 1 \
            --python tools/sprite-lab/build_clean_human_gait.py -- \
            --bundle "$bundle" --output artifacts/wizard-clean-gait
      - name: Publish original frames and editable source before optional video encoding
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wizard-clean-gait-original-frames
          path: |
            artifacts/wizard-clean-gait/frame-*.png
            artifacts/wizard-clean-gait/clean-human-walk-source.blend
            artifacts/wizard-clean-gait/clean-gait-metrics.json
          if-no-files-found: warn
          retention-days: 30
      - name: Encode original animation and inspect all 16 poses
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f artifacts/wizard-clean-gait/frame-15.png ]; then exit 0; fi
          python3 -m pip install 'Pillow>=10,<14'
          python3 tools/sprite-lab/actor_motion_review.py \
            --source artifacts/wizard-clean-gait --output artifacts/wizard-clean-gait/review \
            --frames 16 --fps 12
          sudo apt-get install -y -qq ffmpeg >/dev/null
          ffmpeg -hide_banner -loglevel error -y -framerate 12 \
            -i artifacts/wizard-clean-gait/frame-%02d.png -c:v libx264 \
            -pix_fmt yuv420p artifacts/wizard-clean-gait/clean-gait.mp4
          cp art/source/characters/wizard/reference/approved-gothic-wizard.webp \
            artifacts/wizard-clean-gait/approved-visual-reference.webp
          cat > artifacts/wizard-clean-gait/README.txt <<'DOC'
          Independent anatomical gait review / ORIGINAL CC0 mesh, NOT the old
          CMU BVH retarget and NOT the approved Gothic wizard artwork yet.
          Real Blender still frames, MP4, GIF, original source .blend.
          Owner's artistic acceptance remains pending.
          DOC
          (cd artifacts/wizard-clean-gait && zip -q -r \
            WyrmForge_Wizard_Clean_Gait_Recording.zip clean-human-walk-source.blend \
            clean-gait-metrics.json clean-gait.mp4 \
            review/motion-loop.gif review/motion-contact-sheet.png \
            review/motion-review.json approved-visual-reference.webp README.txt)
      - name: Preserve evidence even when validation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wizard-clean-gait-recorded-native-review
          path: |
            artifacts/wizard-clean-gait/WyrmForge_Wizard_Clean_Gait_Recording.zip
            artifacts/wizard-clean-gait/clean-gait-metrics.json
            artifacts/wizard-clean-gait/frame-*.png
            artifacts/wizard-clean-gait/clean-human-walk-source.blend
          if-no-files-found: warn
          retention-days: 30
