name: Hollowed broken-leg in-game verification
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/Wyrmforge.Presentation.Web/wwwroot/js/hollow-injury-variants.js'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/js/hollow-sprites.js'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/art/enemies/hollow-rigged/injuries/**'
      - 'tests/javascript/hollow-injury-variants.test.mjs'
      - 'tests/javascript/hollow-sprites.test.mjs'
      - '.github/workflows/hollowed-injury-gameplay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original playback, source hashes and damaged-leg variant
        run: |
          node --check src/Wyrmforge.Presentation.Web/wwwroot/js/hollow-injury-variants.js
          node --check src/Wyrmforge.Presentation.Web/wwwroot/js/hollow-sprites.js
          node --test tests/javascript/hollow-injury-variants.test.mjs tests/javascript/hollow-sprites.test.mjs
      - name: Use preinstalled .NET 10 SDK
        run: |
          dotnet --list-sdks
          dotnet --list-sdks | grep -Eq '^10\.0\.' || { echo "::error::Runner does not have the .NET 10 SDK"; exit 1; }
          dotnet --version
      - name: Build original C# game without gameplay changes
        run: |
          dotnet restore src/Wyrmforge.Presentation.Web/Wyrmforge.Presentation.Web.csproj
          dotnet build src/Wyrmforge.Presentation.Web/Wyrmforge.Presentation.Web.csproj -c Release --no-restore
