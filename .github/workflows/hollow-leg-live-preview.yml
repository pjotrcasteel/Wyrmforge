name: Hollowed leg review integrity
on:
  push:
    branches: [feat/actor-lit-sprite-production]
    paths:
      - 'src/Wyrmforge.Presentation.Web/wwwroot/js/hollow-sprites.js'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/js/hollow-leg-review.js'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/art/enemies/hollow-rigged/review/**'
      - 'tests/javascript/hollow-leg-review.test.mjs'
      - 'tests/javascript/hollow-sprites.test.mjs'
      - '.github/workflows/hollow-leg-live-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original and opt-in Hollowed playback
        run: |
          node --check src/Wyrmforge.Presentation.Web/wwwroot/js/hollow-sprites.js
          node --check src/Wyrmforge.Presentation.Web/wwwroot/js/hollow-leg-review.js
          node --test tests/javascript/hollow-sprites.test.mjs tests/javascript/hollow-arm-variants.test.mjs tests/javascript/hollow-leg-review.test.mjs
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Publish original WebAssembly app
        run: |
          dotnet restore src/Wyrmforge.Presentation.Web/Wyrmforge.Presentation.Web.csproj
          dotnet publish src/Wyrmforge.Presentation.Web/Wyrmforge.Presentation.Web.csproj -c Release --no-restore -o artifacts/hollow-leg-web
      - name: Install Chromium browser preview
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve original published game
        run: |
          python3 tools/development/spa_server.py --port 4175 --directory ./artifacts/hollow-leg-web/wwwroot > ./artifacts/hollow-leg-spa.log 2>&1 &
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4175/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat ./artifacts/hollow-leg-spa.log
          exit 1
      - name: Record 320px and 390px actual Arena Canvas
        run: node tools/sprite-lab/capture-hollow-leg-hunt.cjs artifacts/hollow-leg-live-review http://127.0.0.1:4175
      - name: Preserve phone-sized runtime capture and evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hollowed-leg-arena-review
          path: |
            artifacts/hollow-leg-live-review/
            artifacts/hollow-leg-spa.log
          retention-days: 21
          if-no-files-found: warn
