name: Hollowed source-bound internal fire & attack QC

on:
  push:
    branches: [fix/hollowed-animation-polish-20261027]
    paths:
      - 'tools/sprite-lab/author-hollow-inner-embers.py'
      - '.github/workflows/hollow-inner-fire-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blender-fire-source-qc:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Restore actual no-cape Hollowed 3D model
        run: |
          git lfs pull --include="art/source/enemies/hollow/rigged-poc/model/local-appearance-004/rigged-hollow-zombie-reach-v3-standard/**" --exclude=""
          test "$(head -c 7 art/source/enemies/hollow/rigged-poc/model/local-appearance-004/rigged-hollow-zombie-reach-v3-standard/hollow-rigged.blend)" = BLENDER

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install existing Blender 4.5 source renderer
        run: python -m pip install --disable-pip-version-check bpy==4.5.15 Pillow==11.3.0

      - name: Syntax and real model preflight
        run: |
          python -m py_compile tools/sprite-lab/author-hollow-inner-embers.py
          python tools/sprite-lab/author-hollow-inner-embers.py --variant standard --directions S

      - name: Upload editable source, surface-emissive mask and comparison frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hollow-source-internal-fire-qc
          path: |
            artifacts/hollow-internal-embers/**/*.blend
            artifacts/hollow-internal-embers/**/*.png
            artifacts/hollow-internal-embers/**/*.gif
            artifacts/hollow-internal-embers/**/*.json
          if-no-files-found: warn
          retention-days: 14
