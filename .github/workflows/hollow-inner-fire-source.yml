name: Hollowed source-bound internal fire & attack QC

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/sprite-lab/author-hollow-inner-embers.py'
      - 'tools/sprite-lab/check-hollow-inner-embers.py'
      - '.github/workflows/hollow-inner-fire-source.yml'
  push:
    branches: [fix/hollowed-animation-polish-20261027]
    paths:
      - 'tools/sprite-lab/author-hollow-inner-embers.py'
      - 'tools/sprite-lab/check-hollow-inner-embers.py'
      - '.github/workflows/hollow-inner-fire-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blender-fire-source-qc:
    name: "Hollowed internal fire - ${{ matrix.variant }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # All four real cape-free production bodies. Source-only crawlers
        # require separate sculpt and approved editable 3D rig exports.
        variant: [standard, broken-arm-right, one-arm-left, broken-leg-left]
    steps:
      - uses: actions/checkout@v4

      - name: Restore this actual cape-free Hollowed 3D model
        run: |
          git lfs pull --include="art/source/enemies/hollow/rigged-poc/model/local-appearance-004/rigged-hollow-zombie-reach-v3-${{ matrix.variant }}/**" --exclude=""
          source="art/source/enemies/hollow/rigged-poc/model/local-appearance-004/rigged-hollow-zombie-reach-v3-${{ matrix.variant }}/hollow-rigged.blend"
          test "$(head -c 7 "$source")" = BLENDER

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install existing Blender 4.5 source renderer
        run: python -m pip install --disable-pip-version-check bpy==4.5.15 Pillow==11.3.0

      - name: Syntax and render eight real facing directions with source-bound fire
        run: |
          python -m py_compile tools/sprite-lab/author-hollow-inner-embers.py
          python tools/sprite-lab/author-hollow-inner-embers.py --variant "${{ matrix.variant }}" --directions all

      - name: Validate visible eye, mouth, and actor-consistent emissive masks
        run: |
          python tools/sprite-lab/check-hollow-inner-embers.py \
            "artifacts/hollow-internal-embers/${{ matrix.variant }}/manifest.json"

      - name: Upload editable source, 8 directional animations, emissive atlas and QC data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hollow-inner-fire-${{ matrix.variant }}-eight-facings
          path: |
            artifacts/hollow-internal-embers/${{ matrix.variant }}/*.blend
            artifacts/hollow-internal-embers/${{ matrix.variant }}/*.png
            artifacts/hollow-internal-embers/${{ matrix.variant }}/*.gif
            artifacts/hollow-internal-embers/${{ matrix.variant }}/*.json
          if-no-files-found: warn
          retention-days: 14
