name: Inspect real Hollowed crawler rig geometry

on:
  push:
    branches: [fix/hollowed-animation-polish-20261027]
    paths:
      - 'tools/sprite-lab/inspect-hollow-crawler-source.py'
      - '.github/workflows/hollow-crawler-source-inspection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore real standard no-cape Blender source
        run: |
          git lfs pull --include="art/source/enemies/hollow/rigged-poc/model/local-appearance-004/rigged-hollow-zombie-reach-v3-standard/**" --exclude=""
          test "$(head -c 7 art/source/enemies/hollow/rigged-poc/model/local-appearance-004/rigged-hollow-zombie-reach-v3-standard/hollow-rigged.blend)" = BLENDER
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check bpy==4.5.15
      - run: python tools/sprite-lab/inspect-hollow-crawler-source.py
      - uses: actions/upload-artifact@v4
        with:
          name: hollow-crawler-anatomy
          path: artifacts/hollow-crawler-inspection/anatomy.json
          retention-days: 7
          if-no-files-found: error
