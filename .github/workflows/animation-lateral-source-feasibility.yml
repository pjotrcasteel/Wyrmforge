name: Animation lateral gait source feasibility (diagnostic only)
on:
  pull_request:
    paths:
      - '.github/workflows/animation-lateral-source-feasibility.yml'
      - 'tools/animation/author_hollow_foundation.py'
      - 'tools/animation/validate_source.py'
      - 'tools/animation/test_source_qc.py'
      - 'tools/animation/audit_source_direction_switch.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: animation-lateral-gait-feasibility-${{ github.ref }}
  # Long-running Blender contact studies must finish even when new commits land.
  cancel-in-progress: false
jobs:
  test-orthogonal-source-gait:
    name: Orthogonal ${{ matrix.mode }} ${{ matrix.heading }} degrees
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        heading: [90, -90]
        mode: [walk, attack]
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            tools/animation
            art/source/enemies/hollow/rigged-poc/model/local-appearance-004/rigged-hollow-zombie-reach-v3-standard
      - uses: actions/cache@v4
        id: blender
        with:
          path: .cache/blender-4.5.3-linux-x64
          key: animation-source-blender-4.5.3-linux-x64-975c58fc
      - name: Restore pinned Blender
        if: steps.blender.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache
          curl --fail --location --retry 2 https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz -o .cache/blender.tar.xz
          echo '975c58fcb244273838534bba771e64ad87739216b0f9b39a888531a49a72d845  .cache/blender.tar.xz' | sha256sum --check
          tar --no-same-owner -xf .cache/blender.tar.xz -C .cache
          rm .cache/blender.tar.xz
      - name: Author genuine side-step pose source; record rejection without hiding it
        shell: bash
        env:
          HEADING: ${{ matrix.heading }}
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          SOURCE="artifacts/an6-side-step-${HEADING}-${MODE}"
          CLIPS=walk
          if [ "$MODE" = attack ]; then CLIPS=walk,attack-travel; fi
          BLENDER="$PWD/.cache/blender-4.5.3-linux-x64/blender"
          mkdir -p "$SOURCE"
          set +e
          "$BLENDER" -b -t 2 --python-exit-code 1 --python tools/animation/author_hollow_foundation.py -- --out "$SOURCE" --only "$CLIPS" --travel-heading-degrees "$HEADING" --experimental-lateral-motion --stride-metres .28 --stance-fraction .6 --flexion-reserve-pixels 2 --pelvis-drop-metres .075 --compress-source > "$SOURCE/author.log" 2>&1
          AUTHOR_EXIT=$?
          SOURCE_QC_EXIT=99
          MUTATIONS_EXIT=99
          ENVELOPE_EXIT=99
          if [ "$AUTHOR_EXIT" -eq 0 ]; then
            "$BLENDER" -b -t 2 --python-exit-code 1 --python tools/animation/validate_source.py -- "$SOURCE" > "$SOURCE/independent-validate.log" 2>&1
            SOURCE_QC_EXIT=$?
            if [ "$SOURCE_QC_EXIT" -eq 0 ]; then
              python3 tools/animation/test_source_qc.py "$SOURCE" --blender "$BLENDER" > "$SOURCE/mutation-tests.log" 2>&1
              MUTATIONS_EXIT=$?
              if [ "$MODE" = attack ] && [ "$MUTATIONS_EXIT" -eq 0 ]; then
                "$BLENDER" -b -t 2 --python-exit-code 1 --python tools/animation/validate_motion_envelope.py -- "$SOURCE" > "$SOURCE/source-envelope.log" 2>&1
                ENVELOPE_EXIT=$?
              fi
            fi
          fi
          set -e
          export SOURCE AUTHOR_EXIT SOURCE_QC_EXIT MUTATIONS_EXIT ENVELOPE_EXIT
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          source=Path(os.environ['SOURCE'])
          heading=float(os.environ['HEADING'])
          a=int(os.environ['AUTHOR_EXIT'])
          q=int(os.environ['SOURCE_QC_EXIT'])
          n=int(os.environ['MUTATIONS_EXIT'])
          envelope=int(os.environ['ENVELOPE_EXIT'])
          feasible=a==q==n==0 and (os.environ['MODE']=='walk' or envelope==0)
          report={'sourceStudyOnly':True,'runtimeAccepted':False,'productionAsset':False,
                  'headingDegrees':heading,'study':os.environ['MODE'],'strideMetres':.28,'oneNativePixelBudgetUnchanged':True,
                  'authorExit':a,'independentSourceQCExit':q,'negativeMutationQCExit':n,
                  'sourceMotionEnvelopeExit':envelope if os.environ['MODE']=='attack' else None,
                  'sourceRigFeasible':feasible,'requiresEightDirectionMaterialAndCsharpProof':True}
          if (source/'source-manifest.json').exists():
              m=json.loads((source/'source-manifest.json').read_text())
              assert m['experimentalLateralMotion']['sourceStudyOnly']
              assert not m['experimentalLateralMotion']['acceptedForRuntime']
              report['maxAuthoringStanceSlipMetres']=m['clips']['walk']['maxStanceSlipMetres']
          (source/'source-feasibility.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
          # A diagnostic red result is not a successful gait; the summary
          # is machine-readable and preserved rather than raising tolerances.
          if [ "$AUTHOR_EXIT" -ne 0 ] || [ "$SOURCE_QC_EXIT" -ne 0 ] || [ "$MUTATIONS_EXIT" -ne 0 ] || { [ "$MODE" = attack ] && [ "$ENVELOPE_EXIT" -ne 0 ]; }; then
            echo "::warning::Orthogonal whole-body source is NOT anatomically validated; see uploaded diagnosis."
          fi
      - name: Diagnose every real forward-to-sideways source contact transition
        if: matrix.mode == 'attack'
        env:
          HEADING: ${{ matrix.heading }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/animation/audit_source_direction_switch.py --self-test
          BASE=artifacts/an6-forward-reference
          SIDE="artifacts/an6-side-step-${HEADING}-attack"
          BLENDER="$PWD/.cache/blender-4.5.3-linux-x64/blender"
          "$BLENDER" -b -t 2 --python-exit-code 1 --python tools/animation/author_hollow_foundation.py -- --out "$BASE" --only walk,attack-travel --stride-metres .28 --stance-fraction .6 --flexion-reserve-pixels 2 --pelvis-drop-metres .075 --compress-source > "$SIDE/forward-author.log" 2>&1
          "$BLENDER" -b -t 2 --python-exit-code 1 --python tools/animation/validate_source.py -- "$BASE" > "$SIDE/forward-independent-validate.log" 2>&1
          python3 tools/animation/audit_source_direction_switch.py "$BASE/source-manifest.json" "$SIDE/source-manifest.json" --diagnostic --out "$SIDE/direction-switch-qc.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          path=Path(f"artifacts/an6-side-step-{os.environ['HEADING']}-attack/direction-switch-qc.json")
          result=json.loads(path.read_text())
          manifest=json.loads(Path(f"artifacts/an6-side-step-{os.environ['HEADING']}-attack/source-manifest.json").read_text())
          expected=sum(manifest['clips'][clip]['frames'] for clip in ('walk','attack-travel'))
          assert result['scenarios']==expected and expected>16 and result['runtimeAccepted'] is False
          assert result['lateralHeadingDegrees']==float(os.environ['HEADING'])
          assert result['failedScenarios']==sum(not x['withinOneNativePixel'] for x in result['results'])
          print('REAL SOURCE SWITCH',result['scenarios'],'contacts compared,',
                result['failedScenarios'],'not yet safe; worst native source jump:',
                result['worstSourceNativeJump'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: an6-orthogonal-source-study-${{ matrix.heading }}-${{ matrix.mode }}
          path: |
            artifacts/an6-side-step-${{ matrix.heading }}-${{ matrix.mode }}/source-feasibility.json
            artifacts/an6-side-step-${{ matrix.heading }}-${{ matrix.mode }}/direction-switch-qc.json
            artifacts/an6-side-step-${{ matrix.heading }}-${{ matrix.mode }}/*.log
            artifacts/an6-side-step-${{ matrix.heading }}-${{ matrix.mode }}/independent-source-qc.json
            artifacts/an6-side-step-${{ matrix.heading }}-${{ matrix.mode }}/negative-source-qc.json
            artifacts/an6-side-step-${{ matrix.heading }}-${{ matrix.mode }}/source-manifest.json
          if-no-files-found: error
          retention-days: 14
