name: Hollowed moving attack and pass-by turn source QC

on:
  push:
    branches: [fix/hollowed-animation-polish-20261027]
    paths:
      - 'tools/sprite-lab/author-hollow-moving-attack.py'
      - 'tools/sprite-lab/author-hollow-attack-motion.py'
      - 'tools/sprite-lab/hollow-source-embers.py'
      - 'tools/sprite-lab/hollow-ragged-silhouette.py'
      - '.github/workflows/hollow-moving-attack.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/sprite-lab/author-hollow-moving-attack.py'
      - 'tools/sprite-lab/author-hollow-attack-motion.py'
      - 'tools/sprite-lab/hollow-source-embers.py'
      - 'tools/sprite-lab/hollow-ragged-silhouette.py'
      - '.github/workflows/hollow-moving-attack.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-source-motion:
    name: "Hollowed source run-strike-passby (standard)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Restore actual no-cape strike and source gait armatures
        run: |
          git lfs pull --include="art/source/enemies/hollow/rigged-poc/model/local-appearance-004/rigged-hollow-zombie-reach-v3-standard/**,art/source/enemies/hollow/rigged-poc/model/local-appearance-004/rigged-pixel-v3/hollow-rigged.blend" --exclude=""
          test "$(head -c 7 art/source/enemies/hollow/rigged-poc/model/local-appearance-004/rigged-pixel-v3/hollow-rigged.blend)" = BLENDER
          test "$(head -c 7 art/source/enemies/hollow/rigged-poc/model/local-appearance-004/rigged-hollow-zombie-reach-v3-standard/hollow-rigged.blend)" = BLENDER

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the existing source rig renderer
        run: python -m pip install --disable-pip-version-check bpy==4.5.15 Pillow==11.3.0

      - name: Generate actual 3D moving attack, and turning pursuit previews
        run: |
          python -m py_compile tools/sprite-lab/author-hollow-moving-attack.py
          python tools/sprite-lab/author-hollow-moving-attack.py --variant standard --directions SE

      - name: Verify animation intent manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          file=Path("artifacts/hollow-moving-strike/standard/manifest.json")
          data=json.loads(file.read_text())
          assert data["capeFree"] and data["3dSkinned"]
          assert data["preflightRigMatched"] and data["legGaitContinuousDuringAttack"]
          assert data["attackUninterruptedByTurn"]
          assert data["basePoseExactlyAuthoredWalk"]
          assert data["attackOnlyUpperBodyAdditive"]
          garment = data["garmentRevision"]
          assert data["shortJacketNotCoat"] and garment["raggedUpperThighHem"]
          assert garment["originalBodyAndLegsPreserved"]
          assert garment["waistLengthTatteredNotLongCoat"]
          assert garment["removedLongClothVertices"] > 0
          assert len(data["garmentComparisons"]) == 2
          assert min(data["garmentSilhouetteDifferencePixels"].values()) > 10
          for item in data["garmentComparisons"]:
              assert (file.parent/item).is_file()
          assert data["sourceAttack"]["diagonalClawRake"]
          assert data["sourceAttack"]["realTwoBoneIKClaw"]
          assert len(data["sourceAttack"]["authoredClawTargets"]) >= 8
          assert data["sourceAttack"]["impactAtFrame"] == 7
          assert data["attackPoses"] == 16 and data["attackFps"] == 12
          assert data["previewFps"] == 24 and data["frames"] == 56
          assert data["sourceEmissionOnSkinnedMesh"]
          assert min(data["sourceFireRegionVertices"][k] for k in ("eye-left","eye-right","open-mouth")) >= 3
          assert len(data["verifiedFirePixels"]) == 4
          assert all(v > 3 for v in data["verifiedFirePixels"].values())
          assert not data["runtimeIntegrated"] and not data["ownerApproved"]
          assert len(data["renders"]) == 4
          for item in data["renders"]:
              assert (file.parent/item).is_file()
          PY

      - name: Encode phone-friendly MP4 approval reviews (not just GIF)
        run: |
          command -v ffmpeg
          for scenario in running-strike pass-by-turn-and-chase; do
            left="artifacts/hollow-moving-strike/standard/standard-${scenario}-S.gif"
            right="artifacts/hollow-moving-strike/standard/standard-${scenario}-E.gif"
            output="artifacts/hollow-moving-strike/standard/standard-${scenario}-phone-review.mp4"
            ffmpeg -hide_banner -loglevel error -y -i "$left" -i "$right" \
              -filter_complex "[0:v]fps=24,scale=576:656:flags=neighbor[a];[1:v]fps=24,scale=576:656:flags=neighbor[b];[a][b]hstack=inputs=2,format=yuv420p[out]" \
              -map "[out]" -c:v libx264 -movflags +faststart -crf 20 "$output"
            test -s "$output"
          done

      - name: Upload source blend actions and animated owner review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hollow-moving-strike-passby-3d-standard
          path: |
            artifacts/hollow-moving-strike/standard/*.blend
            artifacts/hollow-moving-strike/standard/*.gif
            artifacts/hollow-moving-strike/standard/*.mp4
            artifacts/hollow-moving-strike/standard/*.png
            artifacts/hollow-moving-strike/standard/*.json
          if-no-files-found: warn
          retention-days: 14
