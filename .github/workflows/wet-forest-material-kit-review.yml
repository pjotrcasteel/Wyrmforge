name: Wet Forest three-material GPU review

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/Wyrmforge.Presentation.Web/Pages/ArenaMaterialKit.razor'
      - 'src/Wyrmforge.Presentation.Web/Pages/ArenaMaterialKit.razor.css'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/js/wet-forest-three-material-kit.js'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/js/wet-forest-gpu-material-review.js'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/js/arena-live-wet-forest-materials.js'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/js/arena-wet-forest-art.js'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/js/arena-environment.js'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/js/arena-territory-art.js'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/js/arena.js'
      - 'src/Wyrmforge.Application/Runs/Simulation/Environment/ArenaEnvironmentState.cs'
      - 'tests/Wyrmforge.Browser.Tests/WetForestPlayableMaterialBrowserTests.cs'
      - 'tests/javascript/arena-live-wet-forest-materials.test.mjs'
      - 'tests/Wyrmforge.Application.Tests/Runs/Simulation/ArenaEnvironmentStateTests.cs'
      - 'tests/Wyrmforge.Browser.Tests/WetForestMaterialKitBrowserTests.cs'
      - 'tests/javascript/wet-forest-three-material-kit.test.mjs'
      - 'tools/art/build_grass_moss_art_candidates.py'
      - 'tools/art/build_wet_mud_art_candidates.py'
      - 'tools/art/build_trampled_earth_art_candidates.py'
      - 'tools/art/quilt_ground_material_study.py'
      - 'user_handover_files/concepts/arena-v2/wet-forest/ground-materials/v1/**'
      - '.github/workflows/wet-forest-material-kit-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-material-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore published runtime art
        run: |
          git lfs pull --include="src/Wyrmforge.Presentation.Web/wwwroot/**" --exclude=""
          python3 tools/development/verify_web_assets.py
      - name: Regenerate PR340 source-backed material candidates from immutable paintings
        run: |
          python3 -m pip install -r tools/art/painted-requirements.txt
          python3 tools/art/build_grass_moss_art_candidates.py --output src/Wyrmforge.Presentation.Web/wwwroot/art/environment/wet-forest-source-backed/v1/grass-moss-art-candidates
          python3 tools/art/build_wet_mud_art_candidates.py --output src/Wyrmforge.Presentation.Web/wwwroot/art/environment/wet-forest-source-backed/v1/wet-mud-art-candidates
          python3 tools/art/build_trampled_earth_art_candidates.py --output src/Wyrmforge.Presentation.Web/wwwroot/art/environment/wet-forest-source-backed/v1/trampled-earth-art-candidates
          test -s src/Wyrmforge.Presentation.Web/wwwroot/art/environment/wet-forest-source-backed/v1/grass-moss-art-candidates/grass-moss-ART-CANDIDATE-01.png
          test -s src/Wyrmforge.Presentation.Web/wwwroot/art/environment/wet-forest-source-backed/v1/wet-mud-art-candidates/wet-mud-INDEPENDENT-ART-CANDIDATE-01.png
          test -s src/Wyrmforge.Presentation.Web/wwwroot/art/environment/wet-forest-source-backed/v1/trampled-earth-art-candidates/trampled-earth-INDEPENDENT-ART-CANDIDATE-01.png
      - name: Verify JavaScript recipe and GPU contracts
        run: node --test tests/javascript/wet-forest-three-material-kit.test.mjs tests/javascript/arena-live-wet-forest-materials.test.mjs
      - name: Restore and build targeted browser project
        run: |
          dotnet restore tests/Wyrmforge.Browser.Tests/Wyrmforge.Browser.Tests.csproj
          dotnet build tests/Wyrmforge.Browser.Tests/Wyrmforge.Browser.Tests.csproj -c Release --no-restore
      - name: Install Chromium
        run: pwsh tests/Wyrmforge.Browser.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Publish review site
        run: |
          dotnet restore src/Wyrmforge.Presentation.Web/Wyrmforge.Presentation.Web.csproj
          dotnet publish src/Wyrmforge.Presentation.Web/Wyrmforge.Presentation.Web.csproj -c Release --no-restore -o ./artifacts/web
      - name: Serve site
        run: |
          python3 tools/development/spa_server.py --port 4173 --directory ./artifacts/web/wwwroot > ./artifacts/material-kit-server.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat ./artifacts/material-kit-server.log
          exit 1
      - name: Run only three-material GPU mobile screenshot tests
        env:
          WYRMFORGE_BASE_URL: http://127.0.0.1:4173/
          WYRMFORGE_BROWSER_ARTIFACTS: ${{ github.workspace }}/artifacts/material-kit-png
        run: dotnet test tests/Wyrmforge.Browser.Tests/Wyrmforge.Browser.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~WetForestMaterialKitBrowserTests|FullyQualifiedName~WetForestPlayableMaterialBrowserTests" --logger "console;verbosity=normal"
      - name: Upload mobile GPU screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wet-forest-three-material-gpu-pngs
          path: |
            artifacts/material-kit-png
            artifacts/material-kit-server.log
          retention-days: 14
          if-no-files-found: warn
