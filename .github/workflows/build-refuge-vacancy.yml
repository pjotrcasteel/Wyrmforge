name: Build approved Refuge dormant building plates

on:
  push:
    branches: [fix/town-building-vacancy-no-black-haze-20261019]
    paths:
      - 'tools/art/build_town_vacancy.py'
      - '.github/workflows/build-refuge-vacancy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v6
        with:
          ref: fix/town-building-vacancy-no-black-haze-20261019
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install deterministic art tooling
        run: python -m pip install pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.12.0.88
      - name: Render three vacant building plates
        run: python tools/art/build_town_vacancy.py
      - name: Upload independently reviewable assets
        uses: actions/upload-artifact@v4
        with:
          name: wyrmforge-refuge-vacant-buildings
          path: src/Wyrmforge.Presentation.Web/wwwroot/art/town-vacant-*.webp
          retention-days: 14
      - name: Publish art to task branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Wyrmforge.Presentation.Web/wwwroot/art/town-vacant-*.webp
          if git diff --cached --quiet; then
            echo 'Rendered assets unchanged.'
          else
            git commit -m 'Add authored dormant Refuge building plates'
            git push origin HEAD:fix/town-building-vacancy-no-black-haze-20261019
          fi
