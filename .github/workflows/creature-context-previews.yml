name: Creature audio scene previews for Safari

on:
  push:
    branches: [audio/phase1-menu-foley-audition]
    paths:
      - tools/audio/render_creature_scenes.py
      - .github/workflows/creature-context-previews.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the current audio draft
        uses: actions/checkout@v4
        with:
          fetch-depth: 64
          persist-credentials: true
      - name: Install FFmpeg for offline sound mixing
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Build exact-source, Safari-playable encounter demonstrations
        run: python3 tools/audio/render_creature_scenes.py
      - name: Check source integrity and copy the exported scenes to the PR
        shell: bash
        run: |
          set -euo pipefail
          for sound in docs/audio/previews/{hollow,ashling}-{approach,hit,death}-ab.mp3 \
                       docs/audio/previews/{hollow,ashling}-encounter-{1,2}.mp3; do
            ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 "$sound"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audio/previews/*-ab.mp3 docs/audio/previews/*-encounter-*.mp3 docs/audio/previews/creature-encounters-index.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(audio): publish ten Safari creature encounter audition MP3s"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Keep all previews available as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: wyrmforge-creature-context-mp3
          path: |
            docs/audio/previews/*-ab.mp3
            docs/audio/previews/*-encounter-*.mp3
            docs/audio/previews/creature-encounters-index.json
          if-no-files-found: error
