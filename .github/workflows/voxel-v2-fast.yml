name: Validate isolated Voxel V2
on:
  push:
    branches: [experiment/voxel-v2]
    paths:
      - 'src/Wyrmforge.Presentation.Web/wwwroot/experimental/voxel-v2/**'
      - '.github/workflows/voxel-v2-fast.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voxel-v2-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated V2
        uses: actions/checkout@v4
      - name: Verify no legacy runtime imports or links
        run: node --test src/Wyrmforge.Presentation.Web/wwwroot/experimental/voxel-v2/tests/*.test.mjs
      - name: Verify standalone entry and roadmap
        run: |
          test -s src/Wyrmforge.Presentation.Web/wwwroot/experimental/voxel-v2/index.html
          test -s src/Wyrmforge.Presentation.Web/wwwroot/experimental/voxel-v2/ROADMAP.md
          echo 'Voxel V2 validation passed. No GitHub Pages deployment is performed.'
# Production Pages publication is intentionally disabled here.
# A single Pages owner or an isolated preview host is required before publishing V2.
