name: Hollowed feral sprint v7 source and animated review
on:
  push:
    branches: [feat/actor-lit-sprite-production]
    paths:
      - 'tools/sprite-lab/build-hollow-sprint-v7.py'
      - 'tools/sprite-lab/render-hollow-sprint-v7.py'
      - '.github/workflows/hollow-sprint-v7-review.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original-skeletal-sprint:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Blender 4.5 LTS plus image/pose tooling
        run: python -m pip install 'bpy==4.5.3' 'numpy>=1.26,<3' 'pillow>=10,<13'
      - name: Build independent v7 pursuit from original skinned Hollowed rig
        run: |
          if [ -e art/source/enemies/hollow/rigged-poc/model/local-appearance-004/rigged-sprint-v7-candidate/hollow-rigged.blend ]; then
            echo "Existing editable candidate preserved"
          else
            python tools/sprite-lab/build-hollow-sprint-v7.py
          fi
      - name: Sample actual mesh poses and footprint diagnostics (not sprite image tweens)
        run: |
          source=art/source/enemies/hollow/rigged-poc/model/local-appearance-004/rigged-sprint-v7-candidate
          if [ -f "$source/sampled-walk.npz" ]; then
            echo "Existing source samples preserved"
          else
            python tools/sprite-lab/sample-hollow-rig.py -- "$source"
          fi
      - name: Validate locomotion signature
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('art/source/enemies/hollow/rigged-poc/model/local-appearance-004/rigged-sprint-v7-candidate')
          profile=json.loads((p/'candidate-profile.json').read_text())
          poses=json.loads((p/'gait-diagnostics.json').read_text())
          assert profile['fps']==22 and len(poses)==17
          from math import acos, degrees
          def flex(a,k,b):
            a=[x-y for x,y in zip(a,k)]
            b=[x-y for x,y in zip(b,k)]
            dot=sum(x*y for x,y in zip(a,b))
            norm=(sum(x*x for x in a)*sum(x*x for x in b))**.5
            return 180-degrees(acos(max(-1,min(1,dot/norm))))
          for side in ('L','R'):
            stance=[]
            swing=[]
            arm=[]
            for f in poses[:16]:
              leg=f['feet'][side]
              (stance if leg['stance'] else swing).append(flex(leg['hip'],leg['knee'],leg['ankle']))
              bones=f['arms'][side]
              arm.append(flex(bones['shoulder'],bones['elbow'],bones['wrist']))
            assert max(swing)>=108, (side,'not enough knee recovery',swing)
            assert min(stance)>=15, (side,'locked stance knee',stance)
            assert min(arm)>=22 and max(arm)<=85, (side,'unstable elbows',arm)
            print(side, 'knee stance',min(stance),max(stance),'swing',min(swing),max(swing),'elbow',min(arm),max(arm))
          assert .24<=profile['footSweepModelUnits']<=.27 and profile['recoveryLiftModelUnits']>=.21
          assert abs(profile['expectedRuntimePlaybackFramesPerSecondAtBaseSpeed']-profile['fps'])<1.5
          assert 35 < profile['locomotionDistanceWorldUnitsPerCycle'] < 40
          assert any(x['doubleFlight'] for x in poses[:16])
          assert sum(x['feet']['L']['stance'] for x in poses[:16])<=7
          assert sum(x['feet']['R']['stance'] for x in poses[:16])<=7
          assert (p/'sampled-walk.npz').is_file()
          for f in poses:
            for side in ('L','R'):
              a=f['arms'][side]
              assert a['elbow'][2] <= a['shoulder'][2]-.02
              assert a['wrist'][2] <= a['shoulder'][2]+.005
          print('Source sprint pose diagnostics pass')
          PY
      - name: Render 16-frame native animation and four diagnostic azimuth views
        run: python tools/sprite-lab/render-hollow-sprint-v7.py
      - name: Preserve separate v7 blend, sampled poses and preview evidence in the PR
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/actor-lit-sprite-production'
        run: |
          mkdir -p docs/art/evidence/hollowed-sprint-v7-2026-10-24
          cp artifacts/hollow-sprint-v7-review/feral-sprint-v7.gif docs/art/evidence/hollowed-sprint-v7-2026-10-24/
          cp artifacts/hollow-sprint-v7-review/sprint-v7-16-poses.png docs/art/evidence/hollowed-sprint-v7-2026-10-24/
          cp artifacts/hollow-sprint-v7-review/sprint-v7-four-view-pose-review.png docs/art/evidence/hollowed-sprint-v7-2026-10-24/
          cp artifacts/hollow-sprint-v7-review/anatomy-kinematics-v7.png docs/art/evidence/hollowed-sprint-v7-2026-10-24/
          cp artifacts/hollow-sprint-v7-review/anatomy-kinematics-v7.gif docs/art/evidence/hollowed-sprint-v7-2026-10-24/
          cp artifacts/hollow-sprint-v7-review/sprint-v7-review.json docs/art/evidence/hollowed-sprint-v7-2026-10-24/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/source/enemies/hollow/rigged-poc/model/local-appearance-004/rigged-sprint-v7-candidate/
          git add docs/art/evidence/hollowed-sprint-v7-2026-10-24/
          if ! git diff --cached --quiet; then
            git commit -m "Preserve unapproved feral sprint v7 rig, sampled poses and motion evidence"
            git push origin HEAD:feat/actor-lit-sprite-production
          fi
      - name: Preserve generated asset evidence for inspection
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hollowed-sprint-v7-unapproved-${{ github.sha }}
          path: |
            art/source/enemies/hollow/rigged-poc/model/local-appearance-004/rigged-sprint-v7-candidate/
            artifacts/hollow-sprint-v7-review/
          if-no-files-found: warn
          retention-days: 30
