name: Wizard CC0 human mocap retarget source
on:
  pull_request:
    paths:
      - '.github/workflows/wizard-human-retarget.yml'
      - 'tools/sprite-lab/build_cc0_male_mocap_blender.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-cc0-body-and-captured-walk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Download verified CC0 human model, BVH and Blender
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/human-retarget "$RUNNER_TEMP/human-sources"
          curl --fail --location --retry 3 --retry-delay 3 \
            'https://download.blender.org/demo/asset-bundles/human-base-meshes/human-base-meshes-bundle-v1.4.1.zip' \
            -o "$RUNNER_TEMP/human-bases.zip"
          echo '811f43accbb31a88266d932f8f5563b2d13586fca0ba2693aad1f5fe582b3515  '"$RUNNER_TEMP/human-bases.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/human-bases.zip" -d "$RUNNER_TEMP/human-sources"
          curl --fail --location --retry 3 --retry-delay 3 \
            'https://raw.githubusercontent.com/una-dinosauria/cmu-mocap/09a07f54f3bbb58797325f009282d0b2048a2871/data/007/07_04.bvh' \
            -o "$RUNNER_TEMP/07_04.bvh"
          test "$(git hash-object "$RUNNER_TEMP/07_04.bvh")" = '380e2c7994cfa1d2ac1705f2955bad1a43b805ff'
          base="https://download.blender.org/release/Blender4.5"
          archive="blender-4.5.15-linux-x64.tar.xz"
          curl --fail --location --retry 3 "$base/$archive" -o "$RUNNER_TEMP/$archive"
          curl --fail --location --retry 3 "$base/blender-4.5.15.sha256" -o "$RUNNER_TEMP/checksums.sha256"
          (cd "$RUNNER_TEMP" && grep " $archive$" checksums.sha256 | sha256sum --check)
          tar -xf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/blender-4.5.15-linux-x64" >> "$GITHUB_PATH"
      - name: Animate REAL CC0 male mesh from recorded human walk
        shell: bash
        run: |
          set -euo pipefail
          bundle="$(find "$RUNNER_TEMP/human-sources" -type f -name 'human_base_meshes_bundle.blend' -print -quit)"
          test -f "$bundle"
          blender --background --factory-startup --threads 2 \
            --python tools/sprite-lab/build_cc0_male_mocap_blender.py -- \
            --bundle "$bundle" \
            --bvh "$RUNNER_TEMP/07_04.bvh" \
            --output artifacts/human-retarget
      - name: Produce source-recording GIF and contact sheet
        shell: bash
        run: |
          python3 -m pip install 'Pillow>=10,<14'
          python3 tools/sprite-lab/actor_motion_review.py \
            --source artifacts/human-retarget \
            --output artifacts/human-retarget/review \
            --frames 16 --fps 12
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          ffmpeg -hide_banner -loglevel error -y -framerate 12 \
            -i artifacts/human-retarget/frame-%02d.png -c:v libx264 \
            -pix_fmt yuv420p artifacts/human-retarget/captured-human-anatomy.mp4
          cp art/source/characters/wizard/reference/approved-gothic-wizard.webp \
            artifacts/human-retarget/approved-visual-reference.webp
          cat > artifacts/human-retarget/README.txt <<'DOC'
          This contains a REAL CC0 male Blender mesh driven by the real CMU
          human 07_04 captured walking animation, with source .blend and
          genuine frame renders. It is NOT a completed Gothic wizard nor
          a production atlas, and it does NOT replace the current player.
          The reference image is the approved final look, not implemented here.
          DOC
          cd artifacts/human-retarget
          zip -q -r WyrmForge_Wizard_RealHuman_Retarget_Review.zip \
            cmu-realistic-male-retarget-source.blend \
            native-retarget-validation.json captured-human-anatomy.mp4 \
            review/motion-contact-sheet.png review/motion-loop.gif \
            review/motion-review.json approved-visual-reference.webp README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wizard-real-male-mocap-retarget
          path: artifacts/human-retarget/WyrmForge_Wizard_RealHuman_Retarget_Review.zip
          if-no-files-found: error
          retention-days: 30
