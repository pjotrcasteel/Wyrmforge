name: iPhone-compatible audio audition previews

on:
  push:
    branches:
      - audio/phase1-menu-foley-audition
    paths:
      - .github/workflows/audio-preview-mp3.yml
      - src/Wyrmforge.Presentation.Web/wwwroot/audio/recorded/menu-handleSmallLeather.ogg
      - src/Wyrmforge.Presentation.Web/wwwroot/audio/recorded/menu-metalClick.ogg
      - src/Wyrmforge.Presentation.Web/wwwroot/audio/recorded/menu-bookOpen.ogg
      - src/Wyrmforge.Presentation.Web/wwwroot/audio/recorded/manifest.json
      - src/Wyrmforge.Presentation.Web/wwwroot/audio/recorded/wet-forest-bed.ogg
      - tools/audio/render_elemental_impact_previews.py
      - src/Wyrmforge.Presentation.Web/wwwroot/audio/recorded/ui.ogg
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-audition-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install FFmpeg on the runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Convert the exact recorded candidates to MP3 for iPhone
        shell: bash
        run: |
          set -euo pipefail
          src=src/Wyrmforge.Presentation.Web/wwwroot/audio/recorded
          dest=docs/audio/previews
          mkdir -p "$dest"
          ffmpeg -y -hide_banner -loglevel error -i "$src/menu-handleSmallLeather.ogg" -ar 44100 -c:a libmp3lame -q:a 3 "$dest/worn-vellum.mp3"
          ffmpeg -y -hide_banner -loglevel error -i "$src/ui.ogg" -ar 44100 -c:a libmp3lame -q:a 3 "$dest/weathered-stone.mp3"
          ffmpeg -y -hide_banner -loglevel error -i "$src/menu-metalClick.ogg" -ar 44100 -c:a libmp3lame -q:a 3 "$dest/cold-iron.mp3"
          # Codex demo: physical book opening + delayed, quieter leather body.
          ffmpeg -y -hide_banner -loglevel error -i "$src/menu-bookOpen.ogg" -i "$src/menu-handleSmallLeather.ogg" \
            -filter_complex "[0:a]volume=0.38,lowpass=f=3450[book];[1:a]volume=0.093,lowpass=f=2700,adelay=120[leather];[book][leather]amix=inputs=2:duration=longest:normalize=0,alimiter=limit=0.95[out]" \
            -map "[out]" -ar 44100 -c:a libmp3lame -q:a 3 "$dest/codex-open.mp3"
          # Single tap-friendly playthrough: Worn Vellum, then the layered Codex opening twice.
          # Silence is encoded into one standard MP3, so opening it does not require a ZIP download.
          ffmpeg -y -hide_banner -loglevel error -i "$dest/worn-vellum.mp3" -i "$dest/codex-open.mp3" \
            -filter_complex "[0:a]adelay=350:all=1[vellum];[1:a]asplit=2[x][y];[x]adelay=1600:all=1[codex1];[y]adelay=2700:all=1[codex2];[vellum][codex1][codex2]amix=inputs=3:duration=longest:normalize=0,alimiter=limit=0.95[out]" \
            -map "[out]" -ar 44100 -c:a libmp3lame -q:a 3 "$dest/worn-vellum-and-codex-demo.mp3"
          # Context demo only: forest bed + original game Foley, Fireball and an enemy death.
          # This does not bake combat into the actual ambience loop.
          if test -f "$src/wet-forest-bed.ogg"; then
            ffmpeg -y -hide_banner -loglevel error \
              -i "$src/wet-forest-bed.ogg" -i "$src/hunt-start.ogg" \
              -i "$src/fire.ogg" -i "$src/impact.ogg" -i "$src/enemy-down.ogg" -i "$src/music-cave.ogg" \
              -filter_complex "[0:a]atrim=0:24,volume=0.82[forest];[1:a]volume=0.32,adelay=2100:all=1[departure];[2:a]volume=0.33,adelay=13500:all=1[fire];[3:a]volume=0.25,adelay=13900:all=1[impact];[4:a]volume=0.28,adelay=14700:all=1[enemy];[5:a]atrim=0:24,volume=0.15[music];[forest][departure][fire][impact][enemy][music]amix=inputs=6:duration=first:normalize=0,alimiter=limit=0.92,afade=t=out:st=22:d=2[out]" \
              -map "[out]" -ar 44100 -c:a libmp3lame -q:a 3 "$dest/wet-forest-hunt-demo.mp3"
          fi
          for preview in "$dest"/*.mp3; do
            ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 "$preview"
          done
      - name: Render school-correct cast and impact auditions
        run: python3 tools/audio/render_elemental_impact_previews.py
      - name: Publish audio reviews as MP3 in this draft branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audio/previews/*.mp3
          git add docs/audio/previews/four-school-impact-review.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(audio): add iPhone-compatible MP3 audition previews"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Also bundle the previews for local listening
        uses: actions/upload-artifact@v4
        with:
          name: wyrmforge-audition-mp3
          path: docs/audio/previews/*.mp3
          if-no-files-found: error
