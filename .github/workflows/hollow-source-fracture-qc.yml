name: Hollowed source-mesh fracture (owner-approved source release)
on:
  push:
    branches: [main, art/hollowed-source-mesh-fracture-proof]
    paths:
      - 'tools/sprite-lab/render-hollow-source-fracture.py'
      - 'tools/sprite-lab/publish-approved-hollow-fracture.py'
      - '.github/workflows/hollow-source-fracture-qc.yml'
      - 'tests/python/hollow_source_fracture_contract.py'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

# Render only when source/release logic changes, never on each gameplay commit.
concurrency:
  group: hollow-source-fracture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-mesh-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Recover the actual editable Hollowed 3D character
        run: |
          git lfs pull --include="art/source/enemies/hollow/rigged-poc/model/local-appearance-004/rigged-hollow-death-no-cape-standard/hollow-death.blend" --exclude=""
          test "$(stat -c%s art/source/enemies/hollow/rigged-poc/model/local-appearance-004/rigged-hollow-death-no-cape-standard/hollow-death.blend)" -gt 100000
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source fracture atlas gating, impact glow and live fallback
        run: |
          node --check src/Wyrmforge.Presentation.Web/wwwroot/js/hollow-fracture.js
          node --check src/Wyrmforge.Presentation.Web/wwwroot/js/hollow-sprites.js
          node --check src/Wyrmforge.Presentation.Web/wwwroot/js/arena.js
          node --test tests/javascript/hollow-fracture.test.mjs
      - name: Verify proof-only pipeline contract before render
        run: |
          python -m py_compile tools/sprite-lab/render-hollow-source-fracture.py
          python tests/python/hollow_source_fracture_contract.py
      - name: Install Blender 4.5 LTS for real source geometry
        run: |
          python -m pip install --disable-pip-version-check bpy==4.5.15 Pillow==11.3.0
          python -c "import bpy; print('Blender source renderer:', bpy.app.version_string)"
      - name: First render actual South-facing Hollowed corpse explosion
        env:
          OMP_NUM_THREADS: 4
        run: python tools/sprite-lab/render-hollow-source-fracture.py --directions S
      - name: Publish early South-facing owner QC
        uses: actions/upload-artifact@v4
        with:
          name: hollowed-corpse-explosion-south-review
          path: |
            artifacts/hollow-source-fracture/fracture-S-contact-sheet.png
            artifacts/hollow-source-fracture/fracture-S.gif
            artifacts/hollow-source-fracture/geometry-diagnostics.json
            artifacts/hollow-source-fracture/manifest.json
          retention-days: 14
          if-no-files-found: error
      - name: Render all eight authentic 3D view directions after South proof
        env:
          OMP_NUM_THREADS: 4
        run: python tools/sprite-lab/render-hollow-source-fracture.py --directions all
      - name: Publish approved original-source atlases into the playable Hunt
        if: github.ref == 'refs/heads/main'
        run: python tools/sprite-lab/publish-approved-hollow-fracture.py
      - name: Save source and review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hollow-source-mesh-fracture-original-geometry-review
          path: |
            artifacts/hollow-source-fracture/geometry-diagnostics.json
            artifacts/hollow-source-fracture/manifest.json
            artifacts/hollow-source-fracture/fracture-*.png
            artifacts/hollow-source-fracture/fracture-*.gif
            artifacts/hollow-source-fracture/hollow-source-fracture-UNAPPROVED.blend
          retention-days: 14
          if-no-files-found: warn

      - name: Archive approved runtime sprites for direct inspection
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: hollow-source-mesh-fracture-approved-runtime-atlases
          path: src/Wyrmforge.Presentation.Web/wwwroot/art/enemies/hollow-rigged/death/fracture/
          retention-days: 30
          if-no-files-found: error
      - name: Commit real Blender atlases into production after all gates
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/Wyrmforge.Presentation.Web/wwwroot/art/enemies/hollow-rigged/death/fracture/
          if git diff --cached --quiet; then
            echo "Source fracture art already released; nothing to publish."
            exit 0
          fi
          git commit -m "art(hollowed): release owner-approved eight-way source-mesh fracture atlases [skip ci]"
          # GITHUB_TOKEN pushes do not trigger normal push workflows, even if
          # [skip ci] is removed. Explicit workflow_dispatch DOES trigger Pages.
          if git push origin HEAD:refs/heads/main; then
            gh workflow run pages.yml --ref main
            echo "Requested Pages deployment of committed, approved fracture assets."
          else
            echo "Main is protected: preserve the approved runtime art on an automatic pull request."
            branch="art/approved-hollowed-fracture-atlases"
            git push --force-with-lease origin HEAD:refs/heads/"$branch"
            gh pr create --base main --head "$branch" --title "art(hollowed): publish approved source-mesh fracture sprites" \
              --body "All eight original Blender 3D fracture atlases passed the source-geometry, alpha, 24-frame, SHA-256, silhouette and release-contract checks. Owner approved the art direction 2026-10-26. This adds the actual game-ready PNGs and approved manifest; the runtime already supports them." || true
          fi
