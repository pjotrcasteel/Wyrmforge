name: Sprite Foundry standalone checks

on:
  pull_request:
    paths:
      - 'tools/sprite-foundry/**'
      - '.github/workflows/sprite-foundry.yml'
  push:
    branches:
      - main
    paths:
      - 'tools/sprite-foundry/**'
      - '.github/workflows/sprite-foundry.yml'
  workflow_dispatch:

jobs:
  foundry-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free image dependency
        run: python -m pip install -r tools/sprite-foundry/requirements.txt
      - name: Compile and test isolated exporter
        run: |
          python -m py_compile tools/sprite-foundry/foundry.py
          python -m unittest discover -s tools/sprite-foundry/tests -v
      - name: Render shared-master mechanical blockout (not approved art)
        run: python tools/sprite-foundry/experiments/shared-wizard-master-v001/master.py --preview tools/sprite-foundry/output/shared-master-blockout.png
      - name: Render shared-mesh damage and front-decal comparison (not approved art)
        run: python tools/sprite-foundry/experiments/shared-wizard-master-v001/master.py --reference-sprite tools/sprite-foundry/candidates/grey-wizard-idle-v001/source/idle/S/00.albedo.png --comparison tools/sprite-foundry/output/shared-master-front-decal.png
      - name: Render 8x S/SE/E garment close-up (not approved art)
        run: python tools/sprite-foundry/experiments/shared-wizard-master-v001/master.py --reference-sprite tools/sprite-foundry/candidates/grey-wizard-idle-v001/source/idle/S/00.albedo.png --preview tools/sprite-foundry/output/garment-damage-closeup.png
      - name: Upload unapproved single-mesh studies
        uses: actions/upload-artifact@v4
        with:
          name: shared-wizard-master-studies-NOT-APPROVED
          path: |
            tools/sprite-foundry/output/shared-master-blockout.png
            tools/sprite-foundry/output/shared-master-front-decal.png
            tools/sprite-foundry/output/garment-damage-closeup.png
          if-no-files-found: error
