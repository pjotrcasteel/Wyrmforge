name: Hollowed isolated visual source gate

on:
  push:
    branches:
      - art/hollowed-new-model-20261028
    paths:
      - 'art/source/enemies/hollow/rebuild-v1/**'
      - 'tools/art/hollow-rebuild/**'
      - 'docs/art/evidence/hollow-rebuild-v1/**'
      - '.github/workflows/hollow-rebuild-art.yml'
  pull_request:
    paths:
      - 'art/source/enemies/hollow/rebuild-v1/**'
      - 'tools/art/hollow-rebuild/**'
      - 'docs/art/evidence/hollow-rebuild-v1/**'
      - '.github/workflows/hollow-rebuild-art.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: hollowed-rebuild-scope-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github/workflows/hollow-rebuild-art.yml
            art/source/enemies/hollow/rebuild-v1/
            tools/art/hollow-rebuild/
            docs/art/evidence/hollow-rebuild-v1/
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify entire PR file list — no animation/gameplay/runtime edits
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/art/hollow-rebuild/check-scope.py --pr 391
      - name: Verify source-guard syntax
        run: |
          python -m py_compile tools/art/hollow-rebuild/check-scope.py
          python -m py_compile tools/art/hollow-rebuild/qc_h1_geometry.py
          python -m py_compile tools/art/hollow-rebuild/evaluate_free_character_blender.py
      - name: Verify new source-only anatomical sculpt constraints
        run: python tools/art/hollow-rebuild/test_feral_source_shape.py

# This workflow does not touch, test, import, trigger or modify the shared
# universal animation engine. It does not build or deploy the game.

  torn-ribcage-source-v6:
    name: Hollowed H1 v6 — connected necrotic ribcage geometry (UNAPPROVED)
    needs: source-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            art/source/enemies/hollow/rebuild-v1/
            tools/art/hollow-rebuild/
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install isolated Blender art-source dependencies
        run: |
          python -m pip install --disable-pip-version-check bpy==4.5.15 Pillow==11.3.0
          python -c "import bpy; print('Genuine Blender:', bpy.app.version_string)"
      - name: Compile both source-sculpt scripts
        run: |
          python -m py_compile tools/art/hollow-rebuild/sculpt_cc0_anatomy_blender.py \
            tools/art/hollow-rebuild/sculpt_feral_anatomy_v2_blender.py \
            tools/art/hollow-rebuild/sculpt_human_undead_v4_blender.py \
            tools/art/hollow-rebuild/sculpt_cutaway_ribs_v5_blender.py \
            tools/art/hollow-rebuild/sculpt_torn_ribcage_v6_blender.py
      - name: Sculpt original asymmetric torso/shoulder rest shape and render eight viewpoints
        run: |
          python tools/art/hollow-rebuild/sculpt_torn_ribcage_v6_blender.py \
            --input art/source/enemies/hollow/rebuild-v1/references/makehuman-core-base-CC0.obj \
            --output artifacts/hollow-rebuild/torn-ribcage-v6
          test -s artifacts/hollow-rebuild/torn-ribcage-v6/hollowed-torn-ribcage-v6-UNAPPROVED.blend
          test -s artifacts/hollow-rebuild/torn-ribcage-v6/cc0-source-8views-BLENDER.png
          test -s artifacts/hollow-rebuild/torn-ribcage-v6/cc0-source-native96-BLENDER.png
          python - <<'PY'
          import json
          from pathlib import Path
          qc = json.loads(Path("artifacts/hollow-rebuild/torn-ribcage-v6/source-qc.json").read_text())
          assert qc["mesh_vertices"] == 13380, qc
          assert qc["rendered_helpers"] is False, qc
          assert qc["excluded_authoring_helper_vertices"] == 5778, qc
          assert qc["body_only"] is True, qc
          assert qc["human_body_only"] is True, qc
          assert qc["rendered_helpers"] is False, qc
          assert qc["embedded_rib_curves"] == 6, qc
          assert qc["sculpted_wound_vertices"] >= 100, qc
          assert qc["deep_torn_tissue_vertices"] >= 35, qc
          assert qc["wound_cavity_polygon_faces"] >= 25, qc
          assert qc["new_animation_actions"] == 0, qc
          assert qc["new_animation_actions"] == 0, qc
          assert qc["rear_wound_faces"] == 0, qc
          print("PASS: original human body only, no skirt/tights/hair authoring helpers")
          PY
      - name: Reopen immutable H1 source in an independent Blender process
        run: |
          python -c "import bpy; bpy.ops.wm.open_mainfile(filepath='artifacts/hollow-rebuild/torn-ribcage-v6/hollowed-torn-ribcage-v6-UNAPPROVED.blend'); assert len([o for o in bpy.data.objects if o.type == 'MESH']) > 0; print('H1 source reopened, NOT ART APPROVED')"
      - name: Preserve genuine Blender source and previews without runtime integration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hollowed-h1-v6-TORN-RIBCAGE-Blender-UNAPPROVED
          path: artifacts/hollow-rebuild/torn-ribcage-v6/
          if-no-files-found: warn
          retention-days: 30

  open-cc0-zombie-import:
    name: Independently licensed CC0 zombie — import and 8-angle Blender source screening
    needs: source-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            tools/art/hollow-rebuild/
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install genuine Blender and 7-Zip import library
        run: |
          python -m pip install --disable-pip-version-check bpy==4.5.15 Pillow==11.3.0 py7zr==1.0.0
          python -c "import bpy; print('Blender:', bpy.app.version_string)"
      - name: Download CC0 original from author-hosted OpenGameArt entry — never run external scripts
        run: |
          set -euo pipefail
          mkdir -p artifacts/hollow-rebuild/oga-cc0-original
          curl --fail --location --retry 3 --max-time 100 --silent --show-error \
            --user-agent "WyrmForge-Hollowed-Source-Research/1.0" \
            'https://opengameart.org/sites/default/files/Male%20City%20Zombie.7z' \
            -o artifacts/hollow-rebuild/oga-cc0-original/source.7z
          test "$(stat -c%s artifacts/hollow-rebuild/oga-cc0-original/source.7z)" -gt 200000
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import py7zr
          root = Path('artifacts/hollow-rebuild/oga-cc0-original')
          archive = root / 'source.7z'
          with py7zr.SevenZipFile(archive) as zipfile:
              filenames = zipfile.getnames()
              if len(filenames) > 150 or any('..' in Path(name).parts or name.startswith('/') for name in filenames):
                  raise ValueError('Unsafe or excessively large archive')
              print('SOURCE ARCHIVE CONTENTS:')
              print('\n'.join(filenames))
              zipfile.extractall(path=root / 'extracted')
          candidates = [p for p in (root/'extracted').rglob('*') if p.is_file() and p.suffix.lower() in ('.blend','.glb','.gltf','.fbx','.obj')]
          if not candidates:
              raise ValueError('No Blender/GLB/FBX/OBJ source model in lawful CC0 archive')
          preference = {'.blend':0, '.glb':1, '.gltf':2, '.fbx':3, '.obj':4}
          candidates.sort(key=lambda p:(preference[p.suffix.lower()], len(p.parts),len(p.name)))
          model = candidates[0].resolve()
          (root/'model-path.txt').write_text(str(model),encoding='utf-8')
          (root/'source-LICENSE.txt').write_text(
              'CC0 1.0 Universal — Rikindle3D (2020)\n'
              'https://opengameart.org/content/male-city-zombie-ready-for-use-in-game-engines\n'
              'https://creativecommons.org/publicdomain/zero/1.0/\n'
              'Original source checksum: SHA256 '+hashlib.sha256(archive.read_bytes()).hexdigest()+'\n',
              encoding='utf-8')
          (root/'source-list.json').write_text(json.dumps({'chosen':model.name,'names':filenames},indent=2)+'\n')
          print('CHOSEN SOURCE:',model.name,'SHA256:',hashlib.sha256(model.read_bytes()).hexdigest())
          PY
      - name: Evaluate original zombie geometry with eight real neutral Blender views — NO animations
        run: |
          source_path="$(cat artifacts/hollow-rebuild/oga-cc0-original/model-path.txt)"
          python tools/art/hollow-rebuild/evaluate_free_character_blender.py \
            --input "$source_path" \
            --license-file artifacts/hollow-rebuild/oga-cc0-original/source-LICENSE.txt \
            --license CC0-1.0 \
            --source-url 'https://opengameart.org/content/male-city-zombie-ready-for-use-in-game-engines' \
            --author Rikindle3D \
            --output artifacts/hollow-rebuild/oga-cc0-source-review
          test -s artifacts/hollow-rebuild/oga-cc0-source-review/source-clay-8views-BLENDER.png
          test -s artifacts/hollow-rebuild/oga-cc0-source-review/source-clay-native96-BLENDER.png
          test -s artifacts/hollow-rebuild/oga-cc0-source-review/imported-hollowed-source-UNAPPROVED.blend
      - name: Preserve source attribution and authentic Blender multi-angle screening
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hollowed-h1-OGA-CC0-zombie-initial-source-screening-UNAPPROVED
          path: |
            artifacts/hollow-rebuild/oga-cc0-original/source-LICENSE.txt
            artifacts/hollow-rebuild/oga-cc0-original/source-list.json
            artifacts/hollow-rebuild/oga-cc0-source-review/
          if-no-files-found: warn
          retention-days: 30
