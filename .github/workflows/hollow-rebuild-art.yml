name: Hollowed isolated visual source gate

on:
  push:
    branches:
      - art/hollowed-new-model-20261028
    paths:
      - 'art/source/enemies/hollow/rebuild-v1/**'
      - 'tools/art/hollow-rebuild/**'
      - 'docs/art/evidence/hollow-rebuild-v1/**'
      - '.github/workflows/hollow-rebuild-art.yml'
  pull_request:
    paths:
      - 'art/source/enemies/hollow/rebuild-v1/**'
      - 'tools/art/hollow-rebuild/**'
      - 'docs/art/evidence/hollow-rebuild-v1/**'
      - '.github/workflows/hollow-rebuild-art.yml'

permissions:
  contents: read

concurrency:
  group: hollowed-rebuild-scope-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify source isolation — no animation/gameplay/runtime edits
        run: python tools/art/hollow-rebuild/check-scope.py
      - name: Verify source-guard syntax
        run: |
          python -m py_compile tools/art/hollow-rebuild/check-scope.py
          python -m py_compile tools/art/hollow-rebuild/qc_h1_geometry.py
          python -m py_compile tools/art/hollow-rebuild/evaluate_free_character_blender.py
      - name: Verify new source-only anatomical sculpt constraints
        run: python tools/art/hollow-rebuild/test_feral_source_shape.py

# This workflow does not touch, test, import, trigger or modify the shared
# universal animation engine. It does not build or deploy the game.

  blender-source-proof:
    name: Original 3D source — real Blender 4.5 clay review (NOT approved art)
    needs: source-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install isolated Blender 4.5 LTS and source-only art dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            bpy==4.5.15 Pillow==11.3.0 trimesh==4.11.1 \
            numpy scipy scikit-image
          python -c "import bpy; print('Real Blender:', bpy.app.version_string)"
      - name: Generate independent original 3D anatomical source
        run: |
          python -m py_compile tools/art/hollow-rebuild/create_anatomical_v3.py tools/art/hollow-rebuild/render_source_blender.py
          python tools/art/hollow-rebuild/create_anatomical_v3.py \
            --output artifacts/hollow-rebuild/h1-anatomical-v3
          test -s artifacts/hollow-rebuild/h1-anatomical-v3/hollowed-anatomical-v3.glb
      - name: Import editable new Hollowed and render genuine Blender viewpoints
        run: |
          python tools/art/hollow-rebuild/render_source_blender.py \
            --input artifacts/hollow-rebuild/h1-anatomical-v3/hollowed-anatomical-v3.glb \
            --output artifacts/hollow-rebuild/h1-anatomical-v3/blender
          test -s artifacts/hollow-rebuild/h1-anatomical-v3/blender/hollowed-source-h1.blend
          test -s artifacts/hollow-rebuild/h1-anatomical-v3/blender/clay-4views-BLENDER.png
          test -s artifacts/hollow-rebuild/h1-anatomical-v3/blender/silhouette-native96-BLENDER.png
      - name: Preserve source, Blender file, real renders and metrics — NOT production
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hollowed-h1-original-3d-source-blender-review-UNAPPROVED
          path: artifacts/hollow-rebuild/h1-anatomical-v3/
          if-no-files-found: warn
          retention-days: 30

  cc0-sculpt-proof:
    name: CC0 anatomical topology — static Blender source proof (UNAPPROVED)
    needs: source-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install isolated real Blender and source-only image dependency
        run: |
          python -m pip install --disable-pip-version-check bpy==4.5.15 Pillow==11.3.0
          python -c "import bpy; print('Source-only Blender:', bpy.app.version_string)"
      - name: Compile authoring code and verify CC0 source
        run: |
          python -m py_compile tools/art/hollow-rebuild/sculpt_cc0_anatomy_blender.py
          grep -F 'explicitly released as CC0' art/source/enemies/hollow/rebuild-v1/references/makehuman-core-base-CC0.obj
          test "$(wc -c < art/source/enemies/hollow/rebuild-v1/references/makehuman-core-base-CC0.obj)" -gt 1000000
      - name: Author editable source and eight real Blender views (no animation)
        run: |
          python tools/art/hollow-rebuild/sculpt_cc0_anatomy_blender.py \
            --input art/source/enemies/hollow/rebuild-v1/references/makehuman-core-base-CC0.obj \
            --output artifacts/hollow-rebuild/cc0-sculpt-anatomy
          test -s artifacts/hollow-rebuild/cc0-sculpt-anatomy/hollowed-cc0-anatomy-blockout.blend
          test -s artifacts/hollow-rebuild/cc0-sculpt-anatomy/cc0-source-8views-BLENDER.png
          test -s artifacts/hollow-rebuild/cc0-sculpt-anatomy/cc0-source-native96-BLENDER.png
      - name: Preserve original anatomical source, QC and render artifacts — NOT production
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hollowed-h1-cc0-anatomy-BLENDER-review-UNAPPROVED
          path: artifacts/hollow-rebuild/cc0-sculpt-anatomy/
          if-no-files-found: warn
          retention-days: 30

  feral-anatomy-study-v2:
    name: Original Hollowed feral anatomy — Blender 3D clay views (UNAPPROVED)
    needs: source-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install isolated Blender art-source dependencies
        run: |
          python -m pip install --disable-pip-version-check bpy==4.5.15 Pillow==11.3.0
          python -c "import bpy; print('Genuine Blender:', bpy.app.version_string)"
      - name: Compile both source-sculpt scripts
        run: |
          python -m py_compile tools/art/hollow-rebuild/sculpt_cc0_anatomy_blender.py \
            tools/art/hollow-rebuild/sculpt_feral_anatomy_v2_blender.py
      - name: Sculpt original asymmetric torso/shoulder rest shape and render eight viewpoints
        run: |
          python tools/art/hollow-rebuild/sculpt_feral_anatomy_v2_blender.py \
            --input art/source/enemies/hollow/rebuild-v1/references/makehuman-core-base-CC0.obj \
            --output artifacts/hollow-rebuild/feral-anatomy-v2
          test -s artifacts/hollow-rebuild/feral-anatomy-v2/hollowed-feral-source-v2-UNAPPROVED.blend
          test -s artifacts/hollow-rebuild/feral-anatomy-v2/cc0-source-8views-BLENDER.png
          test -s artifacts/hollow-rebuild/feral-anatomy-v2/cc0-source-native96-BLENDER.png
      - name: Reopen immutable H1 source in an independent Blender process
        run: |
          python -c "import bpy; bpy.ops.wm.open_mainfile(filepath='artifacts/hollow-rebuild/feral-anatomy-v2/hollowed-feral-source-v2-UNAPPROVED.blend'); assert len([o for o in bpy.data.objects if o.type == 'MESH']) > 0; print('H1 source reopened, NOT ART APPROVED')"
      - name: Preserve genuine Blender source and previews without runtime integration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hollowed-h1-feral-anatomy-v2-BLENDER-UNAPPROVED
          path: artifacts/hollow-rebuild/feral-anatomy-v2/
          if-no-files-found: warn
          retention-days: 30

  cc0-open-asset-comparison:
    name: Free CC0 infected source — real Blender review (UNAPPROVED)
    needs: source-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        candidate:
          - label: ash-burnt-husk
            source_url: https://cdn.3dassets.dev/assets/12006/v1/model.glb
            page_url: https://3dassets.dev/assets/undead-horde-and-infected-variants-ash-burnt-husk-infe-6ddf10d4
          - label: asymmetric-brute
            source_url: https://cdn.3dassets.dev/assets/12007/v1/model.glb
            page_url: https://3dassets.dev/assets/undead-horde-and-infected-variants-brute-boss-infected-c135f27a
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install real Blender 4.5 LTS for static source-model evaluation
        run: |
          python -m pip install --disable-pip-version-check bpy==4.5.15 Pillow==11.3.0
          python -c "import bpy; print('Source-only Blender:', bpy.app.version_string)"
      - name: Fetch only confirmed CC0 reference source, not game art
        env:
          SOURCE_URL: ${{ matrix.candidate.source_url }}
          PAGE_URL: ${{ matrix.candidate.page_url }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/hollow-rebuild/free-source-input
          curl --fail --location --silent --show-error --retry 3 --max-time 120 \
            "$SOURCE_URL" -o artifacts/hollow-rebuild/free-source-input/source.glb
          test "$(stat -c%s artifacts/hollow-rebuild/free-source-input/source.glb)" -gt 100000
          printf 'CC0 1.0 Universal\nSource: %s\nLicense: https://creativecommons.org/publicdomain/zero/1.0/\n' \
            "$PAGE_URL" > artifacts/hollow-rebuild/free-source-input/source-LICENSE.txt
      - name: Import editable CC0 geometry, strip external actions and render 8 actual Blender viewpoints
        env:
          PAGE_URL: ${{ matrix.candidate.page_url }}
          CANDIDATE: ${{ matrix.candidate.label }}
        run: |
          python tools/art/hollow-rebuild/evaluate_free_character_blender.py \
            --input artifacts/hollow-rebuild/free-source-input/source.glb \
            --license-file artifacts/hollow-rebuild/free-source-input/source-LICENSE.txt \
            --license CC0-1.0 --author '3DAssets.dev' --source-url "$PAGE_URL" \
            --output "artifacts/hollow-rebuild/cc0-candidate-$CANDIDATE"
          test -s "artifacts/hollow-rebuild/cc0-candidate-$CANDIDATE/source-clay-native96-BLENDER.png"
          test -s "artifacts/hollow-rebuild/cc0-candidate-$CANDIDATE/source-material-8views-BLENDER.png"
          test -s "artifacts/hollow-rebuild/cc0-candidate-$CANDIDATE/imported-hollowed-source-UNAPPROVED.blend"
      - name: Reopen copied source in an independent Blender process, reject hidden actions
        env:
          CANDIDATE: ${{ matrix.candidate.label }}
        run: |
          python - <<'PY'
          import os
          import bpy
          filename = 'artifacts/hollow-rebuild/cc0-candidate-' + os.environ['CANDIDATE'] + '/imported-hollowed-source-UNAPPROVED.blend'
          bpy.ops.wm.open_mainfile(filepath=filename)
          assert len(bpy.data.actions) == 0, 'Imported external animation actions!'
          assert sum(o.type == 'MESH' for o in bpy.data.objects) >= 1
          print('Source .blend reopened. STATIC SOURCE ONLY, NOT OWNER APPROVED.')
          PY
      - name: Save genuine 3D renders, legal provenance and editable source, not production art
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hollowed-cc0-alternative-${{ matrix.candidate.label }}-UNAPPROVED
          path: |
            artifacts/hollow-rebuild/cc0-candidate-${{ matrix.candidate.label }}/
            artifacts/hollow-rebuild/free-source-input/source-LICENSE.txt
          if-no-files-found: warn
          retention-days: 30
