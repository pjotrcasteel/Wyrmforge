name: Town T1/T2 3D geometry exports

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/town/**'
      - 'tools/development/test_town_t1_mesh.py'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/art/town/geometry/**'
      - '.github/workflows/town-geometry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blender-export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false

      - name: Validate the authored OBJ and MTL without external dependencies
        run: python3 -m unittest tools.development.test_town_t1_mesh

      - name: Install headless Blender from Ubuntu packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
          blender --version
          blender --background --factory-startup --python-expr 'import numpy; print(numpy.__version__)'

      - name: Export editable T1 and T2 Blender scenes, glTF and review PNGs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/town-t1-t2
          for variant in t1 t2; do
            echo "Exporting ${variant}..."
            TOWN_GEOMETRY_VARIANT="${variant}" blender --background --factory-startup \
              --python tools/town/t1_import_export_blender.py \
              2>&1 | tee "artifacts/town-t1-t2/${variant}-blender.log"
          done
          for prefix in t1-central-square-preview t2-central-square-gothic; do
            for ext in blend glb png; do
              test -s "src/Wyrmforge.Presentation.Web/wwwroot/art/town/geometry/${prefix}.${ext}"
            done
          done

      - name: Verify GLB header and file length
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path
          root = Path("src/Wyrmforge.Presentation.Web/wwwroot/art/town/geometry")
          for prefix in ["t1-central-square-preview", "t2-central-square-gothic"]:
              path = root / f"{prefix}.glb"
              data = path.read_bytes()
              magic, version, total = struct.unpack_from("<4sII", data)
              assert magic == b"glTF" and version == 2 and total == len(data)
              print(f"Validated {prefix} glTF 2.0 binary: {len(data)} bytes")
          PY

      - name: Upload visual QC and editable Blender geometry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: town-t1-t2-blender-geometry-${{ github.sha }}
          path: |
            artifacts/town-t1-t2
            src/Wyrmforge.Presentation.Web/wwwroot/art/town/geometry/*.blend
            src/Wyrmforge.Presentation.Web/wwwroot/art/town/geometry/*.glb
            src/Wyrmforge.Presentation.Web/wwwroot/art/town/geometry/*.png
          if-no-files-found: warn
          retention-days: 14
