name: Hollowed two authentic legless crawler source candidates

on:
  push:
    branches: [fix/hollowed-animation-polish-20261027]
    paths:
      - 'tools/sprite-lab/author-hollow-legless-crawlers.py'
      - '.github/workflows/hollow-legless-crawler-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-source:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Restore actual no-cape Blender source
        run: |
          git lfs pull --include="art/source/enemies/hollow/rigged-poc/model/local-appearance-004/rigged-hollow-zombie-reach-v3-standard/**" --exclude=""
          test "$(head -c 7 art/source/enemies/hollow/rigged-poc/model/local-appearance-004/rigged-hollow-zombie-reach-v3-standard/hollow-rigged.blend)" = BLENDER
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Blender source authoring and preview dependencies
        run: python -m pip install --disable-pip-version-check bpy==4.5.15 Pillow==11.3.0
      - name: Check authored script
        run: python -m py_compile tools/sprite-lab/author-hollow-legless-crawlers.py
      - name: Author and render real amputated skeletal crawlers
        env:
          OMP_NUM_THREADS: '4'
        run: python tools/sprite-lab/author-hollow-legless-crawlers.py --variant both --directions S
      - name: Save review GIFs, atlas, 3D source and diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hollow-two-real-legless-crawlers-preview
          path: |
            artifacts/hollow-legless-crawlers/*.gif
            artifacts/hollow-legless-crawlers/*.png
            artifacts/hollow-legless-crawlers/*.blend
            artifacts/hollow-legless-crawlers/*.json
            artifacts/hollow-legless-crawlers/README.md
          if-no-files-found: warn
          retention-days: 14
