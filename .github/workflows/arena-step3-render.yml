name: Arena Step 3 · Editable Forest Asset Renders

on:
  pull_request:
    paths:
      - tools/art/step3_wet_forest.py
      - tools/art/verify_step3_wet_forest.py
      - tools/art/step3_ground_review.py
      - art/source/environment/wet-forest/catalog.json
      - .github/workflows/arena-step3-render.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-new-environment-art:
    name: Render original wet-forest Blender source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install pinned standalone Blender (no slow Ubuntu dependency downloads)
        shell: bash
        run: |
          set -euo pipefail
          version=4.3.2
          archive="blender-$version-linux-x64.tar.xz"
          release="https://download.blender.org/release/Blender4.3"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 600 "$release/$archive" --output "$RUNNER_TEMP/$archive"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 "$release/blender-$version.sha256" --output "$RUNNER_TEMP/blender.sha256"
          expected="$(grep -F "$archive" "$RUNNER_TEMP/blender.sha256" | grep -Eo '[0-9a-fA-F]{64}' | head -1)"
          test -n "$expected"
          echo "$expected  $RUNNER_TEMP/$archive" | sha256sum --check -
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/blender-$version-linux-x64" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/blender-$version-linux-x64/blender" --version | head -2
      - name: Render independent original living tree
        run: |
          blender -b -t 4 --python tools/art/step3_wet_forest.py -- \
            --asset ancient_oak --output-dir artifacts/wet-forest/ancient_oak
      - name: Render independent original dead tree
        run: |
          blender -b -t 4 --python tools/art/step3_wet_forest.py -- \
            --asset dead_elm --output-dir artifacts/wet-forest/dead_elm
      - name: Validate saved editable source and exported RGBA candidates
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ('ancient_oak', 'dead_elm'):
              root = Path('artifacts/wet-forest') / name
              blend = root / (name + '.blend')
              png = root / (name + '-candidate.png')
              meta = json.loads((root / 'production.json').read_text())
              assert blend.stat().st_size > 10000
              assert png.read_bytes()[:8] == bytes.fromhex('89504e470d0a1a0a')
              assert meta['id'] == name
              assert meta['approval'] == 'candidate-not-approved'
              assert meta['render']['transparent']
              print(name, 'source bytes', blend.stat().st_size, 'PNG bytes', png.stat().st_size)
          PY
      - name: Inspect real transparent pixels and silhouette framing
        run: python3 tools/art/verify_step3_wet_forest.py artifacts/wet-forest
      - name: Make native-size review frames against existing approved grass and mud
        run: |
          python3 -m pip install --disable-pip-version-check "Pillow==11.3.0"
          python3 tools/art/step3_ground_review.py \
            --renders artifacts/wet-forest \
            --atlas src/Wyrmforge.Presentation.Web/wwwroot/art/environment/wet-forest-materials-painted.webp \
            --out artifacts/wet-forest/mobile-review
      - name: Preserve editable .blend files and review PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-step3-original-wet-forest-candidates
          path: artifacts/wet-forest/
          if-no-files-found: warn
          retention-days: 30
