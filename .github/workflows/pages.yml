name: Deploy Wyrmforge demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable demo
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install stable demo
        run: npm install --no-audit --no-fund

      - name: Test stable demo
        run: npm test

      - name: Build stable demo
        run: npm run build

      - name: Checkout C# migration
        uses: actions/checkout@v6
        with:
          ref: csharp-foundation
          path: csharp-preview-source

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore C# migration
        run: dotnet restore csharp-preview-source/Wyrmforge.slnx

      - name: Build C# migration
        run: dotnet build csharp-preview-source/Wyrmforge.slnx -c Release --no-restore

      - name: Test C# migration
        run: dotnet test csharp-preview-source/Wyrmforge.slnx -c Release --no-build

      - name: Publish C# migration
        run: dotnet publish csharp-preview-source/src/Wyrmforge.Presentation.Web/Wyrmforge.Presentation.Web.csproj -c Release --no-restore -o ./csharp-preview-artifacts

      - name: Add C# preview under stable site
        run: |
          mkdir -p ./dist/csharp-preview
          cp -R ./csharp-preview-artifacts/wwwroot/. ./dist/csharp-preview/
          sed -i 's#<base href="/" />#<base href="/Wyrmforge/csharp-preview/" />#' ./dist/csharp-preview/index.html
          touch ./dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
