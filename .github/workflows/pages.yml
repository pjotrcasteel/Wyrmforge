name: Deploy Wyrmforge demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Wyrmforge.slnx

      - name: Build
        run: dotnet build Wyrmforge.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Wyrmforge.slnx -c Release --no-build

      - name: Publish web
        run: dotnet publish src/Wyrmforge.Presentation.Web/Wyrmforge.Presentation.Web.csproj -c Release --no-restore -o ./artifacts/web -p:SourceRevisionId=${GITHUB_SHA}

      - name: Prepare GitHub Pages
        run: |
          sed -i 's#<base href="/" />#<base href="/Wyrmforge/" />#' ./artifacts/web/wwwroot/index.html
          touch ./artifacts/web/wwwroot/.nojekyll
          test -f ./artifacts/web/wwwroot/_framework/blazor.webassembly.js
          grep -q '<base href="/Wyrmforge/" />' ./artifacts/web/wwwroot/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./artifacts/web/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
