name: Deploy Wyrmforge demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Let an active Pages build finish even if a newer main commit arrives.
  # GitHub still coalesces pending runs, so the latest revision deploys next.
  cancel-in-progress: false

jobs:
  build:
    outputs:
      version: ${{ steps.release_version.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore runtime Git LFS art (exclude large source archives)
        run: |
          git lfs pull --include="src/Wyrmforge.Presentation.Web/wwwroot/**" --exclude=""
          python3 tools/development/verify_web_assets.py

      - name: Regenerate PR340 source-backed material candidates from immutable paintings
        run: |
          python3 -m pip install -r tools/art/painted-requirements.txt
          python3 tools/art/build_grass_moss_art_candidates.py --output src/Wyrmforge.Presentation.Web/wwwroot/art/environment/wet-forest-source-backed/v1/grass-moss-art-candidates
          python3 tools/art/build_wet_mud_art_candidates.py --output src/Wyrmforge.Presentation.Web/wwwroot/art/environment/wet-forest-source-backed/v1/wet-mud-art-candidates
          python3 tools/art/build_trampled_earth_art_candidates.py --output src/Wyrmforge.Presentation.Web/wwwroot/art/environment/wet-forest-source-backed/v1/trampled-earth-art-candidates
          test -s src/Wyrmforge.Presentation.Web/wwwroot/art/environment/wet-forest-source-backed/v1/grass-moss-art-candidates/grass-moss-ART-CANDIDATE-01.png
          test -s src/Wyrmforge.Presentation.Web/wwwroot/art/environment/wet-forest-source-backed/v1/wet-mud-art-candidates/wet-mud-INDEPENDENT-ART-CANDIDATE-01.png
          test -s src/Wyrmforge.Presentation.Web/wwwroot/art/environment/wet-forest-source-backed/v1/trampled-earth-art-candidates/trampled-earth-INDEPENDENT-ART-CANDIDATE-01.png
      - name: Use preinstalled .NET 10 SDK
        run: |
          dotnet --list-sdks
          dotnet --list-sdks | grep -Eq '^10\.0\.' || { echo "::error::Runner does not have the .NET 10 SDK"; exit 1; }
          dotnet --version

      - name: Calculate Pages version (automatic, not a manual bump)
        id: release_version
        run: |
          python3 -m unittest discover -s tools/release -p 'test_*.py'
          python3 tools/release/auto_version.py --run-number "$GITHUB_RUN_NUMBER" --github-output "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Wyrmforge.slnx

      - name: Build
        run: dotnet build Wyrmforge.slnx -c Release --no-restore -p:VersionPrefix="${{ steps.release_version.outputs.version }}" -p:SourceRevisionId="${GITHUB_SHA}"

      # Full solution tests run in the pull-request validation workflow.
      # Keep Pages releases responsive to incremental lab playtesting.
      - name: Check Arena Lab JavaScript
        run: node --test tests/javascript/arena-lab.test.mjs tests/javascript/arena-wet-forest-art.test.mjs tests/javascript/arena-materials.test.mjs

      - name: Publish web
        run: dotnet publish src/Wyrmforge.Presentation.Web/Wyrmforge.Presentation.Web.csproj -c Release --no-restore -o ./artifacts/web -p:VersionPrefix="${{ steps.release_version.outputs.version }}" -p:SourceRevisionId="${GITHUB_SHA}"

      - name: Prepare public collector endpoint
        env:
          WYRMFORGE_FEEDBACK_ENDPOINT: ${{ vars.WYRMFORGE_FEEDBACK_ENDPOINT }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlsplit

          fallback = json.loads(Path("src/Wyrmforge.Presentation.Web/wwwroot/playtest-collector-config.json").read_text(encoding="utf-8")).get("endpoint", "")
          endpoint = os.environ.get("WYRMFORGE_FEEDBACK_ENDPOINT", "").strip() or fallback
          if endpoint:
              url = urlsplit(endpoint)
              if url.scheme != "https" or not url.hostname or url.username or url.password or url.query or url.fragment or url.path != "/v1/reports":
                  raise SystemExit("WYRMFORGE_FEEDBACK_ENDPOINT must be a clean HTTPS /v1/reports URL")
          Path("artifacts/web/wwwroot/playtest-collector-config.json").write_text(json.dumps({"endpoint": endpoint}) + "\n", encoding="utf-8")
          print("Feedback intake configured:", bool(endpoint))
          PY

      - name: Prepare GitHub Pages
        run: |
          sed -i 's#<base href="/" />#<base href="/Wyrmforge/" />#' ./artifacts/web/wwwroot/index.html
          sed -i "s#__WYRMFORGE_BUILD__#${GITHUB_SHA}#g" ./artifacts/web/wwwroot/index.html
          cp ./artifacts/web/wwwroot/index.html ./artifacts/web/wwwroot/404.html
          touch ./artifacts/web/wwwroot/.nojekyll
          test -f ./artifacts/web/wwwroot/404.html
          test -f ./artifacts/web/wwwroot/_framework/blazor.webassembly.js
          grep -q '<base href="/Wyrmforge/" />' ./artifacts/web/wwwroot/index.html
          grep -q "${GITHUB_SHA}" ./artifacts/web/wwwroot/index.html
          ! grep -q '__WYRMFORGE_BUILD__' ./artifacts/web/wwwroot/index.html

      # Experimental G4 build occupies a separate URL subtree. Never replace the
      # production main site with a draft GPU renderer or deploy a floating PR head.
      - name: Checkout pinned G4 mobile review build
        uses: actions/checkout@v6
        with:
          ref: db2e02cce714a5ceab62bcf6d3e046061e53a89f
          path: g4-preview-source

      - name: Restore G4 runtime art
        working-directory: g4-preview-source
        run: |
          git lfs pull --include="src/Wyrmforge.Presentation.Web/wwwroot/**" --exclude=""
          python3 tools/development/verify_web_assets.py

      - name: Regenerate G4 source-backed environment art
        working-directory: g4-preview-source
        run: |
          python3 -m pip install -r tools/art/painted-requirements.txt
          python3 tools/art/build_grass_moss_art_candidates.py --output src/Wyrmforge.Presentation.Web/wwwroot/art/environment/wet-forest-source-backed/v1/grass-moss-art-candidates
          python3 tools/art/build_wet_mud_art_candidates.py --output src/Wyrmforge.Presentation.Web/wwwroot/art/environment/wet-forest-source-backed/v1/wet-mud-art-candidates
          python3 tools/art/build_trampled_earth_art_candidates.py --output src/Wyrmforge.Presentation.Web/wwwroot/art/environment/wet-forest-source-backed/v1/trampled-earth-art-candidates

      - name: Publish experimental G4 game alongside main
        working-directory: g4-preview-source
        run: |
          # This pinned G4 candidate is not the production Pages release.
          set -euo pipefail
          dotnet restore src/Wyrmforge.Presentation.Web/Wyrmforge.Presentation.Web.csproj
          dotnet msbuild src/Wyrmforge.Presentation.Web/Wyrmforge.Presentation.Web.csproj -getProperty:Version -p:VersionSuffix=g4-preview | grep -Fxq '0.0.180-g4-preview'
          dotnet publish src/Wyrmforge.Presentation.Web/Wyrmforge.Presentation.Web.csproj -c Release --no-restore -o "$GITHUB_WORKSPACE/artifacts/g4-preview-web" -p:VersionSuffix=g4-preview -p:SourceRevisionId=db2e02cce714a5ceab62bcf6d3e046061e53a89f
          test -s "$GITHUB_WORKSPACE/artifacts/g4-preview-web/wwwroot/js/lighting/g4-device-review.js"

      - name: Prepare isolated G4 GitHub Pages route
        run: |
          mkdir -p artifacts/web/wwwroot/g4-preview
          cp -a artifacts/g4-preview-web/wwwroot/. artifacts/web/wwwroot/g4-preview/
          sed -i 's#<base href="/" />#<base href="/Wyrmforge/g4-preview/" />#' artifacts/web/wwwroot/g4-preview/index.html
          sed -i 's#__WYRMFORGE_BUILD__#db2e02cce714a5ceab62bcf6d3e046061e53a89f#g' artifacts/web/wwwroot/g4-preview/index.html
          cp artifacts/web/wwwroot/g4-preview/index.html artifacts/web/wwwroot/g4-preview/404.html
          printf 'G4 PREVIEW (not production): v0.0.180-g4-preview; source db2e02cce714a5ceab62bcf6d3e046061e53a89f\n' > artifacts/web/wwwroot/g4-preview/build-id.txt
          grep -q '<base href="/Wyrmforge/g4-preview/" />' artifacts/web/wwwroot/g4-preview/index.html
          grep -q 'db2e02cce714a5ceab62bcf6d3e046061e53a89f' artifacts/web/wwwroot/g4-preview/index.html
          ! grep -q '__WYRMFORGE_BUILD__' artifacts/web/wwwroot/g4-preview/index.html
          test -s artifacts/web/wwwroot/g4-preview/_framework/blazor.webassembly.js
          test -s artifacts/web/wwwroot/g4-preview/js/lighting/g4-device-review.js
          test -s artifacts/web/wwwroot/g4-preview/js/lighting/g4-consent-gate.js
          grep -q 'Share performance results privately' artifacts/web/wwwroot/g4-preview/js/lighting/g4-consent-gate.js
          grep -q 'Keep private on this phone' artifacts/web/wwwroot/g4-preview/js/lighting/g4-consent-gate.js
          grep -q 'g4-consent-gate.js' artifacts/web/wwwroot/g4-preview/index.html
          # Do not alter the main game's root index or default Canvas renderer.
          grep -q '<base href="/Wyrmforge/" />' artifacts/web/wwwroot/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./artifacts/web/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use preinstalled .NET 10 SDK
        run: |
          dotnet --list-sdks
          dotnet --list-sdks | grep -Eq '^10\.0\.' || { echo "::error::Runner does not have the .NET 10 SDK"; exit 1; }
          dotnet --version

      - name: Restore browser tests
        run: dotnet restore tests/Wyrmforge.Browser.Tests/Wyrmforge.Browser.Tests.csproj

      - name: Build browser tests
        run: dotnet build tests/Wyrmforge.Browser.Tests/Wyrmforge.Browser.Tests.csproj -c Release --no-restore

      - name: Install Chromium
        run: pwsh tests/Wyrmforge.Browser.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Smoke deployed Pages app
        env:
          WYRMFORGE_BASE_URL: https://pjotrcasteel.github.io/Wyrmforge/
          WYRMFORGE_BROWSER_ARTIFACTS: ${{ github.workspace }}/artifacts/pages-smoke
          WYRMFORGE_CHECK_DEPLOYED_VERSION: "true"
          WYRMFORGE_EXPECTED_VERSION: ${{ needs.build.outputs.version }}
          WYRMFORGE_EXPECTED_COMMIT: ${{ github.sha }}
        run: dotnet test tests/Wyrmforge.Browser.Tests/Wyrmforge.Browser.Tests.csproj -c Release --no-build --filter "Desktop_HomeAndAtlas_RenderAtWideViewport|Mobile_ArenaLab_GeneratesPhysicalSeededWorldAndAcceptsTestControls|Mobile_ArenaLab_MalformedDeepLink_RecoversInsteadOfShowingBlackScreen|LiveArenaEnvironment_UsesArchivedPr340PixelsAfterDecode_WithoutReplacingGameplay"

      - name: Verify real G4 Pages preview and untouched production entry
        run: |
          python3 - <<'PY'
          import urllib.request
          base = "https://pjotrcasteel.github.io/Wyrmforge/"
          headers = {"User-Agent": "Wyrmforge-G4-Pages-Smoke/1.0"}
          def read(path):
              request = urllib.request.Request(base + path, headers=headers)
              with urllib.request.urlopen(request, timeout=35) as response:
                  assert response.status == 200, path
                  return response.read().decode("utf-8")
          assert "<base href=\"/Wyrmforge/\" />" in read("")
          assert "<base href=\"/Wyrmforge/g4-preview/\" />" in read("g4-preview/")
          assert "db2e02cce714a5ceab62bcf6d3e046061e53a89f" in read("g4-preview/build-id.txt")
          assert "v0.0.180-g4-preview" in read("g4-preview/build-id.txt")
          assert "class G4DeviceReviewSession" in read("g4-preview/js/lighting/g4-device-review.js")
          assert "showG4PreflightChoice" in read("g4-preview/js/lighting/g4-consent-gate.js")
          assert "g4-consent-gate.js" in read("g4-preview/")
          print("Production index and separate pinned G4 phone-preview path are both online.")
          PY

      - name: Checkout pinned G4 real-Hunt browser test
        uses: actions/checkout@v6
        with:
          ref: db2e02cce714a5ceab62bcf6d3e046061e53a89f
          path: g4-browser-tests

      - name: Build G4 browser test
        run: |
          dotnet restore g4-browser-tests/tests/Wyrmforge.Browser.Tests/Wyrmforge.Browser.Tests.csproj
          dotnet build g4-browser-tests/tests/Wyrmforge.Browser.Tests/Wyrmforge.Browser.Tests.csproj -c Release --no-restore

      - name: Browser-test actual deployed G4 Pages phone capture
        env:
          WYRMFORGE_BASE_URL: https://pjotrcasteel.github.io/Wyrmforge/g4-preview/
          WYRMFORGE_BROWSER_ARTIFACTS: ${{ github.workspace }}/artifacts/g4-pages-smoke
        run: >-
          dotnet test g4-browser-tests/tests/Wyrmforge.Browser.Tests/Wyrmforge.Browser.Tests.csproj
          -c Release --no-build
          --filter "Mobile_G4DeviceReview_RecordsRealHuntAndExportsEvidence|Mobile_G4Consent_IsAnObviousSingleChoiceBeforeGameMenus"

      - name: Verify live playtest collector connection
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from urllib.parse import urlsplit

          origin = "https://pjotrcasteel.github.io"
          # Cloudflare rejects Python-urllib's generic agent (1010). Identify
          # this public health/consent probe while retaining every assertion.
          opener = urllib.request.build_opener()
          opener.addheaders = [("User-Agent", "Wyrmforge-Pages-Smoke/1.0 (+https://github.com/pjotrcasteel/Wyrmforge)")]
          urllib.request.install_opener(opener)
          endpoint_expected = "https://wyrmforge-feedback-collector.pjotr-2.workers.dev/v1/reports"
          config = origin + "/Wyrmforge/playtest-collector-config.json?build=" + os.environ["GITHUB_SHA"]

          with urllib.request.urlopen(config, timeout=25) as response:
              endpoint = json.load(response).get("endpoint")
          if endpoint != endpoint_expected:
              raise SystemExit(f"Published collector endpoint mismatch: {endpoint!r}")

          health = endpoint.removesuffix("/v1/reports") + "/health"
          with urllib.request.urlopen(health, timeout=25) as response:
              result = json.load(response)
          if result.get("status") != "ok":
              raise SystemExit("Worker health check failed")

          request = urllib.request.Request(endpoint, method="OPTIONS", headers={
              "Origin": origin,
              "Access-Control-Request-Method": "POST",
              "Access-Control-Request-Headers": "content-type"
          })
          with urllib.request.urlopen(request, timeout=25) as response:
              if response.status != 204 or response.headers.get("Access-Control-Allow-Origin") != origin:
                  raise SystemExit("Worker CORS preflight failed")

          # Verify consent enforcement without storing a report or requiring administrator access.
          request = urllib.request.Request(endpoint, data=b'{"consent":false,"report":{}}', method="POST", headers={
              "Origin": origin, "Content-Type": "application/json"
          })
          try:
              urllib.request.urlopen(request, timeout=25)
              raise SystemExit("Worker accepted a request without consent")
          except urllib.error.HTTPError as error:
              if error.code != 400 or json.load(error).get("error") != "explicit_consent_required":
                  raise

          print("Live configuration, Worker health, CORS and explicit-consent rejection passed; no test feedback stored.")
          PY

      - name: Upload deployed smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wyrmforge-pages-smoke-${{ github.sha }}
          path: |
            artifacts/pages-smoke
            artifacts/g4-pages-smoke
          if-no-files-found: warn
          retention-days: 14
