name: Browser smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/Wyrmforge.Presentation.Web/**'
      - 'src/Wyrmforge.Application/**'
      - 'src/Wyrmforge.Domain/**'
      - 'tests/Wyrmforge.Browser.Tests/**'
      - 'tools/development/browser_shards.py'
      - 'tools/development/test_browser_shards.py'
      - '.github/workflows/browser-smoke.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    name: Playable preview (available before browser tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore runtime art
        run: |
          git lfs pull --include="src/Wyrmforge.Presentation.Web/wwwroot/**" --exclude=""
          python3 tools/development/verify_web_assets.py

      - name: Use preinstalled .NET 10
        run: dotnet --list-sdks | grep -Eq '^10\.0\.' || { echo "::error::Missing .NET 10 SDK"; exit 1; }

      - name: Regenerate required source-backed art
        run: |
          python3 -m pip install -r tools/art/painted-requirements.txt
          python3 tools/art/build_grass_moss_art_candidates.py --output src/Wyrmforge.Presentation.Web/wwwroot/art/environment/wet-forest-source-backed/v1/grass-moss-art-candidates
          python3 tools/art/build_wet_mud_art_candidates.py --output src/Wyrmforge.Presentation.Web/wwwroot/art/environment/wet-forest-source-backed/v1/wet-mud-art-candidates
          python3 tools/art/build_trampled_earth_art_candidates.py --output src/Wyrmforge.Presentation.Web/wwwroot/art/environment/wet-forest-source-backed/v1/trampled-earth-art-candidates

      - name: Publish playable game
        run: |
          dotnet restore src/Wyrmforge.Presentation.Web/Wyrmforge.Presentation.Web.csproj
          dotnet publish src/Wyrmforge.Presentation.Web/Wyrmforge.Presentation.Web.csproj -c Release --no-restore -o ./artifacts/web

      - name: Prepare playable PR preview package
        run: |
          mkdir -p artifacts/playable-preview
          cp -a artifacts/web/wwwroot artifacts/playable-preview/wwwroot
          cp tools/development/spa_server.py artifacts/playable-preview/preview_server.py
          cp docs/playtesting/pr-preview-playbook.md artifacts/playable-preview/README.md
          test -f artifacts/playable-preview/wwwroot/_framework/blazor.webassembly.js
          test -f artifacts/playable-preview/wwwroot/index.html
          grep -q '<base href="/" />' artifacts/playable-preview/wwwroot/index.html

      # Independent of browser verification: artifact appears as soon as publish succeeds.
      - name: Upload playable preview for immediate visual testing
        uses: actions/upload-artifact@v4
        with:
          name: wyrmforge-playable-preview-${{ github.sha }}
          path: artifacts/playable-preview
          if-no-files-found: error
          retention-days: 7

  browser-shard:
    name: Browser shard ${{ matrix.shard }}/4
    needs: preview
    runs-on: ubuntu-latest
    # Chromium installation and browser startup can exceed 10 minutes on cold hosted runners.
    # Keep the full suite required; do not abort a healthy shard halfway through tests.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use preinstalled .NET 10
        run: dotnet --list-sdks | grep -Eq '^10\.0\.' || { echo "::error::Missing .NET 10 SDK"; exit 1; }

      - name: Validate browser test shard coverage
        run: python3 -m unittest discover -s tools/development -p 'test_*.py'

      - name: Restore and build browser tests
        run: |
          dotnet restore tests/Wyrmforge.Browser.Tests/Wyrmforge.Browser.Tests.csproj
          dotnet build tests/Wyrmforge.Browser.Tests/Wyrmforge.Browser.Tests.csproj -c Release --no-restore

      - name: Install Chromium
        run: pwsh tests/Wyrmforge.Browser.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Download matching playable build
        uses: actions/download-artifact@v4
        with:
          name: wyrmforge-playable-preview-${{ github.sha }}
          path: artifacts/playable-preview

      - name: Start local WyrmForge
        run: |
          python3 tools/development/spa_server.py --port 4173 --directory ./artifacts/playable-preview/wwwroot > ./artifacts/browser-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat ./artifacts/browser-server.log
          exit 1

      - name: Select this shard's test methods
        id: selection
        run: python3 tools/development/browser_shards.py --shard ${{ matrix.shard }} --shards 4 --output "$GITHUB_OUTPUT"

      - name: Run browser regression shard
        env:
          WYRMFORGE_BASE_URL: http://127.0.0.1:4173/
          WYRMFORGE_BROWSER_ARTIFACTS: ${{ github.workspace }}/artifacts/browser/shard-${{ matrix.shard }}
        run: >
          dotnet test tests/Wyrmforge.Browser.Tests/Wyrmforge.Browser.Tests.csproj
          -c Release --no-build --filter "${{ steps.selection.outputs.filter }}"
          --logger "console;verbosity=normal"
          --blame-hang-timeout 7m --blame-hang-dump-type none

      # AR4 owner gate: real PNGs from this Playwright session, readable individually
      # even on mobile without downloading an artifact ZIP. PR-only diagnostic output.
      - name: Expose AR4 in-Hunt review images for owner inspection
        if: ${{ always() && matrix.shard == 1 && startsWith(github.head_ref, 'feat/ar4-wf32-material-binding-') }}
        run: |
          evidence_dir="artifacts/browser/shard-1"
          for proof_file in \
            "$evidence_dir/ar4-forest-fork-semantic-320.png" \
            "$evidence_dir/ar4-forest-fork-native-wf32-320.png" \
            "$evidence_dir/ar4-mountain-pass-native-wf32-390.png" \
            "$evidence_dir/ar4-mountain-monastery-native-wf32-390.png" \
            "$evidence_dir/ar4-mountain-monastery-csharp-focus-390.png" \
            "$evidence_dir/ar4-mountain-pass-moving-camera-390.png" \
            "$evidence_dir/ar4-forest-fork-source32-prototype-320.png" \
            "$evidence_dir/ar4-mountain-pass-source32-prototype-390.png" \
            "$evidence_dir/ar4-mountain-monastery-source32-prototype-390.png" \
            "$evidence_dir/ar4-forest-fork-quiet-road-study-320.png" \
            "$evidence_dir/ar4-mountain-pass-quiet-road-study-390.png" \
            "$evidence_dir/ar4-mountain-monastery-quiet-road-study-390.png" \
            "$evidence_dir/ar4-forest-fork-world-source-320.png" \
            "$evidence_dir/ar4-mountain-pass-world-source-390.png" \
            "$evidence_dir/ar4-mountain-monastery-world-source-390.png" \
            "$evidence_dir/ar4-forest-fork-stone-ground-study-320.png" \
            "$evidence_dir/ar4-mountain-pass-stone-ground-study-390.png" \
            "$evidence_dir/ar4-mountain-monastery-stone-ground-study-390.png"; do
            if [ -s "$proof_file" ]; then
              printf 'AR4_IMAGE_BEGIN %s\n' "$(basename "$proof_file")"
              base64 -w 32768 "$proof_file"
              printf '\nAR4_IMAGE_END\n'
            fi
          done

      - name: Preserve shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wyrmforge-browser-shard-${{ matrix.shard }}-${{ github.sha }}
          path: |
            artifacts/browser
            artifacts/browser-server.log
          if-no-files-found: warn
          retention-days: 14

  # Keep the historical 'browser' check name for branch protection.
  browser:
    name: browser
    if: always()
    needs: [preview, browser-shard]
    runs-on: ubuntu-latest
    steps:
      - name: Require preview and all four shards
        env:
          PREVIEW_RESULT: ${{ needs.preview.result }}
          SHARDS_RESULT: ${{ needs.browser-shard.result }}
        run: |
          test "$PREVIEW_RESULT" = "success"
          test "$SHARDS_RESULT" = "success"
