name: Animation unified baked locomotion-claw-turn source
on:
  pull_request:
    paths:
      - '.github/workflows/animation-unified-baked-source.yml'
      - 'tools/animation/author_hollow_foundation.py'
      - 'tools/animation/validate_source.py'
      - 'tools/animation/render_saved_clips.py'
      - 'tools/animation/export_atlases.py'
      - 'tools/animation/check_baked_atlas_budget.mjs'
      - 'tools/animation/check_baked_turn_entry.py'
      - 'tools/animation/replay_unified_baked.mjs'
      - 'tools/animation/replay_unified_claw.mjs'
      - 'tests/javascript/baked-claw-runtime-replay.test.mjs'
      - 'tools/animation/runtime_profile.py'
      - 'tools/animation/kinematics.py'
      - 'tools/animation/source_contacts.py'
      - 'tools/animation/capture-hunt.cjs'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/js/sprite-animation.js'
      - 'src/Wyrmforge.Presentation.Web/wwwroot/js/hollow-sprites.js'
      - 'art/source/animation-foundation/baked-compact-claw-20261029/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: animation-unified-baked-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unified-single-rig-source:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            tools/animation
            art/source/enemies/hollow/rigged-poc/model/local-appearance-004/rigged-hollow-zombie-reach-v3-standard
            art/source/animation-foundation/baked-compact-claw-20261029/source-manifest.json
            src/Wyrmforge.Presentation.Web/wwwroot/js
      - uses: actions/cache@v4
        id: blender
        with:
          path: .cache/blender-4.5.3-linux-x64
          key: animation-source-blender-4.5.3-linux-x64-975c58fc
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Restore pinned Blender
        if: steps.blender.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache
          curl --fail --location --retry 2 https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz -o .cache/blender.tar.xz
          echo '975c58fcb244273838534bba771e64ad87739216b0f9b39a888531a49a72d845  .cache/blender.tar.xz' | sha256sum --check
          tar --no-same-owner -xf .cache/blender.tar.xz -C .cache
          rm .cache/blender.tar.xz
      - name: Author walk claw and both real turning clips on the SAME editable rig
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install Pillow==12.0.0
          BLENDER_BIN="$PWD/.cache/blender-4.5.3-linux-x64/blender"
          SOURCE=artifacts/an6-unified-source
          REVIEW=artifacts/an6-unified-atlas
          "$BLENDER_BIN" -b -t 2 --python-exit-code 1 --python tools/animation/author_hollow_foundation.py -- --out "$SOURCE" --only walk,attack-travel,pivot,pivot-negative --phase-samples 16 --action-samples 8 --stride-metres 0.5 --stance-fraction 0.6 --flexion-reserve-pixels 2 --pelvis-drop-metres 0.075 --compress-source
          "$BLENDER_BIN" -b -t 2 --python-exit-code 1 --python tools/animation/validate_source.py -- "$SOURCE"
          python3 tools/animation/test_source_qc.py "$SOURCE" --blender "$BLENDER_BIN"
          python3 - <<'PY'
          import json
          from pathlib import Path
          source=json.loads(Path('artifacts/an6-unified-source/source-manifest.json').read_text())
          original=json.loads(Path('art/source/animation-foundation/baked-compact-claw-20261029/source-manifest.json').read_text())
          assert set(source['clips'])=={'walk','attack-travel','pivot','pivot-negative'}
          assert source['clips']['attack-travel']['frames']==128
          assert len(source['skeleton'])==len(original['skeleton'])==22
          max_rest=0
          for current,baseline in zip(source['skeleton'],original['skeleton']):
              assert (current['id'],current['parent'])==(baseline['id'],baseline['parent'])
              max_rest=max(max_rest,max(abs(a-b) for a,b in zip(current['rest'],baseline['rest'])),
                           abs(current['length']-baseline['length']))
          assert max_rest<=5e-7,('Source changed saved claw rest rig',max_rest)
          assert source['candidateNotApproved'] and not source['runtimeIntegrated']
          print('Single-rig source with four clips; maximum saved claw rest delta:',max_rest)
          PY
          "$BLENDER_BIN" -b -t 2 --python-exit-code 1 --python tools/animation/render_saved_clips.py -- "$SOURCE" --clips walk,attack-travel,pivot,pivot-negative
          python3 tools/animation/export_atlases.py "$SOURCE" --out "$REVIEW" --tight-crop --clips walk,attack-travel,pivot,pivot-negative
          # Record the complete 3-map texture projection; never increase the
          # 64MiB bound, drop material passes, or falsely certify this source.
          set +e
          node tools/animation/check_baked_atlas_budget.mjs --production-maps "$REVIEW/manifest.json" > "$REVIEW/three-map-budget.json"
          BUDGET_EXIT=$?
          set -e
          if [ "$BUDGET_EXIT" -gt 1 ]; then
            echo 'Budget checker failed to parse the source pack.'
            exit "$BUDGET_EXIT"
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('artifacts/an6-unified-atlas')
          manifest=json.loads((root/'manifest.json').read_text())
          budget=json.loads((root/'three-map-budget.json').read_text())
          assert set(manifest['clips'])=={'walk','attack-travel','pivot','pivot-negative'}
          assert len(manifest['directions'])==8
          assert not manifest['productionReady'] and not manifest['runtimeIntegrated']
          assert budget['maxDecodedBytes']==64*1024*1024
          assert budget['overBudget']==(budget['decodedBytes']>budget['maxDecodedBytes'])
          print('Unified AN6 source budget:',budget['decodedBytes'], 'overBudget:',budget['overBudget'])
          print('Source and actual render evidence ONLY; no runtime, one-pixel, lighting or owner acceptance.')
          PY
          # Experimental native-pixel study: retain the source-verified 16
          # frames but render every second source turn pose at 6 FPS in a
          # separate review pack. Never call it accepted without a turn replay.
          SMALL=artifacts/an6-unified-half-pivot-atlas
          python3 tools/animation/export_atlases.py "$SOURCE" --out "$SMALL" --tight-crop --clips walk,attack-travel,pivot,pivot-negative --experimental-half-pivots
          set +e
          node tools/animation/check_baked_atlas_budget.mjs --production-maps "$SMALL/manifest.json" > "$SMALL/three-map-budget.json"
          SMALL_BUDGET_EXIT=$?
          set -e
          if [ "$SMALL_BUDGET_EXIT" -gt 1 ]; then exit "$SMALL_BUDGET_EXIT"; fi
          python3 tools/animation/check_baked_turn_entry.py --self-test
          # Source marker continuity is a strict mandatory gate. Even a
          # passed source gate does NOT imply in-Hunt or art acceptance.
          python3 tools/animation/check_baked_turn_entry.py "$REVIEW/profile.json" > "$REVIEW/pivot-entry-diagnostics.json"
          python3 tools/animation/check_baked_turn_entry.py "$SMALL/profile.json" > "$SMALL/pivot-entry-diagnostics.json"
          # The authored Blender contact transition is not enough. Replay
          # the real exported clip/controller at 15,30,60,120Hz and retain
          # the one-pixel correction failures in both native atlas variants.
          node tools/animation/replay_unified_baked.mjs "$REVIEW/profile.json" "$REVIEW/runtime-turn-replay.json" --diagnostic
          node tools/animation/replay_unified_baked.mjs "$SMALL/profile.json" "$SMALL/runtime-turn-replay.json" --diagnostic
          node tools/animation/replay_unified_claw.mjs "$REVIEW/profile.json" "$REVIEW/runtime-claw-replay.json" --diagnostic
          node tools/animation/replay_unified_claw.mjs "$SMALL/profile.json" "$SMALL/runtime-claw-replay.json" --diagnostic
          python3 - <<'PY'
          import json
          from pathlib import Path
          full=json.loads(Path('artifacts/an6-unified-atlas/manifest.json').read_text())
          half=json.loads(Path('artifacts/an6-unified-half-pivot-atlas/manifest.json').read_text())
          budget=json.loads(Path('artifacts/an6-unified-half-pivot-atlas/three-map-budget.json').read_text())
          assert half['experimentalHalfPivotFrames'] and not half['productionReady']
          assert full['clips']['walk']['sha256']==half['clips']['walk']['sha256']
          assert full['clips']['attack-travel']['sha256']==half['clips']['attack-travel']['sha256']
          for name in ('pivot','pivot-negative'):
              assert full['clips'][name]['frames']==16 and half['clips'][name]['frames']==8
              assert half['clips'][name]['experimentalSourceFrameIndices']==[round(i*15/7) for i in range(8)]
              assert half['sourceQC'][name]['frames']==16, 'Must retain full independent source QC'
          assert budget['maxDecodedBytes']==64*1024*1024
          print('Eight-native-frame turn review (not runtime accepted):',budget['decodedBytes'],
                'bytes; over budget:',budget['overBudget'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: an6-unified-real-source-four-clip-study
          path: |
            artifacts/an6-unified-atlas/
            artifacts/an6-unified-half-pivot-atlas/
            artifacts/an6-unified-source/source-manifest.json
            artifacts/an6-unified-source/independent-source-qc.json
            artifacts/an6-unified-source/negative-source-qc.json
            artifacts/an6-unified-source/render-receipt.json
          if-no-files-found: warn
          retention-days: 14

  capture-unified-csharp-review:
    name: Real C# 320/390px unified claw and pivot capture
    needs: unified-single-rig-source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Restore source art used by the real game
        shell: bash
        run: |
          set -euo pipefail
          git lfs pull --include="src/Wyrmforge.Presentation.Web/wwwroot/**" --exclude=""
          python3 tools/development/verify_web_assets.py
      - name: Rebuild source-backed Wet Forest ground for real C# lab
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -r tools/art/painted-requirements.txt
          python3 tools/art/build_grass_moss_art_candidates.py --output src/Wyrmforge.Presentation.Web/wwwroot/art/environment/wet-forest-source-backed/v1/grass-moss-art-candidates
          python3 tools/art/build_wet_mud_art_candidates.py --output src/Wyrmforge.Presentation.Web/wwwroot/art/environment/wet-forest-source-backed/v1/wet-mud-art-candidates
          python3 tools/art/build_trampled_earth_art_candidates.py --output src/Wyrmforge.Presentation.Web/wwwroot/art/environment/wet-forest-source-backed/v1/trampled-earth-art-candidates
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish the actual C# game
        shell: bash
        run: |
          set -euo pipefail
          dotnet --list-sdks | grep -Eq '^10[.]0[.]' || { echo '::error::Missing .NET 10 SDK'; exit 1; }
          dotnet restore src/Wyrmforge.Presentation.Web/Wyrmforge.Presentation.Web.csproj
          dotnet publish src/Wyrmforge.Presentation.Web/Wyrmforge.Presentation.Web.csproj -c Release --no-restore -o artifacts/web
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install actual browser
        shell: bash
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: an6-unified-real-source-four-clip-study
          path: artifacts
      - name: Capture both mobile framebuffer widths using unified native-pivot atlas
        shell: bash
        run: |
          set -euo pipefail
          for width in 320 390; do
            AN_FOUNDATION_MODE=sprite-claw AN_MOBILE=1 AN_WIDTH="$width" AN_CAPTURE_DIR="artifacts/an6-unified-csharp-$width" AN_ASSET_ROOT="artifacts/an6-unified-half-pivot-atlas" node tools/animation/capture-hunt.cjs
          done
          node - <<'NODE'
          const fs=require('fs');
          for(const width of [320,390]){
            const root=`artifacts/an6-unified-csharp-${width}`;
            const summary=JSON.parse(fs.readFileSync(root+'/capture-summary.json','utf8'));
            const trace=JSON.parse(fs.readFileSync(root+'/motion-trace.json','utf8'));
            const entities=trace.flatMap(sample=>sample.hollow?.entities??[]);
            const actionSamples=entities.filter(entity=>entity.foundation?.clip==='attack-travel').length;
            const drawnClawFrames=Math.max(0,...entities.map(entity=>entity.foundationClawDrawnFrames??0));
            const pivotSamples=entities.filter(entity=>['pivot','pivot-negative'].includes(entity.foundation?.clip)).length;
            const drawnSpriteFrames=Math.max(0,...entities.map(entity=>entity.foundationDrawnFrames??0));
            const report={width,scene:summary.scene,physicalDevice:false,sourceLitOnly:true,
              actionSamples,drawnClawFrames,pivotSamples,drawnSpriteFrames,
              maxNativeMarkerSlip:summary.maximumNativeMarkerSlip,
              withinOneNativePixel:summary.markerContactWithinOneNativePixel===true,
              errors:summary.errors,missingResources:summary.failedResources};
            fs.writeFileSync(root+'/unified-csharp-proof.json',JSON.stringify(report,null,2)+'\n');
            console.log(JSON.stringify({width,actionSamples,drawnClawFrames,pivotSamples,
              maxNativeMarkerSlip:report.maxNativeMarkerSlip,withinOneNativePixel:report.withinOneNativePixel}));
            if(!actionSamples||!drawnClawFrames)throw Error('No actual drawn full-body claw at '+width+' native pixels');
            if(!report.withinOneNativePixel)throw Error('Unacceptable C# source marker drift at '+width+' native pixels');
            if(report.errors.length||report.missingResources.length)throw Error('C# capture contains browser or asset errors at '+width+' native pixels');
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: an6-unified-real-csharp-enemy-lab
          path: |
            artifacts/an6-unified-csharp-320/
            artifacts/an6-unified-csharp-390/
          if-no-files-found: warn
          retention-days: 14
