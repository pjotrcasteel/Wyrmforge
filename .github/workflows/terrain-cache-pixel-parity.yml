name: Terrain cache pixel parity

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/Wyrmforge.Presentation.Web/wwwroot/js/arena-terrain-canvas.js'
      - 'tests/Wyrmforge.Browser.Tests/TerrainEvidenceCaptureBrowserTests.cs'
      - 'tests/Wyrmforge.Browser.Tests/TerrainRepaintPixelBrowserTests.cs'
      - '.github/workflows/terrain-cache-pixel-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-terrain:
    name: Real Hunt cached-vs-fresh ground pixels
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore runtime art
        run: |
          git lfs pull --include="src/Wyrmforge.Presentation.Web/wwwroot/**" --exclude=""
          python3 tools/development/verify_web_assets.py

      - name: Require preinstalled .NET 10 SDK
        run: dotnet --list-sdks | grep -Eq '^10\.0\.' || { echo "::error::Missing .NET 10 SDK"; exit 1; }

      - name: Regenerate required source-backed art
        run: |
          python3 -m pip install -r tools/art/painted-requirements.txt
          python3 tools/art/build_grass_moss_art_candidates.py --output src/Wyrmforge.Presentation.Web/wwwroot/art/environment/wet-forest-source-backed/v1/grass-moss-art-candidates
          python3 tools/art/build_wet_mud_art_candidates.py --output src/Wyrmforge.Presentation.Web/wwwroot/art/environment/wet-forest-source-backed/v1/wet-mud-art-candidates
          python3 tools/art/build_trampled_earth_art_candidates.py --output src/Wyrmforge.Presentation.Web/wwwroot/art/environment/wet-forest-source-backed/v1/trampled-earth-art-candidates

      - name: Restore, build browser tests and publish actual game
        run: |
          dotnet restore tests/Wyrmforge.Browser.Tests/Wyrmforge.Browser.Tests.csproj
          dotnet build tests/Wyrmforge.Browser.Tests/Wyrmforge.Browser.Tests.csproj -c Release --no-restore
          dotnet restore src/Wyrmforge.Presentation.Web/Wyrmforge.Presentation.Web.csproj
          dotnet publish src/Wyrmforge.Presentation.Web/Wyrmforge.Presentation.Web.csproj -c Release --no-restore -o ./artifacts/terrain-proof

      - name: Install Chromium
        run: pwsh tests/Wyrmforge.Browser.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Start actual app
        run: |
          python3 tools/development/spa_server.py --port 4173 --directory ./artifacts/terrain-proof/wwwroot > ./artifacts/terrain-proof-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat ./artifacts/terrain-proof-server.log
          exit 1

      - name: Prove live crater cache equals independently repainted ground
        env:
          WYRMFORGE_BASE_URL: http://127.0.0.1:4173/
          WYRMFORGE_BROWSER_ARTIFACTS: ${{ github.workspace }}/artifacts/terrain-evidence
        run: >
          dotnet test tests/Wyrmforge.Browser.Tests/Wyrmforge.Browser.Tests.csproj
          -c Release --no-build
          --filter 'FullyQualifiedName~LiveHunt_RepeatedImpactsMatchIndependentGroundRepaint'
          --logger 'console;verbosity=normal'
          --blame-hang-timeout 5m --blame-hang-dump-type none

      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: terrain-cache-pixel-evidence-${{ github.sha }}
          path: |
            artifacts/terrain-evidence
            artifacts/terrain-proof-server.log
          if-no-files-found: warn
          retention-days: 7
