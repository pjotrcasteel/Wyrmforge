name: Wizard actor source
on:
  pull_request:
    paths:
      - 'tools/sprite-lab/build_wizard_blender.py'
      - 'tools/sprite-lab/wizard_motion.py'
      - 'tools/sprite-lab/character_pipeline/**'
      - 'tools/sprite-lab/review_gait.py'
      - 'tools/sprite-lab/tests/test_wizard_*.py'
      - 'tools/sprite-lab/tests/test_biped_reuse.py'
      - 'tools/sprite-lab/tests/test_humanoid_rig.py'
      - 'art/source/characters/wizard/BLENDER-SOURCE.md'
      - '.github/workflows/wizard-actor-source.yml'
  workflow_dispatch:
jobs:
  wizard-motion-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Blender authoring source without bpy
        run: python -m py_compile tools/sprite-lab/build_wizard_blender.py tools/sprite-lab/wizard_motion.py
      - name: Check six wizard source and planted-foot motion invariants
        working-directory: tools/sprite-lab
        run: |
          python -m unittest discover -s tests -p 'test_wizard_motion.py' -v
          python -m unittest discover -s tests -p 'test_biped_reuse.py' -v
          python -m unittest discover -s tests -p 'test_humanoid_rig.py' -v
          python -m unittest discover -s tests -p 'test_wizard_blender_source.py' -v
