<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <base href="/" />
    <title>Wyrmforge</title>
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="art/icons.css" />
    <link rel="stylesheet" href="css/ignition.css?v=__WYRMFORGE_BUILD__" />
    <link rel="stylesheet" href="css/dragon-harvest.css" />
    <link rel="stylesheet" href="Wyrmforge.Presentation.Web.styles.css" />
    <link rel="stylesheet" href="css/run-overlays.css" />
    <link rel="stylesheet" href="css/town-panorama.css?v=__WYRMFORGE_BUILD__" />
    <link rel="stylesheet" href="css/town-canonical.css?v=__WYRMFORGE_BUILD__" />
    <link rel="stylesheet" href="css/nexus.css?v=__WYRMFORGE_BUILD__" />
</head>
<body class="igniting">
    <div id="wyrmforge-ignition" class="ignition-screen" role="status" aria-live="polite" aria-label="Igniting Wyrmforge">
        <div class="ignition-content">
            <div class="ignition-sigil" aria-hidden="true"><span class="ignition-sigil-core">◆</span></div>
            <p class="ignition-kicker">THE REALM IS AWAKENING</p>
            <h1>IGNITING <span>WYRMFORGE</span></h1>
            <div class="ignition-progress" aria-hidden="true"><span></span></div>
            <p class="ignition-status" id="ignition-status">PREPARING THE HUNT</p>
            <button type="button" id="ignition-retry" class="ignition-retry" hidden>TRY AGAIN</button>
        </div>
    </div>
    <div id="app">Preparing Wyrmforge…</div>
    <script src="js/sound-design.js?v=__WYRMFORGE_BUILD__"></script>
    <script src="js/audio.js?v=__WYRMFORGE_BUILD__"></script>
    <script src="js/arcane-web.js?v=__WYRMFORGE_BUILD__"></script>
    <script src="js/refuge-town.js?v=__WYRMFORGE_BUILD__"></script>
    <script src="js/playtest.js?v=__WYRMFORGE_BUILD__"></script>
    <script src="_framework/blazor.webassembly.js?v=__WYRMFORGE_BUILD__" autostart="false"></script>
    <script>
        (() => {
            const build = "__WYRMFORGE_BUILD__";
            const app = document.getElementById("app");
            const splash = document.getElementById("wyrmforge-ignition");
            const status = document.getElementById("ignition-status");
            const retry = document.getElementById("ignition-retry");
            const startedAt = performance.now();
            performance.mark("wyrmforge:boot-start");
            const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            const minimumIntroMs = reducedMotion ? 0 : 1100;
            let started = false;
            let sceneReadiness;

            const isHomeRoute = () => {
                const base = new URL(document.baseURI).pathname.replace(/\/+$/, "");
                const path = location.pathname.replace(/\/index\.html$/, "").replace(/\/+$/, "");
                return path === base;
            };

            // Reuse the existing full-screen ignition art for the first town entry.
            // The welcome screen is a separate, real illustration; opening town must
            // not reveal a half-decoded panorama or progressively appearing buildings.
            const reveal = () => {
                const remaining = Math.max(0, minimumIntroMs - (performance.now() - startedAt));
                window.setTimeout(() => {
                    splash.classList.remove("ignition-entering");
                    document.body.classList.remove("igniting");
                    splash.classList.add("ignition-complete");
                }, remaining);
            };
            const beginTown = (requireTown = false) => {
                if (!sceneReadiness) return;
                splash.classList.add("ignition-entering");
                splash.classList.remove("ignition-complete", "ignition-failed");
                retry.hidden = true;
                status.textContent = "AWAKENING THE REFUGE";
                document.body.classList.add("igniting");
                const ready = requireTown ? sceneReadiness.waitForTownScene() : sceneReadiness.waitForTownOrCreation();
                void ready.then(reveal).catch(fail);
            };

            // The framework supplies a SHA-256 integrity hash for immutable boot assets.
            // Reuse their cached URLs between releases; change only when bytes change.
            // Files without a hash still use the deployment SHA for cache invalidation.
            const versionedResource = (type, name, defaultUri, integrity) => {
                if (!defaultUri) return defaultUri;
                const uri = new URL(defaultUri, document.baseURI);
                const revision = typeof integrity === "string" && /^sha256-[A-Za-z0-9+/=]+$/.test(integrity)
                    ? integrity : build;
                uri.searchParams.set("v", revision);
                return uri.toString();
            };

            const fail = error => {
                console.error("Wyrmforge failed to ignite.", error);
                if (!splash) return;
                splash.classList.add("ignition-failed");
                status.textContent = "THE FORGE COULD NOT IGNITE";
                retry.hidden = false;
            };

            // A real first download can exceed nine seconds on mobile. Never reload a
            // healthy, still-progressing WASM download: it would discard all progress.
            retry.addEventListener("click", () => window.location.reload());
            let slowStartupTimer;
            let recoveryTimer;

            Promise.resolve()
                .then(async () => {
                    // G4-only consent is the FIRST screen, before Blazor/Gate/Hunt
                    // creates any other menus. Ordinary WyrmForge never loads it.
                    if (new URLSearchParams(location.search).get("g4Review") === "1") {
                        const uri = new URL("js/lighting/g4-consent-gate.js", document.baseURI);
                        uri.searchParams.set("v", build);
                        const { showG4PreflightChoice } = await import(uri.href);
                        await showG4PreflightChoice();
                    }
                    slowStartupTimer = window.setTimeout(() => {
                        if (!started) status.textContent = "FIRST LAUNCH MAY TAKE A MOMENT";
                    }, 8000);
                    recoveryTimer = window.setTimeout(() => {
                        if (!started) fail(new Error("Startup still incomplete. Manual retry available."));
                    }, 90000);
                    if (!window.Blazor) throw new Error("Blazor bootstrap was not loaded.");
                    // Import before WASM starts so the welcome and school-selection
                    // callbacks can re-arm this same veil without a flash.
                    sceneReadiness = await import(new URL(
                        "js/startup-scene-readiness.js?v=" + encodeURIComponent(build), document.baseURI).href);
                    window.wyrmforgeStartup = { beginTown };
                    return window.Blazor.start({ loadBootResource: versionedResource });
                })
                .then(async () => {
                    started = true;
                    window.clearTimeout(recoveryTimer);
                    window.clearTimeout(slowStartupTimer);
                    performance.mark("wyrmforge:boot-ready");
                    performance.measure("wyrmforge:boot", "wyrmforge:boot-start", "wyrmforge:boot-ready");

                    if (isHomeRoute()) {
                        status.textContent = "PREPARING THE REFUGE";
                        // WASM booted is not artwork ready: wait for restored player
                        // progress, decoded town/welcome images, and the first paint.
                        await sceneReadiness.waitForInitialScene();
                    }
                    reveal();
                })
                .catch(error => {
                    window.clearTimeout(recoveryTimer);
                    window.clearTimeout(slowStartupTimer);
                    fail(error);
                });
        })();
    </script>
</body>
</html>
